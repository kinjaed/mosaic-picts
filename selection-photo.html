<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sélection photo</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f7f7f7;
    --border: #dcdcdc;
    --text: #262633;
    --muted: #8a8a9e;
    --accent: #16b378;
    --danger: #d0021b;
    --radius: 999px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 13px;
  }
  body {
    display: flex;
    align-items: flex-start;
    padding: 6px 8px;
  }

  .bar { display: flex; flex-wrap: wrap; gap: 8px; }

  button.choice {
    font: inherit;
    padding: 4px 14px;
    border: 1.5px solid var(--chip-fill, var(--border));
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--chip-fill, var(--text));
    cursor: pointer;
    transition: background 0.1s ease, border-color 0.1s ease, color 0.1s ease;
  }
  button.choice:hover:not(:disabled) { background: var(--surface); }
  button.choice:disabled { opacity: 0.45; cursor: default; }
  button.choice.active {
    background: var(--chip-fill, var(--accent));
    border-color: var(--chip-fill, var(--accent));
    color: var(--chip-text, #fff);
    font-weight: 600;
  }

  .hint {
    color: var(--muted);
    font-size: 12px;
    padding: 4px 2px;
  }
  .hint.error { color: var(--danger); }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #32323f;
      --surface: #3b3b4a;
      --border: #57576b;
      --text: #efefef;
      --muted: #a4a4b6;
    }
  }

  /* ---- Cadres : choix (gris clair) / actions (gris foncé) ---- */
  :root {
    --panel-a: #ececf1; --panel-b: #5c5c6a; --edge: #9b9bac;
    --save: #d93a3a; --hist: #9dbdf5; --slider: #4a8df0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --panel-a: #3b3b4a; --panel-b: #1f1f29; --edge: #6d6d82; }
  }
  .root { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 8px; }
  .wrap { display: flex; gap: 8px; width: 100%; flex: none; align-items: stretch; }
  .panel.gallery { flex: 1; min-height: 90px; display: flex; flex-direction: column; padding: 0; overflow: hidden; background: var(--panel-a); }
  .g-head { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--border); }
  .g-title { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .g-count { color: var(--muted); font-size: 12px; margin-right: auto; }
  .g-head input[type=range] { width: 140px; accent-color: var(--slider); }
  .g-body { flex: 1; overflow: auto; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; align-items: flex-start; }
  .panel { border-radius: 14px; padding: 8px 10px; }

  /* ---- Tableau « Liste des habits » ---- */
  .panel.habits { flex: 1; min-height: 150px; display: flex; flex-direction: column; padding: 0; overflow: hidden; background: var(--panel-a); }
  .panel.habits .g-head { background: var(--surface); }
  .sw { position: relative; display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-size: 12px; font-weight: 600; }
  .sw input { position: absolute; opacity: 0; width: 0; height: 0; }
  .sw .track { position: relative; width: 34px; height: 18px; border-radius: 999px; background: var(--edge); transition: background .15s ease; }
  .sw .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s ease; }
  .sw input:checked + .track { background: var(--accent); }
  .sw input:checked + .track::after { transform: translateX(16px); }
  .sw input:focus-visible + .track { outline: 2px solid var(--slider); outline-offset: 2px; }
  .hb-head { display: flex; align-items: center; gap: 10px; }
  .hb-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .g-head input.hb-size[type=range] { margin-left: auto; width: 110px; }
  .hb-search { flex: 0 1 190px; min-width: 90px; box-sizing: border-box; font: inherit; font-size: 12px; padding: 3px 10px; color: #143a22; background: #dcf5e3; border: 1px solid #a9dcb8; border-radius: 999px; }
  .hb-search::placeholder { color: #4f7a5c; }
  .hb-search:focus { outline: 2px solid #6fcf8e; outline-offset: 1px; }
  .g-btn { flex: none; padding: 2px 10px; font: inherit; font-size: 12px; color: var(--text); background: var(--bg); border: 1px solid var(--edge); border-radius: 8px; cursor: pointer; }
  .g-btn:hover { background: var(--border); }
  .panel.gallery.collapsed, .panel.habits.collapsed { flex: none; min-height: 0; }
  .panel.gallery.collapsed .g-body, .panel.habits.collapsed .hb-main { display: none; }
  .panel.gallery.collapsed .g-head, .panel.habits.collapsed .g-head { border-bottom: 0; cursor: pointer; }
  .sw.sm { display: inline-flex; vertical-align: middle; }
  .sw.sm .track { width: 30px; height: 16px; }
  .sw.sm .track::after { width: 12px; height: 12px; }
  .sw.sm input:checked + .track::after { transform: translateX(14px); }
  .sw.violet input:checked + .track { background: #8b5cf6; }
  .sw.violet input:focus-visible + .track { outline-color: #8b5cf6; }
  select.hb-note, input.hb-note {
    font: inherit; font-size: 12px; color: var(--text); background: var(--bg); color-scheme: light dark;
    border: 1px solid var(--edge); border-radius: 8px; padding: 3px 8px; max-width: 100%;
  }
  select.hb-note, input.hb-note { width: auto; min-width: 0; text-align: center; text-align-last: center; }
  input.hb-note { width: 5em; }
  .hb-note:disabled { opacity: .55; }
  .hb-main { flex: 1; min-height: 0; display: flex; }
  .hb-types { flex: none; width: 170px; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--border); }
  .tp { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 8px 12px; text-align: left;
        font: inherit; font-size: 13px; color: var(--text); background: transparent; border: 1.5px solid transparent; border-radius: 999px; cursor: pointer; }
  .tp:hover { background: var(--surface); }
  .tp.on { font-weight: 700; background: rgba(56, 152, 214, .16); border-color: #2b86c5; }
  .tp .tp-l { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tp .tp-n { flex: none; font-size: 12px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tp.on .tp-n { color: #2b86c5; font-weight: 600; }
  .tp.zero { opacity: .5; }
  table.hb tbody tr[hidden], .hint[hidden] { display: none; }
  .tp-cap { padding: 2px 12px 4px; font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .hb-body { flex: 1; min-width: 0; min-height: 0; overflow: auto; }
  table.hb th.min, table.hb td.min { width: 1%; white-space: nowrap; text-align: center; }
  button.plus { width: 16px; height: 16px; margin-left: 6px; padding: 0; vertical-align: middle; font-size: 12px; line-height: 1; color: var(--text); background: var(--bg); border: 1px solid var(--edge); border-radius: 50%; cursor: pointer; }
  button.plus:hover { color: #fff; background: var(--accent); border-color: var(--accent); }
  .lb .lb-rm { position: absolute; right: 12px; bottom: 12px; padding: 7px 16px; font: inherit; font-size: 13px; font-weight: 600; color: #fff; background: #d64545; border: 0; border-radius: 999px; cursor: pointer; }
  .lb .lb-rm:hover { background: #bf3535; }
  .lb .lb-rm:disabled { opacity: .6; cursor: default; }
  table.hb tbody tr { cursor: pointer; }
  table.hb tbody tr.sel td { background-image: linear-gradient(rgba(22, 179, 120, .22), rgba(22, 179, 120, .22)); box-shadow: inset 0 1px 0 var(--accent), inset 0 -1px 0 var(--accent); }
  table.hb tbody tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent), inset 0 1px 0 var(--accent), inset 0 -1px 0 var(--accent); }
  table.hb { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.hb th { position: sticky; top: 0; z-index: 1; padding: 6px 10px; text-align: left; white-space: nowrap; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--panel-a); border-bottom: 1px solid var(--border); }
  table.hb td { padding: 4px 10px; vertical-align: middle; border-bottom: 1px solid var(--border); }
  table.hb tbody tr:hover td { background-color: var(--surface); }
  table.hb td.c { text-align: center; }
  table.hb td.n { text-align: right; font-variant-numeric: tabular-nums; }
  table.hb img.hb-th { display: block; margin: 0 auto; height: var(--hbh, 56px); width: auto; min-width: 20px; max-width: none; border-radius: 6px; background: var(--border); cursor: zoom-in; }
  .hb-body .hint { padding: 12px; }
  .panel.choices { flex: 1; min-width: 0; background: var(--panel-a); overflow-y: auto; display: flex; flex-direction: column; }
  .panel.choices .bar { flex: 1 0 auto; align-content: flex-start; }
  .panel.actions { flex: none; background: var(--panel-a); display: flex; flex-direction: row; gap: 12px; align-items: center; }
  .btns { display: flex; flex-direction: column; gap: 8px; }
  .act {
    font: inherit; font-weight: 600; padding: 6px 18px; color: #fff; cursor: pointer;
    border: 1.5px solid var(--edge); border-radius: 999px; transition: filter .12s ease, transform .05s ease;
  }
  .act:hover:not(:disabled) { filter: brightness(1.1); }
  .act:active:not(:disabled) { transform: translateY(1px); }
  .act:disabled { opacity: .5; cursor: default; }
  .act.add { background: #2b86c5; padding: 8px 22px; }
  .g-btn.save { color: #fff; background: var(--save); border-color: transparent; }
  .g-btn.hist { color: #14284b; background: var(--hist); border-color: transparent; }
  .g-btn.save:hover:not(:disabled), .g-btn.hist:hover:not(:disabled) { filter: brightness(1.1); }
  .g-btn.save:hover:not(:disabled) { background: var(--save); }
  .g-btn.hist:hover:not(:disabled) { background: var(--hist); }
  .g-btn:disabled { opacity: .5; cursor: default; }
  .g-btn.cam { display: inline-flex; align-items: center; padding: 2px 8px; }
  .g-btn.cam[aria-pressed=true] { color: #fff; background: var(--accent); border-color: var(--accent); }

  /* ---- Mosaïque de photos (dans le cadre LISTE DES HABITS) ---- */
  .panel.habits.mosaic-on .g-head .hb-search, .panel.habits.mosaic-on .hb-size, .panel.habits.mosaic-on .sw, .panel.habits.mosaic-on #hbCount { display: none !important; }
  .panel.habits.mosaic-on #hbMax { margin-left: auto; }
  .panel.habits.mosaic-on .hb-main { display: none; }
  .ms-root { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .panel.habits.mosaic-on .ms-root { display: flex; }
  .panel.habits.collapsed .ms-root { display: none; }
  .ms-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 7px 12px; }
  .ms-top { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px 14px; padding: 8px 12px 0; }
  .ms-find { display: flex; flex-direction: column; gap: 6px; flex: 0 1 230px; margin-left: auto; min-width: 150px; }
  .ms-find .hb-search { flex: none; width: 100%; }
  .ms-find .g-btn { width: 100%; padding: 3px 10px; }
  .ms-bar input[type=range] { width: 140px; accent-color: var(--slider); }
  .ms-types { display: flex; flex-wrap: wrap; flex: 1 1 260px; min-width: 0; gap: 2px; max-height: 96px; overflow-y: auto; }
  .ms-types:empty { display: none; }
  .ms-types button { padding: 4px 12px; font: inherit; font-size: 12px; color: var(--text); background: transparent; border: 1.5px solid transparent; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .ms-types button:hover { background: var(--surface); }
  .ms-types button[aria-pressed=true] { font-weight: 700; background: rgba(56, 152, 214, .16); border-color: #2b86c5; }
  .ms-main { flex: 1; min-height: 0; overflow: auto; padding: 4px 12px 12px; }
  .ms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--ms-size, 160px), 1fr)); gap: 10px; }
  .ms-tile { display: flex; flex-direction: column; padding: 0; text-align: left; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; }
  .ms-tile:hover { border-color: var(--accent); }
  .ms-tile.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .ms-tile .ph { width: 100%; aspect-ratio: 1 / 1; overflow: hidden; background: var(--border); }
  .ms-tile img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .ms-tile .cap { padding: 6px 8px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ms-empty { padding: 40px; text-align: center; color: var(--muted); }
  .ms-modal { position: fixed; inset: 0; z-index: 45; display: none; background: rgba(0, 0, 0, .78); }
  .ms-modal.on { display: flex; }
  .ms-box { margin: auto; width: min(1100px, 96vw); height: min(760px, 94vh); display: flex; overflow: hidden; color: var(--text); background: var(--bg); border-radius: 14px; }
  .ms-view { position: relative; flex: 1 1 60%; min-width: 0; display: flex; flex-direction: column; background: #0c0f0e; }
  .ms-stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 8px; overflow: hidden; touch-action: none; cursor: zoom-in; }
  .ms-stage img { width: 100%; height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; will-change: transform; }
  .ms-zoom { position: absolute; top: 8px; right: 8px; z-index: 2; display: flex; gap: 6px; }
  .ms-zoom button { min-width: 34px; height: 34px; padding: 0 8px; font-size: 16px; color: #fff; background: rgba(0, 0, 0, .55); border: 0; border-radius: 8px; cursor: pointer; }
  .ms-zoom button:hover { background: rgba(0, 0, 0, .8); }
  .ms-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 36px; height: 56px; font-size: 22px; color: #fff; background: rgba(0, 0, 0, .5); border: 0; border-radius: 8px; cursor: pointer; }
  #mPrev { left: 8px; } #mNext { right: 8px; }
  .ms-strip { display: flex; gap: 6px; padding: 6px; overflow-x: auto; }
  .ms-strip img { height: 48px; border-radius: 6px; cursor: pointer; opacity: .6; }
  .ms-strip img.cur { opacity: 1; outline: 2px solid var(--accent); }
  .ms-side { flex: 0 0 320px; max-width: 42%; display: flex; flex-direction: column; border-left: 1px solid var(--border); }
  .ms-side h2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0; padding: 12px 14px; font-size: 15px; border-bottom: 1px solid var(--border); }
  .ms-fields { flex: 1; min-height: 0; overflow: auto; padding: 10px 14px; }
  .ms-foot { display: flex; justify-content: flex-end; padding: 10px 14px; border-top: 1px solid var(--border); background: var(--surface); }
  .ms-f { margin-bottom: 10px; }
  .ms-f label { display: block; margin-bottom: 2px; font-size: 12px; color: var(--muted); }
  .ms-f input[type=text], .ms-f input[type=number], .ms-f textarea, .ms-f select {
    box-sizing: border-box; width: 100%; font: inherit; padding: 6px 10px; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; color-scheme: light dark;
  }
  .ms-f textarea { resize: vertical; min-height: 36px; }
  .ms-f .ro { padding: 6px 10px; color: var(--muted); background: var(--surface); border-radius: 10px; word-break: break-word; }
  .ms-f.saved input, .ms-f.saved textarea, .ms-f.saved select { border-color: var(--accent); }
  @media (max-width: 700px) {
    .ms-box { flex-direction: column; }
    .ms-side { flex: 0 0 45%; max-width: none; border-left: 0; border-top: 1px solid var(--border); }
  }
  .panel.gallery .g-head { flex-wrap: wrap; row-gap: 4px; }

  /* ---- Formulaire « Ajouter un habit » ---- */
  .add-dlg { width: min(820px, 100%); height: auto; max-height: 100%; }
  .add-body { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: 1fr minmax(190px, 250px); gap: 16px; padding: 14px 18px; }
  .af-grid { display: grid; grid-template-columns: 110px 1fr; gap: 8px 10px; align-content: start; align-items: center; min-width: 0; }
  .af-grid > label { color: var(--muted); font-weight: 600; font-size: 13px; }
  .af-grid > label.req::after { content: " *"; color: #d64545; }
  .af-grid > label.tall { align-self: start; padding-top: 7px; }
  .af-grid input[type=text], .af-grid input[type=number], .af-grid input[type=date], .af-grid input[type=datetime-local], .af-grid select, .af-grid textarea {
    box-sizing: border-box; width: 100%; font: inherit; padding: 6px 10px; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; color-scheme: light dark;
  }
  .af-grid textarea { resize: vertical; min-height: 56px; }
  .af-grid .af-bad { border-color: #d64545 !important; box-shadow: 0 0 0 2px rgba(214, 69, 69, .25); }
  .af-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .af-row > select, .af-row > input { flex: 1; min-width: 0; }
  .af-row .g-btn { padding: 2px 10px; font-weight: 700; }
  .af-pair { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .af-sub { color: var(--muted); font-weight: 600; font-size: 13px; }
  .af-grid .af-pair select { width: auto; }
  .af-grid .af-pair input[type=number] { width: 4.2em; padding: 6px 6px; text-align: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .chip { display: flex; align-items: center; gap: 4px; font-size: 13px; cursor: pointer; }
  .viewer { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .vw-stage { flex: 1; min-height: 190px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  .vw-stage img { display: block; max-width: 100%; max-height: 280px; object-fit: contain; cursor: zoom-in; }
  .vw-nav { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 12px; color: var(--muted); }
  .vw-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .add-err { color: #d64545; font-size: 13px; font-weight: 600; align-self: center; min-width: 0; }
  .add-btns { display: flex; gap: 8px; margin-left: auto; }
  @media (max-width: 560px) {
    .add-body { grid-template-columns: 1fr; }
    .af-grid { grid-template-columns: 90px 1fr; }
  }
  .datebox { display: flex; flex-direction: column; gap: 3px; }
  .datebox label { font-size: 11px; font-weight: 600; color: var(--muted); padding-left: 6px; }
  #saveDate {
    flex: none; font: inherit; font-size: 12px; padding: 2px 8px; color: var(--text); background: var(--bg);
    border: 1px solid var(--edge); border-radius: 8px; color-scheme: light dark;
  }

  /* ---- Fenêtre Historique ---- */
  .overlay {
    position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center;
    padding: 10px; background: rgba(18, 18, 30, .55); backdrop-filter: blur(3px);
  }
  .overlay.on { display: flex; }
  .dlg {
    width: min(1000px, 100%); height: min(660px, 100%); display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg); border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
  }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid var(--border); }
  .dlg-head h2 { margin: 0; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; }
  .xbtn { border: 0; background: var(--surface); color: var(--text); width: 30px; height: 30px; border-radius: 50%; font-size: 18px; line-height: 1; cursor: pointer; }
  .xbtn:hover { background: var(--border); }
  .dlg-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(170px, 270px) 1fr minmax(190px, 270px); gap: 14px; padding: 14px 18px; overflow: auto; }
  .left { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .field { display: flex; align-items: center; gap: 10px; }
  .field label { width: 52px; color: var(--muted); font-weight: 600; }
  .field select {
    flex: 1; min-width: 0; padding: 7px 10px; font: inherit; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  }
  .dates { flex: 1; min-height: 140px; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .dates-head, .pv-head { padding: 9px 14px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); }
  #dateList { flex: 1; overflow-y: auto; padding: 4px; }
  .date { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; font: inherit; color: var(--text); background: transparent; border: 0; border-radius: 8px; padding: 7px 10px; cursor: pointer; }
  .date:hover { background: var(--border); }
  .date .stars-n { flex: none; color: #f5c518; letter-spacing: 1px; font-size: 13px; white-space: nowrap; }
  .date[aria-selected="true"] { background: var(--accent); color: #fff; font-weight: 600; }
  .empty { color: var(--muted); padding: 16px; text-align: center; }
  .preview { display: flex; flex-direction: column; min-height: 180px; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .pv-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .pv-head input[type=range] { width: 150px; accent-color: var(--slider); }
  #pvBody { flex: 1; overflow: auto; padding: 14px; display: flex; flex-wrap: wrap; gap: 12px; align-content: flex-start; align-items: flex-start; }
  figure.ph { position: relative; margin: 0; width: var(--th, 160px); max-width: 100%; border-radius: 12px; overflow: hidden; background: var(--border); box-shadow: 0 2px 8px rgba(0, 0, 0, .18); }
  figure.ph img { display: block; width: 100%; height: auto; min-height: 40px; cursor: zoom-in; }
  figure.ph .none { display: flex; align-items: center; justify-content: center; width: 100%; aspect-ratio: 3 / 4; color: var(--muted); font-size: 12px; text-align: center; padding: 8px; }
  figure.ph figcaption { position: absolute; left: 6px; bottom: 6px; max-width: calc(100% - 12px); padding: 2px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(20, 20, 30, .72); color: #fff; }
  .dlg-foot { display: flex; justify-content: space-between; padding: 12px 18px; border-top: 1px solid var(--border); background: var(--surface); }
  .btn { font: inherit; font-weight: 600; padding: 8px 24px; border-radius: 999px; cursor: pointer; border: 1.5px solid var(--border); }
  .btn.ghost { background: transparent; color: var(--text); }
  .btn.ghost:hover { background: var(--border); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
  .btn:disabled { opacity: .45; cursor: default; }
  .detail { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 12px; overflow-y: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  .detail .fcol { display: flex; flex-direction: column; gap: 6px; }
  .detail label { color: var(--muted); font-weight: 600; }
  .detail select { width: 100%; padding: 7px 10px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 10px; }
  .detail .thumbs { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .detail .thumbs img { cursor: zoom-in; display: block; height: 170px; width: auto; max-width: 100%; object-fit: cover; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
  .detail .stars { display: flex; gap: 2px; }
  .detail .stars button { border: 0; background: transparent; padding: 0 2px; font-size: 30px; line-height: 1; cursor: pointer; color: #b5b5c0; transition: color .1s ease, transform .05s ease; }
  .detail .stars button.on { color: #f5c518; }
  .detail .stars button:hover:not(:disabled) { transform: scale(1.12); }
  .detail .stars button:disabled { opacity: .35; cursor: default; }
  .detail .fit-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--muted); font-weight: 600; }
  .detail .switch { position: relative; flex: none; width: 38px; height: 22px; padding: 0; border: 0; border-radius: 999px; background: var(--border); cursor: pointer; transition: background .15s ease; }
  .detail .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s ease; }
  .detail .switch[aria-checked="true"] { background: var(--accent); }
  .detail .switch[aria-checked="true"]::after { transform: translateX(16px); }
  .detail .thumbs.fit img { width: 100%; height: auto; max-width: 100%; object-fit: contain; }
  .detail .status { font-size: 11px; color: var(--muted); min-height: 14px; }
  .detail .status.error { color: var(--danger); }
  /* ---- Aperçu en grand (prend toute la place du widget) ---- */
  .lb { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 8px; background: rgba(18, 18, 30, .94); cursor: zoom-out; }
  .lb img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; border-radius: 8px; }
  .lb .lb-x { position: absolute; top: 8px; right: 8px; background: rgba(255, 255, 255, .85); color: #222; }
  .lb .lb-cap { position: absolute; left: 12px; bottom: 12px; padding: 3px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; background: rgba(0, 0, 0, .7); color: #fff; }

  /* ---- Date déjà enregistrée : remplacer / ajouter ---- */
  #dupOverlay, #wornOverlay { z-index: 60; }
  #brandOverlay { z-index: 70; }
  #delOverlay { z-index: 60; }
  .btn.danger { color: #fff; background: #d64545; border-color: #d64545; }
  .btn.danger:hover:not(:disabled) { filter: brightness(1.08); }
  .btn[hidden] { display: none; }
  .add-dlg .dlg-foot { gap: 10px; align-items: center; }
  #brandLbl { font-weight: 600; }
  .dup input[type=text] { box-sizing: border-box; width: 100%; font: inherit; padding: 7px 12px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  .dup .add-err { min-height: 0; }
  .dup .add-err:empty { display: none; }
  .dup { width: min(380px, 100%); display: flex; flex-direction: column; gap: 14px; padding: 16px 18px; background: var(--bg); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 16px 40px rgba(0, 0, 0, .35); }
  .dup p { margin: 0; line-height: 1.45; }
  .dup-btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .dup .btn { padding: 6px 16px; }
  body.win { display: block; padding: 0; }
  .win .overlay { padding: 0; background: var(--bg); backdrop-filter: none; }
  .win .dlg { width: 100%; height: 100%; border: 0; border-radius: 0; box-shadow: none; }
  @media (max-width: 460px) {
    .dlg-body { grid-template-columns: 1fr; }
    .dates { max-height: 200px; }
    .detail { max-height: 360px; }
  }
</style>
</head>
<body>

<div class="root">
<section id="gallery" class="panel gallery">
  <div class="g-head">
    <span class="g-title">Photos</span>
    <span id="gCount" class="g-count"></span>
    <input id="saveDate" type="date" aria-label="Date d'enregistrement" title="Date d'enregistrement">
    <button id="save" class="g-btn save" type="button" title="Enregistrer l'état actuel dans la table Historique">Enregistrer</button>
    <button id="hist" class="g-btn hist" type="button" title="Consulter et restaurer un enregistrement">Historique</button>
    <input id="gSize" type="range" min="60" max="360" value="140" aria-label="Taille des photos">
    <button id="gMax" class="g-btn" type="button" title="Agrandir ce cadre (réduit l'autre à sa barre de titre)">Agrandir</button>
  </div>
  <div id="gBody" class="g-body"></div>
</section>
<div class="wrap">
  <section class="panel choices">
    <div id="bar" class="bar">
      <span class="hint" id="hint">Chargement…</span>
    </div>
  </section>
  <aside class="panel actions">
    <button id="addBtn" class="act add" type="button" title="Ajouter un habit à la table Mes_habits">Ajouter</button>
  </aside>
</div>
<section id="habits" class="panel habits">
  <div class="g-head hb-head">
    <div class="hb-left">
      <span class="g-title">Liste des habits</span>
      <span id="hbCount" class="g-count"></span>
    </div>
    <input id="hbSearch" class="hb-search" type="search" placeholder="Rechercher…" aria-label="Rechercher dans le tableau" title="Filtre les lignes contenant le texte (toutes les colonnes)" autocomplete="off">
    <button id="hbMos" class="g-btn cam" type="button" aria-pressed="false" title="Afficher la mosaïque de photos" aria-label="Mosaïque de photos">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>
    </button>
    <input id="hbSize" class="hb-size" type="range" min="30" max="200" value="56" aria-label="Taille des photos du tableau" title="Taille des photos du tableau">
    <label class="sw hb-right" title="Afficher uniquement les lignes dont la colonne Select n'est pas vide">
      <span>Sélectionnés</span>
      <input type="checkbox" id="hbSel">
      <span class="track"></span>
    </label>
    <label class="sw hb-right violet" title="Afficher uniquement les habits à ranger (colonne A_ranger = vrai)">
      <span>A ranger</span>
      <input type="checkbox" id="hbRanger">
      <span class="track"></span>
    </label>
    <button id="hbMax" class="g-btn" type="button" title="Agrandir ce cadre (réduit l'autre à sa barre de titre)">Agrandir</button>
  </div>
  <div class="hb-main">
    <aside id="hbTypes" class="hb-types" aria-label="Types de vêtements"></aside>
    <aside id="hbEmps" class="hb-types" aria-label="Emplacements"></aside>
    <div id="hbBody" class="hb-body"></div>
  </div>
  <div id="mos" class="ms-root">
    <div class="ms-top">
      <div id="mTypes" class="ms-types" role="group" aria-label="Sélection rapide par type"></div>
      <div class="ms-find">
        <button id="mShow" class="g-btn" type="button" disabled title="Fermer la mosaïque et sélectionner dans le tableau la ligne de la vignette sélectionnée">Afficher dans le tableau</button>
        <input id="mQ" class="hb-search" type="search" placeholder="Rechercher dans toutes les colonnes…" autocomplete="off" aria-label="Rechercher dans la mosaïque">
      </div>
    </div>
    <div class="ms-bar">
      <span id="mCount" class="g-count"></span>
      <input id="mSize" type="range" min="80" max="400" value="160" aria-label="Taille des vignettes">
    </div>
    <div id="mMain" class="ms-main"><div id="mGrid" class="ms-grid"></div><div id="mMore"></div></div>
  </div>
</section>
</div>

<div id="dupOverlay" class="overlay" role="dialog" aria-modal="true">
  <div class="dup">
    <p id="dupMsg"></p>
    <div class="dup-btns">
      <button id="dupCancel" class="btn ghost" type="button">Annuler</button>
      <button id="dupAdd" class="btn ghost" type="button">Ajouter</button>
      <button id="dupReplace" class="btn primary" type="button">Remplacer</button>
    </div>
  </div>
</div>

<div id="addOverlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="addTitle">
  <div class="dlg add-dlg">
    <div class="dlg-head">
      <h2 id="addTitle">Ajouter un habit</h2>
      <button id="addX" class="xbtn" type="button" aria-label="Fermer">×</button>
    </div>
    <div class="add-body">
      <div id="addGrid" class="af-grid"></div>
      <div id="addViewer" class="viewer">
        <div id="vwStage" class="vw-stage"></div>
        <div class="vw-nav">
          <button id="vwPrev" class="g-btn" type="button" aria-label="Photo précédente">‹</button>
          <span id="vwCount"></span>
          <button id="vwNext" class="g-btn" type="button" aria-label="Photo suivante">›</button>
        </div>
        <div class="vw-btns">
          <button id="vwAdd" class="g-btn" type="button">Ajouter une photo</button>
          <button id="vwDel" class="g-btn" type="button">Supprimer la photo</button>
        </div>
        <input id="vwFile" type="file" accept="image/*" multiple hidden>
      </div>
    </div>
    <div class="dlg-foot">
      <button id="addDel" class="btn danger" type="button" hidden>Supprimer</button>
      <span id="addErr" class="add-err" role="alert"></span>
      <div class="add-btns">
        <button id="addCancel" class="btn ghost" type="button">Annuler</button>
        <button id="addSubmit" class="btn primary" type="button">Ajouter au dressing</button>
      </div>
    </div>
  </div>
</div>

<div id="brandOverlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="brandLbl">
  <div class="dup">
    <label id="brandLbl" for="brandInput">Nouvelle marque</label>
    <input id="brandInput" type="text" autocomplete="off" placeholder="Nom de la marque">
    <p id="brandErr" class="add-err"></p>
    <div class="dup-btns">
      <button id="brandNo" class="btn ghost" type="button">Annuler</button>
      <button id="brandYes" class="btn primary" type="button">Ajouter</button>
    </div>
  </div>
</div>

<div id="mModal" class="ms-modal" role="dialog" aria-modal="true">
  <div class="ms-box">
    <div class="ms-view">
      <div class="ms-stage" id="mStage"><img id="mBig" alt=""></div>
      <div class="ms-zoom">
        <button id="mZout" type="button" aria-label="Réduire" title="Réduire">−</button>
        <button id="mZfit" type="button" title="Adapter à l'espace">Adapter</button>
        <button id="mZin" type="button" aria-label="Agrandir" title="Agrandir">+</button>
      </div>
      <button class="ms-nav" id="mPrev" type="button" aria-label="Précédent">‹</button>
      <button class="ms-nav" id="mNext" type="button" aria-label="Suivant">›</button>
      <div class="ms-strip" id="mStrip"></div>
    </div>
    <div class="ms-side">
      <h2><span id="mTitle"></span><button class="xbtn" id="mClose" type="button" aria-label="Fermer">×</button></h2>
      <div id="mFields" class="ms-fields"></div>
      <div class="ms-foot"><button id="mClose2" class="btn primary" type="button">Fermer</button></div>
    </div>

</div>

<div id="delOverlay" class="overlay" role="dialog" aria-modal="true">
  <div class="dup">
    <p>Voulez-vous supprimer cet article de la base ou le retirer ?</p>
    <div class="dup-btns">
      <button id="delCancel" class="btn ghost" type="button">Annuler</button>
      <button id="delRetire" class="btn primary" type="button">Retirer</button>
      <button id="delRemove" class="btn danger" type="button">Supprimer</button>

  </div>
</div>

<div id="wornOverlay" class="overlay" role="dialog" aria-modal="true">
  <div class="dup">
    <p id="wornMsg"></p>
    <div class="dup-btns">
      <button id="wornNo" class="btn ghost" type="button">Non</button>
      <button id="wornYes" class="btn primary" type="button">Oui</button>
    </div>
  </div>
</div>

<div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
  <div class="dlg">
    <div class="dlg-head">
      <h2 id="dlgTitle">Historique</h2>
      <button id="hClose" class="xbtn" type="button" aria-label="Fermer">×</button>
    </div>
    <div class="dlg-body">
      <div class="left">
        <div class="field"><label for="yearSel">Année</label><select id="yearSel"></select></div>
        <div class="field"><label for="monthSel">Mois</label><select id="monthSel"></select></div>
        <div class="dates">
          <div class="dates-head">Date</div>
          <div id="dateList" role="listbox"></div>
        </div>
      </div>
      <div class="preview">
        <div class="pv-head"><span>Aperçu</span><input id="thSize" type="range" min="80" max="360" value="160" aria-label="Taille des vignettes"></div>
        <div id="pvBody"></div>
      </div>
      <div id="detail" class="detail"></div>
    </div>
    <div class="dlg-foot">
      <button id="hCancel" class="btn ghost" type="button">Annuler</button>
      <button id="hApply" class="btn primary" type="button" disabled>Sélectionner</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var el = { bar: document.getElementById("bar"), save: document.getElementById("save"), date: document.getElementById("saveDate") };
  var HIST_TABLE = "Historique"; // table d'historique (créée automatiquement)

  var CHOICES = [];       // valeurs autorisées, lues depuis la colonne Choix
  var CHOICE_COLORS = {}; // { "Haut": { fill: "#...", text: "#..." }, ... }
  var choicesLoaded = false;

  var photoColumn = null;   // colonne de pièces jointes (aperçu de l'historique)
  var choiceColumn = null;  // nom réel de la colonne mappée
  var currentRowId = null;  // ligne actuellement sélectionnée dans la vue liée
  var currentValue = null;  // valeur actuelle de cette ligne pour la colonne Choix
  var busy = false;         // empêche les doubles clics pendant une écriture

  function setHint(text, isError) {
    el.bar.innerHTML = '<span class="hint' + (isError ? ' error' : '') + '">' + text + '</span>';
  }

  function fieldsWith(col, value) {
    var f = {};
    f[col] = value;
    return f;
  }

  /* -----------------------------------------------------------
     Valeurs autorisées lues depuis la définition de la colonne à
     choix unique dans le document (mêmes valeurs que dans Grist),
     avec repli sur les valeurs déjà présentes dans les données.
     ----------------------------------------------------------- */
  async function loadChoices() {
    if (choicesLoaded || !choiceColumn) { return; }

    try {
      var tableId = await grist.getSelectedTableId();
      var tablesMeta = await grist.docApi.fetchTable("_grist_Tables");
      var tIdx = tablesMeta.tableId.indexOf(tableId);
      var tableRowId = tIdx !== -1 ? tablesMeta.id[tIdx] : null;

      var colsMeta = await grist.docApi.fetchTable("_grist_Tables_column");
      var found = null;
      for (var i = 0; i < colsMeta.colId.length; i++) {
        if (colsMeta.colId[i] === choiceColumn && colsMeta.parentId[i] === tableRowId) {
          found = colsMeta.widgetOptions[i];
          break;
        }
      }

      if (found) {
        var opts = JSON.parse(found || "{}");
        if (Array.isArray(opts.choices) && opts.choices.length) {
          CHOICES = opts.choices;
          choicesLoaded = true;
        }
        if (opts.choiceOptions) {
          Object.keys(opts.choiceOptions).forEach(function (name) {
            var o = opts.choiceOptions[name] || {};
            CHOICE_COLORS[name] = { fill: o.fillColor, text: o.textColor };
          });
        }
      }
    } catch (e) {
      // Repli ci-dessous si la lecture des métadonnées échoue.
    }

    if (!choicesLoaded) {
      try {
        var tableId2 = await grist.getSelectedTableId();
        var data = await grist.docApi.fetchTable(tableId2);
        var col = data[choiceColumn] || [];
        var seen = {};
        var fallback = [];
        col.forEach(function (v) {
          if (v && !seen[v]) { seen[v] = true; fallback.push(v); }
        });
        if (fallback.length) {
          CHOICES = fallback;
          choicesLoaded = true;
        }
      } catch (e) { /* rien à afficher pour l'instant */ }
    }
  }

  function render() {
    if (!choiceColumn) {
      setHint("Associez la colonne à choix unique dans le panneau de droite");
      return;
    }
    if (!choicesLoaded || !CHOICES.length) {
      setHint("Lecture des catégories…");
      return;
    }

    el.bar.innerHTML = "";

    if (currentRowId == null) {
      setHint("Sélectionnez une ligne dans le tableau « Liste des habits »");
      return;
    }

    CHOICES.forEach(function (choice) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "choice" + (choice === currentValue ? " active" : "");
      btn.textContent = choice;
      btn.disabled = busy;

      var colors = CHOICE_COLORS[choice];
      if (colors && colors.fill) { btn.style.setProperty("--chip-fill", colors.fill); }
      if (colors && colors.text) { btn.style.setProperty("--chip-text", colors.text); }

      btn.addEventListener("click", function () { applyChoice(choice); });
      el.bar.appendChild(btn);
    });
  }

  /* -----------------------------------------------------------
     Applique la catégorie cliquée à la ligne sélectionnée, et
     retire cette même valeur de toute autre ligne qui la portait
     déjà, pour qu'une seule ligne à la fois représente chaque
     catégorie.
     ----------------------------------------------------------- */
  async function applyChoice(value) {
    if (!choiceColumn || currentRowId == null || busy || value === currentValue) { return; }

    busy = true;
    render();

    try {
      var tableId = await grist.getSelectedTableId();
      var data = await grist.docApi.fetchTable(tableId);
      var col = data[choiceColumn] || [];

      for (var i = 0; i < col.length; i++) {
        if (col[i] === value && data.id[i] !== currentRowId) {
          await grist.selectedTable.update({ id: data.id[i], fields: fieldsWith(choiceColumn, null) });
        }
      }

      await grist.selectedTable.update({ id: currentRowId, fields: fieldsWith(choiceColumn, value) });
      currentValue = value;
      HB.valById[currentRowId] = value;
    } catch (e) {
      setHint("Échec de l'enregistrement : " + (e && e.message ? e.message : e), true);
      busy = false;
      return;
    }

    busy = false;
    render();
    scheduleHabits();
    scheduleGallery();
  }

  /* -----------------------------------------------------------
     Historique : enregistre, à la date du jour, l'ID de la ligne
     qui porte chaque choix (une colonne par choix) dans la table
     « Historique », créée automatiquement au premier clic.
     ----------------------------------------------------------- */
  function todayIso() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function chosenEpoch() {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(el.date.value || "");
    return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) / 1000 : dayEpoch();
  }
  el.date.value = todayIso();

  function dayEpoch() {
    var d = new Date();
    return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 1000;
  }

  async function histCols() {
    var T = await grist.docApi.fetchTable("_grist_Tables");
    var C = await grist.docApi.fetchTable("_grist_Tables_column");
    var ref = null;
    for (var i = 0; i < T.id.length; i++) { if (T.tableId[i] === HIST_TABLE) { ref = T.id[i]; } }
    if (ref === null) { return null; }
    var cols = {};
    for (var j = 0; j < C.id.length; j++) {
      if (C.parentId[j] === ref && C.colId[j].indexOf("gristHelper_") !== 0 && C.colId[j] !== "manualSort") {
        var wo = {};
        try { wo = JSON.parse(C.widgetOptions[j] || "{}"); } catch (e) { wo = {}; }
        cols[C.label[j]] = { colId: C.colId[j], type: C.type[j], choices: Array.isArray(wo.choices) ? wo.choices : [] };
      }
    }
    return cols;
  }

  // Propose de remplacer ou d'ajouter quand la date existe déjà. Renvoie "replace", "add" ou null.
  function askDuplicate(count, day) {
    return new Promise(function (resolve) {
      var ov = document.getElementById("dupOverlay");
      document.getElementById("dupMsg").textContent = (count > 1
        ? count + " enregistrements existent déjà pour le "
        : "Un enregistrement existe déjà pour le ") + fmtDate(day) + ". Que faire ?"
        + (count > 1 ? " (« Remplacer » modifie le plus récent.)" : "");
      function done(r) {
        ov.classList.remove("on");
        document.removeEventListener("keydown", onKey, true);
        resolve(r);
      }
      function onKey(ev) { if (ev.key === "Escape") { ev.stopImmediatePropagation(); done(null); } }
      document.addEventListener("keydown", onKey, true);
      document.getElementById("dupReplace").onclick = function () { done("replace"); };
      document.getElementById("dupAdd").onclick = function () { done("add"); };
      document.getElementById("dupCancel").onclick = function () { done(null); };
      ov.classList.add("on");
      document.getElementById("dupReplace").focus();
    });
  }

  async function saveHistory() {
    if (!choiceColumn || !choicesLoaded || !CHOICES.length) {
      alert("Associez d'abord la colonne à choix unique dans le panneau de droite.");
      return;
    }
    el.save.disabled = true;
    try {
      var tableId = await grist.getSelectedTableId();
      var data = await grist.docApi.fetchTable(tableId);
      var col = data[choiceColumn] || [];

      var cols = await histCols();
      if (!cols) {
        await grist.docApi.applyUserActions([["AddTable", HIST_TABLE, [{ id: "Date", label: "Date", type: "Date" }]]]);
        cols = await histCols();
      }
      if (!cols.Date) {
        await grist.docApi.applyUserActions([["AddColumn", HIST_TABLE, "Date", { type: "Date", label: "Date" }]]);
        cols = await histCols();
      }
      var missing = CHOICES.filter(function (c) { return !cols[c]; });
      if (missing.length) {
        await grist.docApi.applyUserActions(missing.map(function (c) {
          return ["AddColumn", HIST_TABLE, c, { type: "Ref:" + tableId, label: c }];
        }));
        cols = await histCols();
      }

      var day = chosenEpoch();
      var fields = {};
      fields[cols.Date.colId] = day;
      CHOICES.forEach(function (c) {
        var idx = col.indexOf(c);
        if (cols[c]) { fields[cols[c].colId] = idx === -1 ? 0 : data.id[idx]; }
      });

      var raw = await grist.docApi.fetchTable(HIST_TABLE);
      var dates = raw[cols.Date.colId] || [];
      var matches = [];
      dates.forEach(function (d, i) { if (d === day) { matches.push(i); } });
      var mode = "add";
      if (matches.length) {
        mode = await askDuplicate(matches.length, day);
        if (!mode) {
          el.save.disabled = false;
          return;
        }
      }
      if (mode === "replace") {
        // remplace l'enregistrement le plus récent (plus grand ID) de cette date
        var target = matches.reduce(function (best, i) { return raw.id[i] > raw.id[best] ? i : best; }, matches[0]);
        await grist.docApi.applyUserActions([["UpdateRecord", HIST_TABLE, raw.id[target], fields]]);
      } else {
        await grist.docApi.applyUserActions([["AddRecord", HIST_TABLE, null, fields]]);
      }
      el.save.textContent = "✓ Enregistré";
      el.date.value = todayIso();
      setTimeout(function () { el.save.textContent = "Enregistrer"; }, 1500);
    } catch (e) {
      alert("Enregistrement impossible : " + (e && e.message ? e.message : e));
    }
    el.save.disabled = false;
  }

  var D = document, W = window, popup = null; // document / fenêtre où s'affiche l'historique

        var tot = {}, nth = {};

        for (var q = H.entries.length - 1; q >= 0; q--) {

  function buildYears() {

  function buildMonths() {
    var y = $("yearSel").value, keep = $("monthSel").value, ms = [];
    H.entries.forEach(function (e) {
      if (y && String(yearOf(e.date)) !== y) { return; }
      var m = monthOf(e.date); if (ms.indexOf(m) === -1) { ms.push(m); }
    });
    ms.sort(function (a, b) { return a - b; });
    var sel = $("monthSel");
    sel.innerHTML = "";
    sel.appendChild(option("", "Tous"));
    ms.forEach(function (m) { sel.appendChild(option(String(m), monthName(m))); });
    sel.value = ms.indexOf(Number(keep)) !== -1 && keep !== "" ? keep : "";
    refreshList();

  async function applyHistory() {

      var col = data[choiceColumn] || [];
      var existing = {};
      data.id.forEach(function (id) { existing[id] = true; });
      var desired = {}, missing = 0;
      CHOICES.forEach(function (c) {
        var id = e.ids[c];
        if (!id) { return; }
        if (existing[id]) { desired[id] = c; } else { missing++; }
      });
      var actions = [];
      data.id.forEach(function (id, i) {
        var cur = col[i] || "", want = desired[id] || "";
        if ((want || CHOICES.indexOf(cur) !== -1) && cur !== want) {

  var G = { tok: null, tokAt: 0, busy: false, again: false, sig: null, timer: null, sizeTimer: null };

  async function galleryToken() {
    if (!G.tok || Date.now() - G.tokAt > Math.max(30000, (G.tok.ttlMsecs || 300000) - 60000)) {
      G.tok = await grist.docApi.getAccessToken({ readOnly: true });

  }

  async function refreshGallery() {
    if (G.busy) { G.again = true; return; }
    G.busy = true;
    try {
      if (!choiceColumn) {
        galleryMessage("Associez la colonne à choix unique dans le panneau de droite.");
      } else {
        var tableId = await grist.getSelectedTableId();
        var data = await grist.docApi.fetchTable(tableId);
        var tok = await galleryToken();
        var col = data[choiceColumn] || [];
        var items = [];
        data.id.forEach(function (id, i) {
          var v = col[i];
          if (!v) { return; }
          var att = photoColumn ? firstAttachment((data[photoColumn] || [])[i]) : null;
          items.push({ id: id, choice: String(v), att: att });
        });
        items.sort(function (a, b) {
          var ia = CHOICES.indexOf(a.choice), ib = CHOICES.indexOf(b.choice);
          if (ia === -1) { ia = 9999; } if (ib === -1) { ib = 9999; }
          return ia - ib || a.id - b.id;
        });
        var sig = items.map(function (x) { return x.id + "|" + x.choice + "|" + x.att; }).join(";") + "#" + (photoColumn || "");
        if (sig !== G.sig) {
          G.sig = sig;
          var body = document.getElementById("gBody");
          body.innerHTML = "";
          if (!items.length) {
            var h = document.createElement("div");
            h.className = "hint"; h.textContent = "Aucune ligne avec une valeur dans la colonne à choix unique.";
            body.appendChild(h);
          }
          items.forEach(function (it) {
            var fig = document.createElement("figure");
            fig.className = "ph";
            if (it.att) {
              var img = document.createElement("img");
              img.loading = "lazy"; img.decoding = "async"; img.alt = it.choice;
              img.src = tok.baseUrl + "/attachments/" + it.att + "/download?auth=" + tok.token;
              img.addEventListener("click", function () {
                openLightbox(img.src, it.choice, CHOICE_COLORS[it.choice], null, function () { return removeFromSelection(it.id); });
              });
              fig.appendChild(img);
            } else {
              var none = document.createElement("div");
              none.className = "none";
              none.textContent = photoColumn ? "Pas de photo" : "Associez la colonne Photo";
              fig.appendChild(none);
            }
            var cap = document.createElement("figcaption");
            cap.textContent = it.choice;
            var colors = CHOICE_COLORS[it.choice];
            if (colors && colors.fill) { cap.style.background = colors.fill; cap.style.color = colors.text || "#fff"; }
            fig.appendChild(cap);
            body.appendChild(fig);
          });
          document.getElementById("gCount").textContent = items.length + " ligne" + (items.length > 1 ? "s" : "");
        }
      }
    } catch (e) {
      galleryMessage("Photos indisponibles : " + (e && e.message ? e.message : e));
    }
    G.busy = false;
    if (G.again) { G.again = false; refreshGallery(); }
  }

  function scheduleGallery() {
    clearTimeout(G.timer);
    G.timer = setTimeout(refreshGallery, 150);
  }

  function applyThumbSize(px) {
    document.getElementById("gBody").style.setProperty("--th", px + "px");
  }
  try {
    var savedSize = Number(localStorage.getItem("choixBoutons.thumb"));
    if (savedSize >= 60 && savedSize <= 360) { document.getElementById("gSize").value = String(savedSize); }
  } catch (e) { /* valeurs par défaut */ }
  applyThumbSize(document.getElementById("gSize").value);
  document.getElementById("gSize").addEventListener("input", function (ev) {
    applyThumbSize(ev.target.value);
    clearTimeout(G.sizeTimer);
    G.sizeTimer = setTimeout(function () {
      try { localStorage.setItem("choixBoutons.thumb", ev.target.value); } catch (e) { /* non mémorisé */ }
    }, 400);
  });

  /* -----------------------------------------------------------
     Tableau « Liste des habits » : lit directement la table
     Mes_habits. Le switch « Sélectionnés » ne garde que les lignes
     dont la colonne Select n'est pas vide.
     ----------------------------------------------------------- */
  var HABITS_TABLE = "Mes_habits";
  var HABIT_COLS = ["Emplacement", "Marque", "Couleur", "Taille", "Description", "nb", "Note", "Photo", "A_ranger"];
  var MIN_COLS = { nb: 1, Note: 1, A_ranger: 1 };
  var CANON = HABIT_COLS.concat(["Select", "Supprime", "Type"]);
  var HB = { search: "", busy: false, again: false, sig: null, timer: null, only: false, meta: null, selRules: [],
            selectedId: null, cursorId: null, valById: {}, nbById: {}, typeSel: "", typeSig: null, empSel: "", empSig: null, rangerOnly: false };

  // Comparaison de noms de colonnes sans tenir compte de la casse ni des accents
  function norm(x) { return String(x).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }

  async function habitsMeta() {
    if (HB.meta) { return HB.meta; }
    var T = await grist.docApi.fetchTable("_grist_Tables");
    var C = await grist.docApi.fetchTable("_grist_Tables_column");
    var ref = null;
    for (var i = 0; i < T.id.length; i++) { if (T.tableId[i] === HABITS_TABLE) { ref = T.id[i]; } }
    if (ref === null) { return null; }
    var nameById = {};
    for (var k = 0; k < C.id.length; k++) { nameById[C.id[k]] = C.colId[k]; }
    var meta = {}, selColRef = null, sets = [];
    function ruleSet(rules, wo) {
      var helpers = (Array.isArray(rules) ? listItems(rules) : []).map(function (id) { return nameById[id]; });
      if (helpers.length) { sets.push({ helpers: helpers, styles: Array.isArray(wo.rulesOptions) ? wo.rulesOptions : [] }); }
    }
    for (var j = 0; j < C.id.length; j++) {
      if (C.parentId[j] === ref) {
        var wo = {};
        try { wo = JSON.parse(C.widgetOptions[j] || "{}"); } catch (e) { wo = {}; }
        meta[C.colId[j]] = {
          colId: C.colId[j], ref: C.id[j], formula: C.formula ? (C.formula[j] || "") : "",
          dropText: (wo.dropdownCondition && wo.dropdownCondition.text) || "", isFormula: !!(C.isFormula && C.isFormula[j]), pos: C.parentPos ? C.parentPos[j] : j,
          type: C.type[j] || "Any", label: C.label[j] || C.colId[j], visible: nameById[C.visibleCol[j]] || null,
          choices: Array.isArray(wo.choices) ? wo.choices : [], colors: wo.choiceOptions || {}
        };
        if (norm(C.colId[j]) === "select") {
          selColRef = C.id[j];
          ruleSet(C.rules ? C.rules[j] : null, wo);
        }
      }
    }
    // Réglages définis au niveau de la vue (champ) : règles de mise en forme de Select
    // et condition de liste déroulante (ex. choice.Cat == $Cat_taille)
    try {
      var F = await grist.docApi.fetchTable("_grist_Views_section_field");
      for (var f = 0; f < F.id.length; f++) {
        var fcol = nameById[F.colRef[f]];
        var fm = fcol ? meta[fcol] : null;
        if (!fm || fm.ref !== F.colRef[f]) { continue; }
        var fwo = {};
        try { fwo = JSON.parse(F.widgetOptions[f] || "{}"); } catch (e) { fwo = {}; }
        if (F.colRef[f] === selColRef && F.rules) { ruleSet(F.rules[f], fwo); }
        if (!fm.dropText && fwo.dropdownCondition && fwo.dropdownCondition.text) { fm.dropText = fwo.dropdownCondition.text; }
      }
    } catch (e) { /* on retombe sur les réglages de la colonne */ }
    HB.selRules = sets;
    HB.meta = meta;
    return meta;
  }

  // Rend les noms de colonnes insensibles à la casse (nb / Nb, Supprime / Supprimé…)
  function canonize(data, meta) {
    var keys = Object.keys(data);
    CANON.forEach(function (name) {
      if (data[name] !== undefined) { return; }
      for (var i = 0; i < keys.length; i++) {
        if (norm(keys[i]) === norm(name)) {
          data[name] = data[keys[i]];
          if (meta[keys[i]]) { meta[name] = meta[keys[i]]; }
          return;
        }
      }
    });
  }

  // Tables de référence (Type, Marques, Taille…) : mises en cache pour ne pas les relire à chaque ouverture de formulaire.
  // fresh = true force une relecture (utilisé lors du chargement des données du tableau).
  var REFC = {};
  async function fetchRef(name, fresh) {
    var c = REFC[name];
    if (!fresh && c) { return c.t; }
    var t = await grist.docApi.fetchTable(name);
    REFC[name] = { t: t, at: Date.now() };
    return t;
  }

  // Charge les tables référencées (colonnes Ref / RefList) pour afficher leur texte plutôt que l'ID
  async function habitsRefs(meta, cols) {
    var refs = {};
    for (var i = 0; i < cols.length; i++) {
      var m = meta[cols[i]];
      if (!m || !/^Ref(List)?:/.test(m.type)) { continue; }
      var tbl = m.type.split(":")[1];
      try {
        var t = await fetchRef(tbl, false);
        var map = {};
        t.id.forEach(function (id, n) { map[id] = m.visible && t[m.visible] ? t[m.visible][n] : id; });
        refs[cols[i]] = map;
      } catch (e) { /* on affichera l'ID */ }
    }
    return refs;
  }

  function listItems(v) { return (Array.isArray(v) && v[0] === "L") ? v.slice(1) : (Array.isArray(v) ? v : [v]); }

  function isEmptyVal(v, type) {
    if (v === null || v === undefined || v === "" || v === false) { return true; }
    if (v === 0 && /^Ref/.test(type || "")) { return true; }
    if (Array.isArray(v) && listItems(v).length === 0) { return true; }
    return false;
  }

  function cellText(col, v, meta, refs) {
    var type = (meta[col] && meta[col].type) || "Any";
    if (isEmptyVal(v, type)) { return ""; }
    if (type === "Bool") { return "\u2713"; }
    if (/^Date/.test(type) && typeof v === "number") {
      return new Date(v * 1000).toLocaleDateString("fr-FR", { timeZone: "UTC" });
    }
    if (/^Ref(List)?:/.test(type)) {
      var map = refs[col] || {};
      return listItems(v).map(function (id) { return map[id] !== undefined ? map[id] : id; }).join(", ");
    }
    if (Array.isArray(v)) { return listItems(v).join(", "); }
    return String(v);
  }

  // Style d'une ligne sélectionnée : mêmes mises en forme conditionnelles que la colonne Select
  // (règles conditionnelles, sinon couleur du choix, sinon vert par défaut)
  function rowStyle(i, v, data, meta) {
    if (isEmptyVal(v, "")) { return null; }
    for (var s = 0; s < HB.selRules.length; s++) {
      var set = HB.selRules[s];
      for (var k = 0; k < set.helpers.length; k++) {
        var h = set.helpers[k];
        if (h && data[h] && data[h][i] && set.styles[k]) { return set.styles[k]; }
      }
    }
    var co = meta.Select && meta.Select.colors ? meta.Select.colors[String(v)] : null;
    if (co && (co.fillColor || co.textColor)) { return co; }
    return { fillColor: "rgba(22, 179, 120, .18)" };
  }

  function habitsMessage(text) {
    var body = document.getElementById("hbBody");
    body.innerHTML = "";
    var d = document.createElement("div");
    d.className = "hint"; d.textContent = text;
    body.appendChild(d);
    document.getElementById("hbCount").textContent = "";
  }

  /* Deux étapes pour que les filtres soient instantanés :
     1) loadHabits()   : lit les tables dans Grist et construit le tableau (une seule fois par modification des données) ;
     2) renderHabits() : applique les filtres (types, emplacements, recherche, switchs) sur ces données déjà en mémoire
                         en masquant/affichant les lignes, sans aucun appel réseau. */
  async function loadHabits() {
    var meta = await habitsMeta();
    if (!meta) { HB.cache = { error: "Table « " + HABITS_TABLE + " » introuvable." }; return; }
    var need = ["Type", "Emplacements"];
    Object.keys(meta).forEach(function (k) {
      var mm = /^Ref(?:List)?:(\w+)$/.exec(meta[k].type);
      if (mm && need.indexOf(mm[1]) === -1) { need.push(mm[1]); }
    });
    var fetched = await Promise.all([grist.docApi.fetchTable(HABITS_TABLE)].concat(
      need.map(function (n) { return fetchRef(n, true).catch(function () { return null; }); })));
    var data = fetched[0];
    canonize(data, meta);
    HB.valById = {}; HB.nbById = {};
    if (choiceColumn && data[choiceColumn]) { data.id.forEach(function (id, i) { HB.valById[id] = data[choiceColumn][i]; }); }
    if (data.nb) { data.id.forEach(function (id, i) { HB.nbById[id] = data.nb[i]; }); }
    var types = await loadRefList("Type", "Vetement");
    var emps = await loadRefList("Emplacements", "Emplacement");
    var linkCol = typeLinkCol(meta);
    var empCol = empLinkCol(meta);
    var cols = HABIT_COLS.filter(function (c) { return data[c]; });
    var refs = await habitsRefs(meta, linkCol ? cols.concat([linkCol]) : cols);
    var nameToT = {}, nameToE = {};
    (types || []).forEach(function (t) { nameToT[t.name] = String(t.id); });
    (emps || []).forEach(function (e) { nameToE[e.name] = String(e.id); });

    var rows = [];
    data.id.forEach(function (id, i) {
      if (data.Supprime && data.Supprime[i] === true) { return; }   // lignes supprimées : jamais affichées
      var r = {
        id: id, att: null, cells: [],
        note: data.Note ? data.Note[i] : null,
        nb: data.nb ? data.nb[i] : null,
        type: linkCol ? cellText(linkCol, data[linkCol][i], meta, refs) : "",
        style: data.Select ? rowStyle(i, data.Select[i], data, meta) : null,
        selOn: data.Select ? !isEmptyVal(data.Select[i], meta.Select && meta.Select.type) : false,
        rangerOn: data.A_ranger ? data.A_ranger[i] === true : false,
        tIds: linkIds(data, meta, linkCol, nameToT, i),
        eIds: linkIds(data, meta, empCol, nameToE, i)
      };
      cols.forEach(function (c) {
        if (c === "Photo") { r.att = firstAttachment(data.Photo[i]); r.cells.push(""); }
        else { r.cells.push(cellText(c, data[c][i], meta, refs)); }
      });
      r.title = [r.cells[cols.indexOf("Marque")], r.cells[cols.indexOf("Description")]].filter(Boolean).join(" – ");
      r.hay = norm(r.cells.join(" "));   // texte de recherche (colonnes affichées)
      rows.push(r);
    });

    var C = { data: data, meta: meta, types: types, emps: emps, linkCol: linkCol, empCol: empCol, cols: cols, rows: rows,
              hasSelect: !!data.Select, hasRanger: !!data.A_ranger, table: null, emptyEl: null };
    var sig = cols.join(",") + "#" + JSON.stringify(rows.map(function (r) { return [r.id, r.att, r.cells, r.style, r.type]; }));
    var old = HB.cache;
    if (old && !old.error && old.table && sig === HB.sig && old.rows.length === rows.length) {
      // rien n'a changé d'affichable : on garde les lignes déjà construites
      C.table = old.table; C.emptyEl = old.emptyEl;
      rows.forEach(function (r, k) { r.tr = old.rows[k].tr; });
    } else {
      HB.sig = sig;
      buildHabitsTable(C, await galleryToken());
    }
    HB.cache = C;
  }

  // Construit le tableau complet (toutes les lignes non supprimées) ; le filtrage ne fait ensuite que masquer des lignes
  function buildHabitsTable(C, tok) {
    var meta = C.meta, cols = C.cols;
    var table = document.createElement("table");
    table.className = "hb";
    var trh = document.createElement("tr");
    cols.forEach(function (c) {
      var th = document.createElement("th");
      th.textContent = (meta[c] && meta[c].label) || c;
      if (MIN_COLS[c]) { th.className = "min"; }
      trh.appendChild(th);
    });
    var thead = document.createElement("thead");
    thead.appendChild(trh);
    table.appendChild(thead);
    var tbody = document.createElement("tbody");
    C.rows.forEach(function (r) {
      var tr = document.createElement("tr");
      tr.setAttribute("data-id", r.id);
      if (r.id === HB.selectedId) { tr.className = "sel"; }
      tr.addEventListener("click", function () {
        HB.selectedId = r.id;
        markSelected(false);
        syncSelection();
      });
      tr.addEventListener("dblclick", function (ev) {
        if (ev.target.closest && ev.target.closest("select, input, button, label, img, textarea")) { return; }
        openEdit(r.id);
      });
      cols.forEach(function (c, ci) {
        var td = document.createElement("td");
        var type = (meta[c] && meta[c].type) || "";
        if (MIN_COLS[c]) { td.className = "min"; }
        if (c === "Photo") {
          td.className = "c";
          if (r.att) {
            var img = document.createElement("img");
            img.className = "hb-th"; img.loading = "lazy"; img.decoding = "async"; img.alt = r.title || "Photo";
            img.src = tok.baseUrl + "/attachments/" + r.att + "/download?auth=" + tok.token;
            img.addEventListener("click", function () { openLightbox(img.src, r.title, null); });
            td.appendChild(img);
          }
        } else if (c === "Note") {
          noteEditor(td, r, meta.Note);
        } else if (c === "nb") {
          var num = document.createElement("span");
          num.textContent = r.cells[ci];
          td.appendChild(num);
          var plus = document.createElement("button");
          plus.type = "button"; plus.className = "plus"; plus.textContent = "+";
          plus.title = "Marquer comme porté"; plus.setAttribute("aria-label", "Marquer comme porté");
          plus.addEventListener("click", function (ev) { ev.stopPropagation(); wearOnce(r, num); });
          td.appendChild(plus);
        } else if (c === "A_ranger" && type === "Bool") {
          var lab = document.createElement("label");
          lab.className = "sw sm violet"; lab.title = "À ranger";
          var cb = document.createElement("input");
          cb.type = "checkbox"; cb.checked = r.cells[ci] !== "";
          var trk = document.createElement("span"); trk.className = "track";
          lab.appendChild(cb); lab.appendChild(trk);
          lab.addEventListener("click", function (ev) { ev.stopPropagation(); });
          cb.addEventListener("change", function () {
            var want = cb.checked, f = {};
            f[meta.A_ranger.colId] = want;
            cb.disabled = true;
            grist.docApi.applyUserActions([["UpdateRecord", HABITS_TABLE, r.id, f]])
              .then(function () { cb.disabled = false; scheduleHabits(); })
              .catch(function (err) {
                cb.disabled = false; cb.checked = !want;
                alert("Modification impossible : " + (err && err.message ? err.message : err));
              });
          });
          td.appendChild(lab);
        } else {
          if (type === "Bool") { td.className = "c"; }
          td.textContent = r.cells[ci];
        }
        if (r.style) {
          if (r.style.fillColor) { td.style.backgroundColor = r.style.fillColor; }
          if (r.style.textColor) { td.style.color = r.style.textColor; }
          if (r.style.fontBold) { td.style.fontWeight = "700"; }
        }
        tr.appendChild(td);
      });
      r.tr = tr;
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    var h = document.createElement("div");
    h.className = "hint"; h.hidden = true;
    C.table = table; C.emptyEl = h;
  }

  // Applique les filtres sur les données en mémoire (instantané : aucun appel à Grist)
  function renderHabits() {
    var C = HB.cache;
    if (!C) { return; }
    if (C.error) { habitsMessage(C.error); return; }

    // lignes de base : switchs « Sélectionnés » / « A ranger » et recherche
    var words = norm(HB.search).split(/\s+/).filter(Boolean);
    var base = C.rows.filter(function (r) {
      if (HB.only && C.hasSelect && !r.selOn) { return false; }
      if (HB.rangerOnly && C.hasRanger && !r.rangerOn) { return false; }
      for (var w = 0; w < words.length; w++) { if (r.hay.indexOf(words[w]) === -1) { return false; } }
      return true;
    });

    // nombre de lignes par type / emplacement (les comptes d'une liste tiennent compte de la sélection de l'autre)
    var tCounts = {}, eCounts = {}, tTotal = 0, eTotal = 0;
    (C.types || []).forEach(function (t) { tCounts[String(t.id)] = 0; });
    (C.emps || []).forEach(function (e) { eCounts[String(e.id)] = 0; });
    if (C.types && HB.typeSel !== "" && tCounts[HB.typeSel] === undefined) { HB.typeSel = ""; }
    if (C.emps && HB.empSel !== "" && eCounts[HB.empSel] === undefined) { HB.empSel = ""; }
    base.forEach(function (r) {
      var okT = HB.typeSel === "" || r.tIds.indexOf(HB.typeSel) !== -1;
      var okE = HB.empSel === "" || r.eIds.indexOf(HB.empSel) !== -1;
      if (okE) { tTotal++; r.tIds.forEach(function (id) { if (tCounts[id] !== undefined) { tCounts[id]++; } }); }
      if (okT) { eTotal++; r.eIds.forEach(function (id) { if (eCounts[id] !== undefined) { eCounts[id]++; } }); }
    });
    renderList("hbTypes", "Types", C.types, tCounts, tTotal, "typeSel", "typeSig", "Table « Type » (colonne Vetement) introuvable.");
    renderList("hbEmps", "Emplacements", C.emps, eCounts, eTotal, "empSel", "empSig", "Table « Emplacements » (colonne Emplacement) introuvable.");

    if (HB.only && !C.hasSelect) {
      habitsMessage("Colonne « Select » introuvable dans " + HABITS_TABLE + ".");
    } else if (HB.rangerOnly && !C.hasRanger) {
      habitsMessage("Colonne « A_ranger » introuvable dans " + HABITS_TABLE + ".");
    } else if (HB.typeSel !== "" && !C.linkCol) {
      habitsMessage("Aucune colonne de " + HABITS_TABLE + " n'est liée à la table Type.");
    } else if (HB.empSel !== "" && !C.empCol) {
      habitsMessage("Aucune colonne de " + HABITS_TABLE + " n'est liée à la table Emplacements.");
    } else {
      var body = document.getElementById("hbBody");
      if (body.firstChild !== C.table) {
        body.innerHTML = "";
        body.appendChild(C.table);
        body.appendChild(C.emptyEl);
      }
      var vis = new Set(base.filter(function (r) {
        return (HB.typeSel === "" || r.tIds.indexOf(HB.typeSel) !== -1) && (HB.empSel === "" || r.eIds.indexOf(HB.empSel) !== -1);
      }));
      C.rows.forEach(function (r) {
        var on = vis.has(r);
        if (r.tr.hidden === on) { r.tr.hidden = !on; }
      });
      C.emptyEl.hidden = vis.size > 0;
      C.emptyEl.textContent = HB.only ? "Aucune ligne sélectionnée." : "Aucune ligne.";
      document.getElementById("hbCount").textContent = vis.size + " ligne" + (vis.size > 1 ? "s" : "");
    }
    syncSelection();
  }

  // Recharge les données depuis Grist puis réapplique les filtres
  async function refreshHabits() {
    if (HB.busy) { HB.again = true; return; }
    HB.busy = true;
    try {
      await loadHabits();
      renderHabits();
    } catch (e) {
      habitsMessage("Liste indisponible : " + (e && e.message ? e.message : e));
    }
    HB.busy = false;
    if (HB.again) { HB.again = false; refreshHabits(); }
  }

  // Ligne sélectionnée dans le tableau = ligne ciblée par les boutons de choix du haut
  function syncSelection() {
    var id = HB.selectedId;
    var v = (id != null && Object.prototype.hasOwnProperty.call(HB.valById, id)) ? HB.valById[id] : null;
    if (id !== currentRowId || v !== currentValue) {
      currentRowId = id;
      currentValue = v;
      if (!busy) { render(); }
    }
  }

  function markSelected(scroll) {
    var rows = document.querySelectorAll("#hbBody tbody tr");
    for (var i = 0; i < rows.length; i++) {
      var on = rows[i].getAttribute("data-id") === String(HB.selectedId);
      rows[i].classList.toggle("sel", on);
      if (on && scroll && rows[i].scrollIntoView) { rows[i].scrollIntoView({ block: "nearest" }); }
    }
    mosMarkSel();
  }

  // Colonne Note modifiable : liste déroulante des valeurs du choix unique
  function noteEditor(td, r, m) {
    m = m || { type: "Any", choices: [], colors: {} };
    function save(value, ctrl, previous) {
      var fields = {};
      fields[m.colId || "Note"] = value;
      ctrl.disabled = true;
      grist.docApi.applyUserActions([["UpdateRecord", HABITS_TABLE, r.id, fields]])
        .then(function () { ctrl.disabled = false; scheduleHabits(); })
        .catch(function (err) {
          ctrl.disabled = false;
          if ("value" in ctrl) { ctrl.value = previous; }
          alert("Modification impossible : " + (err && err.message ? err.message : err));
        });
    }
    var raw = r.note;
    if (m.type === "Choice") {
      var sel = document.createElement("select");
      sel.className = "hb-note";
      var cur = (raw === null || raw === undefined) ? "" : String(raw);
      var list = [""].concat(m.choices);
      if (cur !== "" && list.indexOf(cur) === -1) { list.push(cur); }
      list.forEach(function (c) {
        var o = document.createElement("option");
        o.value = c; o.textContent = c;
        sel.appendChild(o);
      });
      sel.value = cur;
      var paint = function () {
        var co = m.colors[sel.value];
        sel.style.background = co && co.fillColor ? co.fillColor : "";
        sel.style.color = co && co.textColor ? co.textColor : "";
      };
      paint();
      var prev = cur;
      sel.addEventListener("change", function () {
        paint();
        var old = prev; prev = sel.value;
        save(sel.value === "" ? null : sel.value, sel, old);
      });
      td.appendChild(sel);
    } else if (m.type === "Int" || m.type === "Numeric" || m.type === "Text" || m.type === "Any") {
      var inp = document.createElement("input");
      var numeric = (m.type === "Int" || m.type === "Numeric");
      inp.type = numeric ? "number" : "text";
      inp.className = "hb-note";
      inp.value = (raw === null || raw === undefined) ? "" : String(raw);
      var before = inp.value;
      inp.addEventListener("change", function () {
        var old = before; before = inp.value;
        var v = inp.value.trim() === "" ? null : (numeric ? Number(inp.value) : inp.value);
        save(v, inp, old);
      });
      td.appendChild(inp);
    } else {
      td.textContent = r.cells[HABIT_COLS.indexOf("Note")] || "";
    }
  }

  // Fenêtre de confirmation Oui / Non
  function askWorn(msg) {

  // Bouton « + » de la colonne nb : après confirmation, ajoute 1 au nombre
  async function wearOnce(r, numEl) {

  /* Cadres « Types » et « Emplacements » à gauche du tableau : valeurs d'une colonne d'une table
     de référence (ordre alphabétique) avec le nombre de lignes de chacune. Un clic filtre le tableau. */
  async function loadRefList(table, column) {
    try {
      var t = await fetchRef(table, false);
      var key = findKey(t, column);
      if (!key) { return null; }
      var list = [];
      t.id.forEach(function (id, i) {
        var n = (t[key][i] === null || t[key][i] === undefined) ? "" : String(t[key][i]).trim();
        if (n !== "") { list.push({ id: id, name: n }); }
      });
      list.sort(function (a, b) { return a.name.localeCompare(b.name, "fr", { sensitivity: "base" }); });
      return list;
    } catch (e) { return null; }
  }

  // Identifiants (en texte) des valeurs d'une ligne pour une colonne liée à une table de référence
  function linkIds(data, meta, col, nameToId, i) {
    if (!col || !data[col]) { return []; }
    var lv = data[col][i];
    if (/^Ref/.test(meta[col].type)) {
      return listItems(lv).filter(function (x) { return x !== null && x !== undefined && x !== 0; }).map(String);
    }
    return nameToId[String(lv)] !== undefined ? [nameToId[String(lv)]] : [];
  }

  function empLinkCol(meta) {

    return meta.Emplacement ? "Emplacement" : null;

  // Colonne de Mes_habits liée à la table Type (Ref:Type), à défaut « Vetement » ou « Type »
  function typeLinkCol(meta) {
