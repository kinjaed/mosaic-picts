<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sélection photo</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f7f7f7;
    --border: #dcdcdc;
    --text: #262633;
    --muted: #8a8a9e;
    --accent: #16b378;
    --danger: #d0021b;
    --radius: 999px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 13px;
  }
  body {
    display: flex;
    align-items: flex-start;
    padding: 6px 8px;
  }

  .bar { display: flex; flex-wrap: wrap; gap: 8px; }

  button.choice {
    font: inherit;
    padding: 4px 14px;
    border: 1.5px solid var(--chip-fill, var(--border));
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--chip-fill, var(--text));
    cursor: pointer;
    transition: background 0.1s ease, border-color 0.1s ease, color 0.1s ease;
  }
  button.choice:hover:not(:disabled) { background: var(--surface); }
  button.choice:disabled { opacity: 0.45; cursor: default; }
  button.choice.active {
    background: var(--chip-fill, var(--accent));
    border-color: var(--chip-fill, var(--accent));
    color: var(--chip-text, #fff);
    font-weight: 600;
  }

  .hint {
    color: var(--muted);
    font-size: 12px;
    padding: 4px 2px;
  }
  .hint.error { color: var(--danger); }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #32323f;
      --surface: #3b3b4a;
      --border: #57576b;
      --text: #efefef;
      --muted: #a4a4b6;
    }
  }

  /* ---- Cadres : choix (gris clair) / actions (gris foncé) ---- */
  :root {
    --panel-a: #ececf1; --panel-b: #5c5c6a; --edge: #9b9bac;
    --save: #d93a3a; --hist: #9dbdf5; --slider: #4a8df0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --panel-a: #3b3b4a; --panel-b: #1f1f29; --edge: #6d6d82; }
  }
  .root { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 8px; }
  .wrap { display: flex; gap: 8px; width: 100%; flex: none; align-items: stretch; }
  .panel.gallery { flex: 1; min-height: 90px; display: flex; flex-direction: column; padding: 0; overflow: hidden; background: var(--panel-a); }
  .g-head { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--border); }
  .g-title { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .g-count { color: var(--muted); font-size: 12px; margin-right: auto; }
  .g-head input[type=range] { width: 140px; accent-color: var(--slider); }
  .g-body { flex: 1; overflow: auto; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; align-items: flex-start; }
  .panel { border-radius: 14px; padding: 8px 10px; }

  /* ---- Tableau « Liste des habits » ---- */
  .panel.habits { flex: 1; min-height: 150px; display: flex; flex-direction: column; padding: 0; overflow: hidden; background: var(--panel-a); }
  .panel.habits .g-head { background: var(--surface); }
  .sw { position: relative; display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-size: 12px; font-weight: 600; }
  .sw input { position: absolute; opacity: 0; width: 0; height: 0; }
  .sw .track { position: relative; width: 34px; height: 18px; border-radius: 999px; background: var(--edge); transition: background .15s ease; }
  .sw .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s ease; }
  .sw input:checked + .track { background: var(--accent); }
  .sw input:checked + .track::after { transform: translateX(16px); }
  .sw input:focus-visible + .track { outline: 2px solid var(--slider); outline-offset: 2px; }
  .hb-head { display: flex; align-items: center; gap: 10px; }
  .hb-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .hb-right { margin-left: auto; }
  select.hb-note, input.hb-note {
    font: inherit; font-size: 12px; color: var(--text); background: var(--bg); color-scheme: light dark;
    border: 1px solid var(--edge); border-radius: 8px; padding: 3px 8px; max-width: 100%;
  }
  select.hb-note, input.hb-note { width: auto; min-width: 0; text-align: center; text-align-last: center; }
  input.hb-note { width: 5em; }
  .hb-note:disabled { opacity: .55; }
  .hb-main { flex: 1; min-height: 0; display: flex; }
  .hb-types { flex: none; width: 170px; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--border); }
  .tp { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 8px 12px; text-align: left;
        font: inherit; font-size: 13px; color: var(--text); background: transparent; border: 1.5px solid transparent; border-radius: 999px; cursor: pointer; }
  .tp:hover { background: var(--surface); }
  .tp.on { font-weight: 700; background: rgba(56, 152, 214, .16); border-color: #2b86c5; }
  .tp .tp-l { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tp .tp-n { flex: none; font-size: 12px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tp.on .tp-n { color: #2b86c5; font-weight: 600; }
  .tp.zero { opacity: .5; }
  .hb-body { flex: 1; min-width: 0; min-height: 0; overflow: auto; }
  table.hb th.min, table.hb td.min { width: 1%; white-space: nowrap; text-align: center; }
  button.plus { width: 16px; height: 16px; margin-left: 6px; padding: 0; vertical-align: middle; font-size: 12px; line-height: 1; color: var(--text); background: var(--bg); border: 1px solid var(--edge); border-radius: 50%; cursor: pointer; }
  button.plus:hover { color: #fff; background: var(--accent); border-color: var(--accent); }
  .lb .lb-rm { position: absolute; right: 12px; bottom: 12px; padding: 7px 16px; font: inherit; font-size: 13px; font-weight: 600; color: #fff; background: #d64545; border: 0; border-radius: 999px; cursor: pointer; }
  .lb .lb-rm:hover { background: #bf3535; }
  .lb .lb-rm:disabled { opacity: .6; cursor: default; }
  table.hb tbody tr { cursor: pointer; }
  table.hb tbody tr.sel td { box-shadow: inset 0 1px 0 var(--accent), inset 0 -1px 0 var(--accent); }
  table.hb tbody tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent), inset 0 1px 0 var(--accent), inset 0 -1px 0 var(--accent); }
  table.hb { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.hb th { position: sticky; top: 0; z-index: 1; padding: 6px 10px; text-align: left; white-space: nowrap; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--panel-a); border-bottom: 1px solid var(--border); }
  table.hb td { padding: 4px 10px; vertical-align: middle; border-bottom: 1px solid var(--border); }
  table.hb tbody tr:hover td { background: var(--surface); }
  table.hb td.c { text-align: center; }
  table.hb td.n { text-align: right; font-variant-numeric: tabular-nums; }
  table.hb img.hb-th { display: block; width: 56px; height: auto; min-height: 20px; border-radius: 6px; background: var(--border); cursor: zoom-in; }
  .hb-body .hint { padding: 12px; }
  .panel.choices { flex: 1; min-width: 0; background: var(--panel-a); overflow-y: auto; display: flex; flex-direction: column; }
  .panel.choices .bar { flex: 1 0 auto; align-content: flex-start; }
  .panel.actions { flex: none; background: var(--panel-a); display: flex; flex-direction: row; gap: 12px; align-items: center; }
  .btns { display: flex; flex-direction: column; gap: 8px; }
  .act {
    font: inherit; font-weight: 600; padding: 6px 18px; color: #fff; cursor: pointer;
    border: 1.5px solid var(--edge); border-radius: 999px; transition: filter .12s ease, transform .05s ease;
  }
  .act:hover:not(:disabled) { filter: brightness(1.1); }
  .act:active:not(:disabled) { transform: translateY(1px); }
  .act:disabled { opacity: .5; cursor: default; }
  .act.save { background: var(--save); }
  .act.hist { background: var(--hist); color: #14284b; }
  .datebox { display: flex; flex-direction: column; gap: 3px; }
  .datebox label { font-size: 11px; font-weight: 600; color: var(--muted); padding-left: 6px; }
  #saveDate {
    font: inherit; padding: 4px 12px; color: var(--text); background: var(--bg);
    border: 1.5px solid var(--edge); border-radius: 999px; color-scheme: light dark;
  }

  /* ---- Fenêtre Historique ---- */
  .overlay {
    position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center;
    padding: 10px; background: rgba(18, 18, 30, .55); backdrop-filter: blur(3px);
  }
  .overlay.on { display: flex; }
  .dlg {
    width: min(1000px, 100%); height: min(660px, 100%); display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg); border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
  }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid var(--border); }
  .dlg-head h2 { margin: 0; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; }
  .xbtn { border: 0; background: var(--surface); color: var(--text); width: 30px; height: 30px; border-radius: 50%; font-size: 18px; line-height: 1; cursor: pointer; }
  .xbtn:hover { background: var(--border); }
  .dlg-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(170px, 270px) 1fr minmax(190px, 270px); gap: 14px; padding: 14px 18px; overflow: auto; }
  .left { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .field { display: flex; align-items: center; gap: 10px; }
  .field label { width: 52px; color: var(--muted); font-weight: 600; }
  .field select {
    flex: 1; min-width: 0; padding: 7px 10px; font: inherit; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  }
  .dates { flex: 1; min-height: 140px; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .dates-head, .pv-head { padding: 9px 14px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); }
  #dateList { flex: 1; overflow-y: auto; padding: 4px; }
  .date { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; font: inherit; color: var(--text); background: transparent; border: 0; border-radius: 8px; padding: 7px 10px; cursor: pointer; }
  .date:hover { background: var(--border); }
  .date .stars-n { flex: none; color: #f5c518; letter-spacing: 1px; font-size: 13px; white-space: nowrap; }
  .date[aria-selected="true"] { background: var(--accent); color: #fff; font-weight: 600; }
  .empty { color: var(--muted); padding: 16px; text-align: center; }
  .preview { display: flex; flex-direction: column; min-height: 180px; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .pv-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .pv-head input[type=range] { width: 150px; accent-color: var(--slider); }
  #pvBody { flex: 1; overflow: auto; padding: 14px; display: flex; flex-wrap: wrap; gap: 12px; align-content: flex-start; align-items: flex-start; }
  figure.ph { position: relative; margin: 0; width: var(--th, 160px); max-width: 100%; border-radius: 12px; overflow: hidden; background: var(--border); box-shadow: 0 2px 8px rgba(0, 0, 0, .18); }
  figure.ph img { display: block; width: 100%; height: auto; min-height: 40px; cursor: zoom-in; }
  figure.ph .none { display: flex; align-items: center; justify-content: center; width: 100%; aspect-ratio: 3 / 4; color: var(--muted); font-size: 12px; text-align: center; padding: 8px; }
  figure.ph figcaption { position: absolute; left: 6px; bottom: 6px; max-width: calc(100% - 12px); padding: 2px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(20, 20, 30, .72); color: #fff; }
  .dlg-foot { display: flex; justify-content: space-between; padding: 12px 18px; border-top: 1px solid var(--border); background: var(--surface); }
  .btn { font: inherit; font-weight: 600; padding: 8px 24px; border-radius: 999px; cursor: pointer; border: 1.5px solid var(--border); }
  .btn.ghost { background: transparent; color: var(--text); }
  .btn.ghost:hover { background: var(--border); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
  .btn:disabled { opacity: .45; cursor: default; }
  .detail { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 12px; overflow-y: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  .detail .fcol { display: flex; flex-direction: column; gap: 6px; }
  .detail label { color: var(--muted); font-weight: 600; }
  .detail select { width: 100%; padding: 7px 10px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 10px; }
  .detail .thumbs { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .detail .thumbs img { cursor: zoom-in; display: block; height: 170px; width: auto; max-width: 100%; object-fit: cover; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
  .detail .stars { display: flex; gap: 2px; }
  .detail .stars button { border: 0; background: transparent; padding: 0 2px; font-size: 30px; line-height: 1; cursor: pointer; color: #b5b5c0; transition: color .1s ease, transform .05s ease; }
  .detail .stars button.on { color: #f5c518; }
  .detail .stars button:hover:not(:disabled) { transform: scale(1.12); }
  .detail .stars button:disabled { opacity: .35; cursor: default; }
  .detail .fit-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--muted); font-weight: 600; }
  .detail .switch { position: relative; flex: none; width: 38px; height: 22px; padding: 0; border: 0; border-radius: 999px; background: var(--border); cursor: pointer; transition: background .15s ease; }
  .detail .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s ease; }
  .detail .switch[aria-checked="true"] { background: var(--accent); }
  .detail .switch[aria-checked="true"]::after { transform: translateX(16px); }
  .detail .thumbs.fit img { width: 100%; height: auto; max-width: 100%; object-fit: contain; }
  .detail .status { font-size: 11px; color: var(--muted); min-height: 14px; }
  .detail .status.error { color: var(--danger); }
  /* ---- Aperçu en grand (prend toute la place du widget) ---- */
  .lb { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 8px; background: rgba(18, 18, 30, .94); cursor: zoom-out; }
  .lb img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; border-radius: 8px; }
  .lb .lb-x { position: absolute; top: 8px; right: 8px; background: rgba(255, 255, 255, .85); color: #222; }
  .lb .lb-cap { position: absolute; left: 12px; bottom: 12px; padding: 3px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; background: rgba(0, 0, 0, .7); color: #fff; }

  /* ---- Date déjà enregistrée : remplacer / ajouter ---- */
  #dupOverlay, #wornOverlay { z-index: 60; }
  .dup { width: min(380px, 100%); display: flex; flex-direction: column; gap: 14px; padding: 16px 18px; background: var(--bg); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 16px 40px rgba(0, 0, 0, .35); }
  .dup p { margin: 0; line-height: 1.45; }
  .dup-btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .dup .btn { padding: 6px 16px; }
  body.win { display: block; padding: 0; }
  .win .overlay { padding: 0; background: var(--bg); backdrop-filter: none; }
  .win .dlg { width: 100%; height: 100%; border: 0; border-radius: 0; box-shadow: none; }
  @media (max-width: 460px) {
    .dlg-body { grid-template-columns: 1fr; }
    .dates { max-height: 200px; }
    .detail { max-height: 360px; }
  }
</style>
</head>
<body>

<div class="root">
<div class="wrap">
  <section class="panel choices">
    <div id="bar" class="bar">
      <span class="hint" id="hint">Chargement…</span>
    </div>
  </section>
  <aside class="panel actions">
    <div class="datebox">
      <label for="saveDate">Date d'enregistrement</label>
      <input id="saveDate" type="date">
    </div>
    <div class="btns">
      <button id="save" class="act save" type="button" title="Enregistrer l'état actuel dans la table Historique">Enregistrer</button>
      <button id="hist" class="act hist" type="button" title="Consulter et restaurer un enregistrement">Historique</button>
    </div>
  </aside>
</div>
<section id="gallery" class="panel gallery">
  <div class="g-head">
    <span class="g-title">Photos</span>
    <span id="gCount" class="g-count"></span>
    <input id="gSize" type="range" min="60" max="360" value="140" aria-label="Taille des photos">
  </div>
  <div id="gBody" class="g-body"></div>
</section>
<section id="habits" class="panel habits">
  <div class="g-head hb-head">
    <div class="hb-left">
      <span class="g-title">Liste des habits</span>
      <span id="hbCount" class="g-count"></span>
    </div>
    <label class="sw hb-right" title="Afficher uniquement les lignes dont la colonne Select n'est pas vide">
      <span>Sélectionnés</span>
      <input type="checkbox" id="hbSel">
      <span class="track"></span>
    </label>
  </div>
  <div class="hb-main">
    <aside id="hbTypes" class="hb-types" aria-label="Types de vêtements"></aside>
    <div id="hbBody" class="hb-body"></div>
  </div>
</section>
</div>

<div id="dupOverlay" class="overlay" role="dialog" aria-modal="true">
  <div class="dup">
    <p id="dupMsg"></p>
    <div class="dup-btns">
      <button id="dupCancel" class="btn ghost" type="button">Annuler</button>
      <button id="dupAdd" class="btn ghost" type="button">Ajouter</button>
      <button id="dupReplace" class="btn primary" type="button">Remplacer</button>
    </div>
  </div>
</div>

<div id="wornOverlay" class="overlay" role="dialog" aria-modal="true">
  <div class="dup">
    <p id="wornMsg"></p>
    <div class="dup-btns">
      <button id="wornNo" class="btn ghost" type="button">Non</button>
      <button id="wornYes" class="btn primary" type="button">Oui</button>
    </div>
  </div>
</div>

<div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
  <div class="dlg">
    <div class="dlg-head">
      <h2 id="dlgTitle">Historique</h2>
      <button id="hClose" class="xbtn" type="button" aria-label="Fermer">×</button>
    </div>
    <div class="dlg-body">
      <div class="left">
        <div class="field"><label for="yearSel">Année</label><select id="yearSel"></select></div>
        <div class="field"><label for="monthSel">Mois</label><select id="monthSel"></select></div>
        <div class="dates">
          <div class="dates-head">Date</div>
          <div id="dateList" role="listbox"></div>
        </div>
      </div>
      <div class="preview">
        <div class="pv-head"><span>Aperçu</span><input id="thSize" type="range" min="80" max="360" value="160" aria-label="Taille des vignettes"></div>
        <div id="pvBody"></div>
      </div>
      <div id="detail" class="detail"></div>
    </div>
    <div class="dlg-foot">
      <button id="hCancel" class="btn ghost" type="button">Annuler</button>
      <button id="hApply" class="btn primary" type="button" disabled>Sélectionner</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var el = { bar: document.getElementById("bar"), save: document.getElementById("save"), date: document.getElementById("saveDate") };
  var HIST_TABLE = "Historique"; // table d'historique (créée automatiquement)

  var CHOICES = [];       // valeurs autorisées, lues depuis la colonne Choix
  var CHOICE_COLORS = {}; // { "Haut": { fill: "#...", text: "#..." }, ... }
  var choicesLoaded = false;

  var photoColumn = null;   // colonne de pièces jointes (aperçu de l'historique)
  var choiceColumn = null;  // nom réel de la colonne mappée
  var currentRowId = null;  // ligne actuellement sélectionnée dans la vue liée
  var currentValue = null;  // valeur actuelle de cette ligne pour la colonne Choix
  var busy = false;         // empêche les doubles clics pendant une écriture

  function setHint(text, isError) {
    el.bar.innerHTML = '<span class="hint' + (isError ? ' error' : '') + '">' + text + '</span>';
  }

  function fieldsWith(col, value) {
    var f = {};
    f[col] = value;
    return f;
  }

  /* -----------------------------------------------------------
     Valeurs autorisées lues depuis la définition de la colonne à
     choix unique dans le document (mêmes valeurs que dans Grist),
     avec repli sur les valeurs déjà présentes dans les données.
     ----------------------------------------------------------- */
  async function loadChoices() {
    if (choicesLoaded || !choiceColumn) { return; }

    try {
      var tableId = await grist.getSelectedTableId();
      var tablesMeta = await grist.docApi.fetchTable("_grist_Tables");
      var tIdx = tablesMeta.tableId.indexOf(tableId);
      var tableRowId = tIdx !== -1 ? tablesMeta.id[tIdx] : null;

      var colsMeta = await grist.docApi.fetchTable("_grist_Tables_column");
      var found = null;
      for (var i = 0; i < colsMeta.colId.length; i++) {
        if (colsMeta.colId[i] === choiceColumn && colsMeta.parentId[i] === tableRowId) {
          found = colsMeta.widgetOptions[i];
          break;
        }
      }

      if (found) {
        var opts = JSON.parse(found || "{}");
        if (Array.isArray(opts.choices) && opts.choices.length) {
          CHOICES = opts.choices;
          choicesLoaded = true;
        }
        if (opts.choiceOptions) {
          Object.keys(opts.choiceOptions).forEach(function (name) {
            var o = opts.choiceOptions[name] || {};
            CHOICE_COLORS[name] = { fill: o.fillColor, text: o.textColor };
          });
        }
      }
    } catch (e) {
      // Repli ci-dessous si la lecture des métadonnées échoue.
    }

    if (!choicesLoaded) {
      try {
        var tableId2 = await grist.getSelectedTableId();
        var data = await grist.docApi.fetchTable(tableId2);
        var col = data[choiceColumn] || [];
        var seen = {};
        var fallback = [];
        col.forEach(function (v) {
          if (v && !seen[v]) { seen[v] = true; fallback.push(v); }
        });
        if (fallback.length) {
          CHOICES = fallback;
          choicesLoaded = true;
        }
      } catch (e) { /* rien à afficher pour l'instant */ }
    }
  }

  function render() {
    if (!choiceColumn) {
      setHint("Associez la colonne à choix unique dans le panneau de droite");
      return;
    }
    if (!choicesLoaded || !CHOICES.length) {
      setHint("Lecture des catégories…");
      return;
    }

    el.bar.innerHTML = "";

    if (currentRowId == null) {
      setHint("Sélectionnez une ligne dans le tableau « Liste des habits »");
      return;
    }

    CHOICES.forEach(function (choice) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "choice" + (choice === currentValue ? " active" : "");
      btn.textContent = choice;
      btn.disabled = busy;

      var colors = CHOICE_COLORS[choice];
      if (colors && colors.fill) { btn.style.setProperty("--chip-fill", colors.fill); }
      if (colors && colors.text) { btn.style.setProperty("--chip-text", colors.text); }

      btn.addEventListener("click", function () { applyChoice(choice); });
      el.bar.appendChild(btn);
    });
  }

  /* -----------------------------------------------------------
     Applique la catégorie cliquée à la ligne sélectionnée, et
     retire cette même valeur de toute autre ligne qui la portait
     déjà, pour qu'une seule ligne à la fois représente chaque
     catégorie.
     ----------------------------------------------------------- */
  async function applyChoice(value) {
    if (!choiceColumn || currentRowId == null || busy || value === currentValue) { return; }

    busy = true;
    render();

    try {
      var tableId = await grist.getSelectedTableId();
      var data = await grist.docApi.fetchTable(tableId);
      var col = data[choiceColumn] || [];

      for (var i = 0; i < col.length; i++) {
        if (col[i] === value && data.id[i] !== currentRowId) {
          await grist.selectedTable.update({ id: data.id[i], fields: fieldsWith(choiceColumn, null) });
        }
      }

      await grist.selectedTable.update({ id: currentRowId, fields: fieldsWith(choiceColumn, value) });
      currentValue = value;
      HB.valById[currentRowId] = value;
    } catch (e) {
      setHint("Échec de l'enregistrement : " + (e && e.message ? e.message : e), true);
      busy = false;
      return;
    }

    busy = false;
    render();
    scheduleHabits();
    scheduleGallery();
  }

  /* -----------------------------------------------------------
     Historique : enregistre, à la date du jour, l'ID de la ligne
     qui porte chaque choix (une colonne par choix) dans la table
     « Historique », créée automatiquement au premier clic.
     ----------------------------------------------------------- */
  function todayIso() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function chosenEpoch() {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(el.date.value || "");
    return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) / 1000 : dayEpoch();
  }
  el.date.value = todayIso();

  function dayEpoch() {
    var d = new Date();
    return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 1000;
  }

  async function histCols() {
    var T = await grist.docApi.fetchTable("_grist_Tables");
    var C = await grist.docApi.fetchTable("_grist_Tables_column");
    var ref = null;
    for (var i = 0; i < T.id.length; i++) { if (T.tableId[i] === HIST_TABLE) { ref = T.id[i]; } }
    if (ref === null) { return null; }
    var cols = {};
    for (var j = 0; j < C.id.length; j++) {
      if (C.parentId[j] === ref && C.colId[j].indexOf("gristHelper_") !== 0 && C.colId[j] !== "manualSort") {
        var wo = {};
        try { wo = JSON.parse(C.widgetOptions[j] || "{}"); } catch (e) { wo = {}; }
        cols[C.label[j]] = { colId: C.colId[j], type: C.type[j], choices: Array.isArray(wo.choices) ? wo.choices : [] };
      }
    }
    return cols;
  }

  // Propose de remplacer ou d'ajouter quand la date existe déjà. Renvoie "replace", "add" ou null.
  function askDuplicate(count, day) {
    return new Promise(function (resolve) {
      var ov = document.getElementById("dupOverlay");
      document.getElementById("dupMsg").textContent = (count > 1
        ? count + " enregistrements existent déjà pour le "
        : "Un enregistrement existe déjà pour le ") + fmtDate(day) + ". Que faire ?"
        + (count > 1 ? " (« Remplacer » modifie le plus récent.)" : "");
      function done(r) {
        ov.classList.remove("on");
        document.removeEventListener("keydown", onKey, true);
        resolve(r);
      }
      function onKey(ev) { if (ev.key === "Escape") { ev.stopImmediatePropagation(); done(null); } }
      document.addEventListener("keydown", onKey, true);
      document.getElementById("dupReplace").onclick = function () { done("replace"); };
      document.getElementById("dupAdd").onclick = function () { done("add"); };
      document.getElementById("dupCancel").onclick = function () { done(null); };
      ov.classList.add("on");
      document.getElementById("dupReplace").focus();
    });
  }

  async function saveHistory() {
    if (!choiceColumn || !choicesLoaded || !CHOICES.length) {
      alert("Associez d'abord la colonne à choix unique dans le panneau de droite.");
      return;
    }
    el.save.disabled = true;
    try {
      var tableId = await grist.getSelectedTableId();
      var data = await grist.docApi.fetchTable(tableId);
      var col = data[choiceColumn] || [];

      var cols = await histCols();
      if (!cols) {
        await grist.docApi.applyUserActions([["AddTable", HIST_TABLE, [{ id: "Date", label: "Date", type: "Date" }]]]);
        cols = await histCols();
      }
      if (!cols.Date) {
        await grist.docApi.applyUserActions([["AddColumn", HIST_TABLE, "Date", { type: "Date", label: "Date" }]]);
        cols = await histCols();
      }
      var missing = CHOICES.filter(function (c) { return !cols[c]; });
      if (missing.length) {
        await grist.docApi.applyUserActions(missing.map(function (c) {
          return ["AddColumn", HIST_TABLE, c, { type: "Ref:" + tableId, label: c }];
        }));
        cols = await histCols();
      }

      var day = chosenEpoch();
      var fields = {};
      fields[cols.Date.colId] = day;
      CHOICES.forEach(function (c) {
        var idx = col.indexOf(c);
        if (cols[c]) { fields[cols[c].colId] = idx === -1 ? 0 : data.id[idx]; }
      });

      var raw = await grist.docApi.fetchTable(HIST_TABLE);
      var dates = raw[cols.Date.colId] || [];
      var matches = [];
      dates.forEach(function (d, i) { if (d === day) { matches.push(i); } });
      var mode = "add";
      if (matches.length) {
        mode = await askDuplicate(matches.length, day);
        if (!mode) {
          el.save.disabled = false;
          return;
        }
      }
      if (mode === "replace") {
        // remplace l'enregistrement le plus récent (plus grand ID) de cette date
        var target = matches.reduce(function (best, i) { return raw.id[i] > raw.id[best] ? i : best; }, matches[0]);
        await grist.docApi.applyUserActions([["UpdateRecord", HIST_TABLE, raw.id[target], fields]]);
      } else {
        await grist.docApi.applyUserActions([["AddRecord", HIST_TABLE, null, fields]]);
      }
      el.save.textContent = "✓ Enregistré";
      el.date.value = todayIso();
      setTimeout(function () { el.save.textContent = "Enregistrer"; }, 1500);
    } catch (e) {
      alert("Enregistrement impossible : " + (e && e.message ? e.message : e));
    }
    el.save.disabled = false;
  }

  el.save.addEventListener("click", saveHistory);

  /* -----------------------------------------------------------
     Fenêtre Historique : liste des dates (filtre année / mois) et
     aperçu des photos. « Sélectionner » réapplique les choix de
     l'enregistrement aux lignes correspondantes (par leur ID).
     ----------------------------------------------------------- */
  var D = document, W = window, popup = null; // document / fenêtre où s'affiche l'historique
  function $(id) { return D.getElementById(id); }
  var H = { fit: true, hcols: {}, entries: [], sel: null, data: null, idx: {}, tok: null, tableId: null };

  function fmtDate(e) {
    return new Date(e * 1000).toLocaleDateString("fr-FR", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric", timeZone: "UTC" });
  }
  function yearOf(e) { return new Date(e * 1000).getUTCFullYear(); }
  function monthOf(e) { return new Date(e * 1000).getUTCMonth(); }
  function monthName(m) {
    var n = new Date(Date.UTC(2000, m, 1)).toLocaleDateString("fr-FR", { month: "long", timeZone: "UTC" });
    return n.charAt(0).toUpperCase() + n.slice(1);
  }
  function firstAttachment(v) {
    if (!Array.isArray(v)) { return null; }
    for (var i = 0; i < v.length; i++) { if (typeof v[i] === "number") { return v[i]; } }
    return null;
  }
  function attUrl(id) {
    return H.tok ? H.tok.baseUrl + "/attachments/" + id + "/download?auth=" + H.tok.token : "";
  }
  /* Aperçu en grand : recouvre tout le widget (ou la fenêtre Historique).
     Clic, bouton × ou Échap pour fermer. */
  var LB = null;
  function closeLightbox() {
    if (!LB) { return; }
    try { LB.doc.removeEventListener("keydown", LB.key, true); } catch (e) { /* fenêtre fermée */ }
    try { LB.el.remove(); } catch (e) { /* déjà retiré */ }
    LB = null;
  }
  function openLightbox(src, caption, colors, doc, onRemove) {
    if (!src) { return; }
    closeLightbox();
    doc = doc || document;
    var lb = doc.createElement("div");
    lb.className = "lb";
    var img = doc.createElement("img");
    img.alt = caption || "Photo"; img.src = src;
    lb.appendChild(img);
    var x = doc.createElement("button");
    x.type = "button"; x.className = "xbtn lb-x"; x.setAttribute("aria-label", "Fermer"); x.textContent = "\u00d7";
    lb.appendChild(x);
    if (caption) {
      var cap = doc.createElement("div");
      cap.className = "lb-cap"; cap.textContent = caption;
      if (colors && colors.fill) { cap.style.background = colors.fill; cap.style.color = colors.text || "#fff"; }
      lb.appendChild(cap);
    }
    if (onRemove) {
      var rm = doc.createElement("button");
      rm.type = "button"; rm.className = "lb-rm"; rm.textContent = "Retirer de la sélection";
      rm.addEventListener("click", function (ev) {
        ev.stopPropagation();
        rm.disabled = true;
        Promise.resolve(onRemove()).then(closeLightbox, function () { rm.disabled = false; });
      });
      lb.appendChild(rm);
    }
    lb.addEventListener("click", closeLightbox);
    var key = function (ev) { if (ev.key === "Escape") { ev.stopImmediatePropagation(); ev.preventDefault(); closeLightbox(); } };
    doc.addEventListener("keydown", key, true);
    doc.body.appendChild(lb);
    LB = { el: lb, doc: doc, key: key };
  }

  function option(value, label) {
    var o = D.createElement("option");
    o.value = value; o.textContent = label;
    return o;
  }

  function closeHistory() {
    closeLightbox();
    var p = popup;
    popup = null; D = document; W = window;
    $("overlay").classList.remove("on");
    if (p && !p.closed) { try { p.close(); } catch (e) { /* ignoré */ } }
  }

  async function openHistory() {
    if (popup && !popup.closed) { popup.focus(); return; }
    if (!choiceColumn || !choicesLoaded || !CHOICES.length) {
      W.alert("Associez d'abord la colonne à choix unique dans le panneau de droite.");
      return;
    }
    // Fenêtre séparée (doit être ouverte pendant le clic, avant tout traitement asynchrone)
    var w = null;
    try { w = window.open("", "gristHistorique", "width=1040,height=720,resizable=yes,scrollbars=yes"); } catch (e) { w = null; }
    D = document; W = window;
    if (w) {
      try {
        var markup = document.getElementById("overlay").outerHTML;
        w.document.open();
        w.document.write('<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Historique</title></head><body class="win"></body></html>');
        w.document.close();
        w.document.head.appendChild(w.document.importNode(document.querySelector("style"), true));
        w.document.body.innerHTML = markup;
        popup = w; D = w.document; W = w;
        w.addEventListener("beforeunload", function () { if (popup === w) { popup = null; D = document; W = window; } });
      } catch (e) {
        try { w.close(); } catch (e2) { /* ignoré */ }
        popup = null; D = document; W = window;
      }
    }
    bindUi();
    $("overlay").classList.add("on");
    $("dateList").innerHTML = '<div class="empty">Chargement…</div>';
    $("pvBody").innerHTML = "";
    $("hApply").disabled = true;
    try {
      H.tableId = await grist.getSelectedTableId();
      H.tok = await grist.docApi.getAccessToken({ readOnly: true });
      H.data = await grist.docApi.fetchTable(H.tableId);
      H.idx = {};
      H.data.id.forEach(function (id, i) { H.idx[id] = i; });
      H.entries = [];
      var cols = await histCols();
      H.hcols = histExtra(cols);
      if (cols && cols.Date) {
        var raw = await grist.docApi.fetchTable(HIST_TABLE);
        (raw[cols.Date.colId] || []).forEach(function (d, i) {
          if (typeof d !== "number") { return; }
          var ids = {};
          CHOICES.forEach(function (c) { if (cols[c]) { ids[c] = (raw[cols[c].colId] || [])[i] || 0; } });
          var ent = { rowId: raw.id[i], date: d, ids: ids };
          if (H.hcols.choice) { ent.choice = (raw[H.hcols.choice.colId] || [])[i] || ""; }
          if (H.hcols.photo) { ent.photo = (raw[H.hcols.photo.colId] || [])[i] || null; }
          H.entries.push(ent);
        });
        H.entries.sort(function (a, b) { return b.date - a.date || b.rowId - a.rowId; });
        var tot = {}, nth = {};
        H.entries.forEach(function (e) { tot[e.date] = (tot[e.date] || 0) + 1; });
        for (var q = H.entries.length - 1; q >= 0; q--) {
          var en = H.entries[q];
          nth[en.date] = (nth[en.date] || 0) + 1;
          if (tot[en.date] > 1) { en.nth = nth[en.date] + "/" + tot[en.date]; }
        }
      }
    } catch (e) {
      $("dateList").innerHTML = "";
      var err = D.createElement("div");
      err.className = "empty"; err.textContent = "Lecture impossible : " + (e && e.message ? e.message : e);
      $("dateList").appendChild(err);
      return;
    }
    H.sel = null;
    buildYears();
  }

  function buildYears() {
    var ys = [];
    H.entries.forEach(function (e) { var y = yearOf(e.date); if (ys.indexOf(y) === -1) { ys.push(y); } });
    ys.sort(function (a, b) { return b - a; });
    var sel = $("yearSel");
    sel.innerHTML = "";
    sel.appendChild(option("", "Toutes"));
    ys.forEach(function (y) { sel.appendChild(option(String(y), String(y))); });
    buildMonths();
  }

  function buildMonths() {
    var y = $("yearSel").value, keep = $("monthSel").value, ms = [];
    H.entries.forEach(function (e) {
      if (y && String(yearOf(e.date)) !== y) { return; }
      var m = monthOf(e.date); if (ms.indexOf(m) === -1) { ms.push(m); }
    });
    ms.sort(function (a, b) { return a - b; });
    var sel = $("monthSel");
    sel.innerHTML = "";
    sel.appendChild(option("", "Tous"));
    ms.forEach(function (m) { sel.appendChild(option(String(m), monthName(m))); });
    sel.value = ms.indexOf(Number(keep)) !== -1 && keep !== "" ? keep : "";
    refreshList();
  }

  function filteredEntries() {
    var y = $("yearSel").value, m = $("monthSel").value;
    return H.entries.filter(function (e) {
      return (!y || String(yearOf(e.date)) === y) && (m === "" || String(monthOf(e.date)) === m);
    });
  }

  // Affiche dans la liste le nombre d'étoiles (note) de l'enregistrement
  function paintListStars(e) {
    if (!e.starEl) { return; }
    var choices = (H.hcols && H.hcols.choice && H.hcols.choice.choices) || [];
    var n = Math.min(5, choices.indexOf(e.choice) + 1);
    e.starEl.textContent = n > 0 ? "\u2605".repeat(n) : "";
    e.starEl.title = n > 0 ? n + " étoile" + (n > 1 ? "s" : "") : "";
  }

  function refreshList() {
    var list = filteredEntries(), box = $("dateList");
    if (list.indexOf(H.sel) === -1) { H.sel = list[0] || null; }
    box.innerHTML = "";
    if (!list.length) {
      box.innerHTML = '<div class="empty">Aucun enregistrement.</div>';
    }
    list.forEach(function (e) {
      var b = D.createElement("button");
      b.type = "button"; b.className = "date"; b.setAttribute("role", "option");
      b.setAttribute("aria-selected", String(e === H.sel));
      var lbl = D.createElement("span");
      lbl.textContent = fmtDate(e.date) + (e.nth ? "  (" + e.nth + ")" : "");
      var st = D.createElement("span");
      st.className = "stars-n";
      e.starEl = st;
      paintListStars(e);
      b.appendChild(lbl); b.appendChild(st);
      b.addEventListener("click", function () {
        H.sel = e;
        box.querySelectorAll(".date").forEach(function (x) { x.setAttribute("aria-selected", String(x === b)); });
        renderPreview();
      });
      box.appendChild(b);
      if (e === H.sel) { setTimeout(function () { b.scrollIntoView({ block: "nearest" }); }, 0); }
    });
    renderPreview();
  }

  /* Colonnes ajoutées à la table Historique : première colonne Choix,
     première colonne Pièces jointes. */
  function histExtra(cols) {
    var r = { choice: null, photo: null };
    Object.keys(cols || {}).forEach(function (label) {
      var c = cols[label];
      if (c.type === "Choice" && !r.choice) { r.choice = c; }
      else if (c.type === "Attachments" && !r.photo) { r.photo = c; }
    });
    return r;
  }

  function setStatus(text, isError) {
    var s = $("detailStatus");
    if (!s) { return; }
    s.textContent = text;
    s.className = "status" + (isError ? " error" : "");
  }

  async function saveExtra(key, value) {
    var e = H.sel;
    if (!e) { return false; }
    setStatus("Enregistrement…");
    try {
      var col = H.hcols[key];
      var f = {}; f[col.colId] = value;
      await grist.docApi.applyUserActions([["UpdateRecord", HIST_TABLE, e.rowId, f]]);
      e[key] = value;
      if (key === "choice") { paintListStars(e); }
      setStatus("✓ Enregistré");
      return true;
    } catch (err) {
      setStatus("Échec : " + (err && err.message ? err.message : err), true);
      return false;
    }
  }

  function renderDetail() {
    var box = $("detail");
    box.innerHTML = "";
    var e = H.sel;
    if (!e) { return; }
    var hc = H.hcols || {};

    if (hc.choice) {
      var f1 = D.createElement("div"); f1.className = "fcol";
      var l1 = D.createElement("label"); l1.textContent = "Note";
      var stars = D.createElement("div"); stars.className = "stars";
      stars.setAttribute("role", "group"); stars.setAttribute("aria-label", "Note");
      var choices = hc.choice.choices;
      var btns = [];
      function paint() {
        var level = choices.indexOf(e.choice) + 1; // 0 = aucune étoile
        btns.forEach(function (b, i) {
          b.className = i < level ? "on" : "";
          b.setAttribute("aria-pressed", String(i < level));
        });
      }
      for (var k = 0; k < 5; k++) {
        (function (n) {
          var b = D.createElement("button");
          b.type = "button"; b.textContent = "\u2605";
          b.title = choices[n - 1] !== undefined ? String(choices[n - 1]) : "";
          b.disabled = choices[n - 1] === undefined;
          b.onclick = async function () {
            var prev = e.choice;
            // recliquer sur la dernière étoile active remet la valeur à vide
            var value = (choices[n - 1] === e.choice) ? "" : choices[n - 1];
            e.choice = value; paint();
            var ok = await saveExtra("choice", value);
            if (!ok) { e.choice = prev; paint(); }
          };
          btns.push(b); stars.appendChild(b);
        })(k + 1);
      }
      paint();
      f1.appendChild(l1); f1.appendChild(stars); box.appendChild(f1);
    }

    if (hc.photo) {
      var fitRow = D.createElement("div"); fitRow.className = "fit-row";
      var fitLbl = D.createElement("span"); fitLbl.textContent = "Ajuster à la largeur";
      var sw = D.createElement("button");
      sw.type = "button"; sw.className = "switch"; sw.setAttribute("role", "switch");
      sw.setAttribute("aria-label", "Ajuster à la largeur");
      sw.setAttribute("aria-checked", String(H.fit));
      fitRow.appendChild(fitLbl); fitRow.appendChild(sw); box.appendChild(fitRow);

      var th = D.createElement("div"); th.className = "thumbs" + (H.fit ? " fit" : "");
      sw.onclick = function () {
        H.fit = !H.fit;
        sw.setAttribute("aria-checked", String(H.fit));
        th.classList.toggle("fit", H.fit);
      };
      var ids = Array.isArray(e.photo) ? e.photo.filter(function (v) { return typeof v === "number"; }) : [];
      if (!ids.length) {
        var none = D.createElement("span"); none.className = "hint"; none.textContent = "Pas de photo";
        th.appendChild(none);
      }
      ids.forEach(function (id) {
        var img = D.createElement("img");
        img.alt = "Photo"; img.src = attUrl(id);
        img.addEventListener("click", function () { openLightbox(img.src, "", null, D); });
        th.appendChild(img);
      });
      box.appendChild(th);
    }

    var st = D.createElement("div"); st.id = "detailStatus"; st.className = "status";
    box.appendChild(st);
  }

  function renderPreview() {
    var body = $("pvBody");
    body.innerHTML = "";
    $("hApply").disabled = !H.sel;
    renderDetail();
    if (!H.sel) { return; }
    var shown = 0;
    CHOICES.forEach(function (c) {
      var id = H.sel.ids[c];
      if (!id || H.idx[id] === undefined) { return; }
      shown++;
      var fig = D.createElement("figure");
      fig.className = "ph";
      var att = photoColumn ? firstAttachment((H.data[photoColumn] || [])[H.idx[id]]) : null;
      if (att) {
        var img = D.createElement("img");
        img.decoding = "async"; img.alt = c; img.src = attUrl(att);
        img.addEventListener("click", function () { openLightbox(img.src, c, CHOICE_COLORS[c], D); });
        fig.appendChild(img);
      } else {
        var none = D.createElement("div");

  async function applyHistory() {
    var e = H.sel;
    if (!e) { return; }
    var btn = $("hApply");
    btn.disabled = true;
    try {
      var data = await grist.docApi.fetchTable(H.tableId);
      var col = data[choiceColumn] || [];
      var existing = {};
      data.id.forEach(function (id) { existing[id] = true; });
      var desired = {}, missing = 0;
      CHOICES.forEach(function (c) {
        var id = e.ids[c];
        if (!id) { return; }
        if (existing[id]) { desired[id] = c; } else { missing++; }
      });
      var actions = [];
      data.id.forEach(function (id, i) {
        var cur = col[i] || "", want = desired[id] || "";
        if ((want || CHOICES.indexOf(cur) !== -1) && cur !== want) {
          var f = {}; f[choiceColumn] = want;
          actions.push(["UpdateRecord", H.tableId, id, f]);
        }
      });
      if (!actions.length) {
        W.alert("L'état actuel est déjà identique à celui du " + fmtDate(e.date) + ".");
        btn.disabled = false;
        return;
      }
      var msg = "Réappliquer l'état du " + fmtDate(e.date) + " ?\n" + actions.length + " ligne(s) seront modifiées.";
      if (missing) { msg += "\n(" + missing + " ligne(s) de l'historique n'existent plus et seront ignorées.)"; }
      if (!W.confirm(msg)) { btn.disabled = false; return; }
      await grist.docApi.applyUserActions(actions);
      closeHistory();
    } catch (err) {
      W.alert("Application impossible : " + (err && err.message ? err.message : err));
    }
    btn.disabled = !H.sel;
  }

  /* -----------------------------------------------------------

     en légende.

  var G = { tok: null, tokAt: 0, busy: false, again: false, sig: null, timer: null, sizeTimer: null };

  async function galleryToken() {
    if (!G.tok || Date.now() - G.tokAt > Math.max(30000, (G.tok.ttlMsecs || 300000) - 60000)) {

  async function refreshGallery() {

    try {
      if (!choiceColumn) {
        galleryMessage("Associez la colonne à choix unique dans le panneau de droite.");

          var ia = CHOICES.indexOf(a.choice), ib = CHOICES.indexOf(b.choice);

        });
        var sig = items.map(function (x) { return x.id + "|" + x.choice + "|" + x.att; }).join(";") + "#" + (photoColumn || "");
        if (sig !== G.sig) {

          body.innerHTML = "";
          if (!items.length) {
            var h = document.createElement("div");

              img.addEventListener("click", function () {
                openLightbox(img.src, it.choice, CHOICE_COLORS[it.choice], null, function () { return removeFromSelection(it.id); });
              });
              fig.appendChild(img);
            } else {

  /* -----------------------------------------------------------
     Tableau « Liste des habits » : lit directement la table
     Mes_habits. Le switch « Sélectionnés » ne garde que les lignes
     dont la colonne Select n'est pas vide.
     ----------------------------------------------------------- */
  var HABITS_TABLE = "Mes_habits";
  var HABIT_COLS = ["Emplacement", "Marque", "Couleur", "Taille", "Description", "nb", "Note", "Photo", "A_ranger"];
  var MIN_COLS = { nb: 1, Note: 1, A_ranger: 1 };
  var CANON = HABIT_COLS.concat(["Select", "Supprime", "Type"]);
  var HB = { busy: false, again: false, sig: null, timer: null, only: false, meta: null, selRules: [],
            selectedId: null, cursorId: null, valById: {}, nbById: {}, typeSel: "", typeSig: null };

  // Comparaison de noms de colonnes sans tenir compte de la casse ni des accents
  function norm(x) { return String(x).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }

  async function habitsMeta() {
    if (HB.meta) { return HB.meta; }
    var T = await grist.docApi.fetchTable("_grist_Tables");
    var C = await grist.docApi.fetchTable("_grist_Tables_column");
    var ref = null;
    for (var i = 0; i < T.id.length; i++) { if (T.tableId[i] === HABITS_TABLE) { ref = T.id[i]; } }
    if (ref === null) { return null; }
    var nameById = {};
    for (var k = 0; k < C.id.length; k++) { nameById[C.id[k]] = C.colId[k]; }
    var meta = {}, selColRef = null, sets = [];
    function ruleSet(rules, wo) {
      var helpers = (Array.isArray(rules) ? listItems(rules) : []).map(function (id) { return nameById[id]; });
      if (helpers.length) { sets.push({ helpers: helpers, styles: Array.isArray(wo.rulesOptions) ? wo.rulesOptions : [] }); }
    }
    for (var j = 0; j < C.id.length; j++) {
      if (C.parentId[j] === ref) {
        var wo = {};
        try { wo = JSON.parse(C.widgetOptions[j] || "{}"); } catch (e) { wo = {}; }
        meta[C.colId[j]] = {
          colId: C.colId[j], type: C.type[j] || "Any", label: C.label[j] || C.colId[j], visible: nameById[C.visibleCol[j]] || null,
          choices: Array.isArray(wo.choices) ? wo.choices : [], colors: wo.choiceOptions || {}
        };
        if (norm(C.colId[j]) === "select") {
          selColRef = C.id[j];
          ruleSet(C.rules ? C.rules[j] : null, wo);
        }
      }
    }
    // Mises en forme conditionnelles définies au niveau de la vue (champ) pour la colonne Select
    if (selColRef !== null) {
      try {
        var F = await grist.docApi.fetchTable("_grist_Views_section_field");
        for (var f = 0; f < F.id.length; f++) {
          if (F.colRef[f] === selColRef && F.rules) {
            var fwo = {};
            try { fwo = JSON.parse(F.widgetOptions[f] || "{}"); } catch (e) { fwo = {}; }
            ruleSet(F.rules[f], fwo);
          }
        }
      } catch (e) { /* on retombe sur les couleurs du choix */ }
    }
    HB.selRules = sets;
    HB.meta = meta;
    return meta;
  }

  // Rend les noms de colonnes insensibles à la casse (nb / Nb, Supprime / Supprimé…)
  function canonize(data, meta) {
    var keys = Object.keys(data);
    CANON.forEach(function (name) {
      if (data[name] !== undefined) { return; }
      for (var i = 0; i < keys.length; i++) {
        if (norm(keys[i]) === norm(name)) {
          data[name] = data[keys[i]];
          if (meta[keys[i]]) { meta[name] = meta[keys[i]]; }
          return;
        }
      }
    });
  }

  // Charge les tables référencées (colonnes Ref / RefList) pour afficher leur texte plutôt que l'ID
  async function habitsRefs(meta, cols) {
    var refs = {};
    for (var i = 0; i < cols.length; i++) {
      var m = meta[cols[i]];
      if (!m || !/^Ref(List)?:/.test(m.type)) { continue; }
      var tbl = m.type.split(":")[1];
      try {
        var t = await grist.docApi.fetchTable(tbl);
        var map = {};
        t.id.forEach(function (id, n) { map[id] = m.visible && t[m.visible] ? t[m.visible][n] : id; });
        refs[cols[i]] = map;
      } catch (e) { /* on affichera l'ID */ }
    }
    return refs;
  }

  function listItems(v) { return (Array.isArray(v) && v[0] === "L") ? v.slice(1) : (Array.isArray(v) ? v : [v]); }

  function isEmptyVal(v, type) {
    if (v === null || v === undefined || v === "" || v === false) { return true; }
    if (v === 0 && /^Ref/.test(type || "")) { return true; }
    if (Array.isArray(v) && listItems(v).length === 0) { return true; }
    return false;
  }

  function cellText(col, v, meta, refs) {
    var type = (meta[col] && meta[col].type) || "Any";
    if (isEmptyVal(v, type)) { return ""; }
    if (type === "Bool") { return "\u2713"; }
    if (/^Date/.test(type) && typeof v === "number") {
      return new Date(v * 1000).toLocaleDateString("fr-FR", { timeZone: "UTC" });
    }
    if (/^Ref(List)?:/.test(type)) {
      var map = refs[col] || {};
      return listItems(v).map(function (id) { return map[id] !== undefined ? map[id] : id; }).join(", ");
    }
    if (Array.isArray(v)) { return listItems(v).join(", "); }
    return String(v);
  }

  // Style d'une ligne sélectionnée : mêmes mises en forme conditionnelles que la colonne Select
  // (règles conditionnelles, sinon couleur du choix, sinon vert par défaut)
  function rowStyle(i, v, data, meta) {
    if (isEmptyVal(v, "")) { return null; }
    for (var s = 0; s < HB.selRules.length; s++) {
      var set = HB.selRules[s];
      for (var k = 0; k < set.helpers.length; k++) {
        var h = set.helpers[k];
        if (h && data[h] && data[h][i] && set.styles[k]) { return set.styles[k]; }
      }
    }
    var co = meta.Select && meta.Select.colors ? meta.Select.colors[String(v)] : null;
    if (co && (co.fillColor || co.textColor)) { return co; }
    return { fillColor: "rgba(22, 179, 120, .18)" };
  }

  function habitsMessage(text) {
    var body = document.getElementById("hbBody");
    body.innerHTML = "";
    var d = document.createElement("div");
    d.className = "hint"; d.textContent = text;
    body.appendChild(d);
    document.getElementById("hbCount").textContent = "";
    HB.sig = null;
  }

  async function refreshHabits() {
    if (HB.busy) { HB.again = true; return; }
    HB.busy = true;
    try {
      var meta = await habitsMeta();
      if (!meta) {
        habitsMessage("Table « " + HABITS_TABLE + " » introuvable.");
      } else {
        var data = await grist.docApi.fetchTable(HABITS_TABLE);
        canonize(data, meta);
        HB.valById = {}; HB.nbById = {};
        if (choiceColumn && data[choiceColumn]) { data.id.forEach(function (id, i) { HB.valById[id] = data[choiceColumn][i]; }); }
        if (data.nb) { data.id.forEach(function (id, i) { HB.nbById[id] = data.nb[i]; }); }
        var types = await loadTypes();
        var linkCol = typeLinkCol(meta);
        var cols = HABIT_COLS.filter(function (c) { return data[c]; });
        var refs = await habitsRefs(meta, linkCol ? cols.concat([linkCol]) : cols);

        // lignes de base : hors supprimées (Supprime = true) et, si demandé, uniquement les sélectionnées
        var base = [];
        data.id.forEach(function (id, i) {
          if (data.Supprime && data.Supprime[i] === true) { return; }
          if (HB.only && data.Select && isEmptyVal(data.Select[i], meta.Select && meta.Select.type)) { return; }
          base.push(i);
        });

        // type(s) de chaque ligne + nombre de lignes par type
        var counts = {}, nameToId = {}, typesOf = {};
        (types || []).forEach(function (t) { nameToId[t.name] = String(t.id); counts[String(t.id)] = 0; });
        base.forEach(function (i) {
          var ids = [];
          if (linkCol) {
            var lv = data[linkCol][i];
            if (/^Ref/.test(meta[linkCol].type)) {
              ids = listItems(lv).filter(function (x) { return x !== null && x !== undefined && x !== 0; }).map(String);
            } else if (nameToId[String(lv)] !== undefined) {
              ids = [nameToId[String(lv)]];
            }
          }
          typesOf[i] = ids;
          ids.forEach(function (id) { if (counts[id] !== undefined) { counts[id]++; } });
        });
        if (types && HB.typeSel !== "" && counts[HB.typeSel] === undefined) { HB.typeSel = ""; }
        renderTypes(types, counts, base.length);

        if (HB.only && !data.Select) {
          habitsMessage("Colonne « Select » introuvable dans " + HABITS_TABLE + ".");
        } else if (HB.typeSel !== "" && !linkCol) {
          habitsMessage("Aucune colonne de " + HABITS_TABLE + " n'est liée à la table Type.");
        } else {
          var rows = [];
          base.forEach(function (i) {
            if (HB.typeSel !== "" && typesOf[i].indexOf(HB.typeSel) === -1) { return; }
            var r = {
              id: data.id[i], att: null, cells: [],
              note: data.Note ? data.Note[i] : null,
              nb: data.nb ? data.nb[i] : null,
              type: linkCol ? cellText(linkCol, data[linkCol][i], meta, refs) : "",
              style: data.Select ? rowStyle(i, data.Select[i], data, meta) : null
            };
            cols.forEach(function (c) {
              if (c === "Photo") { r.att = firstAttachment(data.Photo[i]); r.cells.push(""); }
              else { r.cells.push(cellText(c, data[c][i], meta, refs)); }
            });
            r.title = [r.cells[cols.indexOf("Marque")], r.cells[cols.indexOf("Description")]].filter(Boolean).join(" – ");
            rows.push(r);
          });
          var sig = cols.join(",") + "#" + JSON.stringify(rows.map(function (r) { return [r.id, r.att, r.cells, r.style, r.type]; }));
          if (sig !== HB.sig) {
            HB.sig = sig;
            var tok = await galleryToken();
            var body = document.getElementById("hbBody");
            body.innerHTML = "";
            var table = document.createElement("table");
            table.className = "hb";
            var trh = document.createElement("tr");
            cols.forEach(function (c) {
              var th = document.createElement("th");
              th.textContent = (meta[c] && meta[c].label) || c;
              if (MIN_COLS[c]) { th.className = "min"; }
              trh.appendChild(th);
            });
            var thead = document.createElement("thead");
            thead.appendChild(trh);
            table.appendChild(thead);
            var tbody = document.createElement("tbody");
            rows.forEach(function (r) {
              var tr = document.createElement("tr");
              tr.setAttribute("data-id", r.id);
              if (r.id === HB.selectedId) { tr.className = "sel"; }
              tr.addEventListener("click", function () {
                HB.selectedId = r.id;
                markSelected(false);
                syncSelection();
              });
              cols.forEach(function (c, ci) {
                var td = document.createElement("td");
                var type = (meta[c] && meta[c].type) || "";
                if (MIN_COLS[c]) { td.className = "min"; }
                if (c === "Photo") {
                  td.className = "c";
                  if (r.att) {
                    var img = document.createElement("img");
                    img.className = "hb-th"; img.loading = "lazy"; img.decoding = "async"; img.alt = r.title || "Photo";
                    img.src = tok.baseUrl + "/attachments/" + r.att + "/download?auth=" + tok.token;
                    img.addEventListener("click", function () { openLightbox(img.src, r.title, null); });
                    td.appendChild(img);
                  }
                } else if (c === "Note") {
                  noteEditor(td, r, meta.Note);
                } else if (c === "nb") {
                  var num = document.createElement("span");
                  num.textContent = r.cells[ci];
                  td.appendChild(num);
                  var plus = document.createElement("button");
                  plus.type = "button"; plus.className = "plus"; plus.textContent = "+";
                  plus.title = "Marquer comme porté"; plus.setAttribute("aria-label", "Marquer comme porté");
                  plus.addEventListener("click", function (ev) { ev.stopPropagation(); wearOnce(r, num); });
                  td.appendChild(plus);
                } else {
                  if (type === "Bool") { td.className = "c"; }
                  td.textContent = r.cells[ci];
                }
                if (r.style) {
                  if (r.style.fillColor) { td.style.background = r.style.fillColor; }
                  if (r.style.textColor) { td.style.color = r.style.textColor; }
                  if (r.style.fontBold) { td.style.fontWeight = "700"; }
                }
                tr.appendChild(td);
              });
              tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            body.appendChild(table);
            if (!rows.length) {
              var h = document.createElement("div");
              h.className = "hint";
              h.textContent = HB.only ? "Aucune ligne sélectionnée." : "Aucune ligne.";
              body.appendChild(h);
            }
            document.getElementById("hbCount").textContent = rows.length + " ligne" + (rows.length > 1 ? "s" : "");
          }
        }
      }
      syncSelection();
    } catch (e) {
      habitsMessage("Liste indisponible : " + (e && e.message ? e.message : e));
    }
    HB.busy = false;
    if (HB.again) { HB.again = false; refreshHabits(); }
  }

  // Ligne sélectionnée dans le tableau = ligne ciblée par les boutons de choix du haut
  function syncSelection() {
    var id = HB.selectedId;
    var v = (id != null && Object.prototype.hasOwnProperty.call(HB.valById, id)) ? HB.valById[id] : null;
    if (id !== currentRowId || v !== currentValue) {
      currentRowId = id;
      currentValue = v;
      if (!busy) { render(); }
    }
  }

  function markSelected(scroll) {
    var rows = document.querySelectorAll("#hbBody tbody tr");
    for (var i = 0; i < rows.length; i++) {
      var on = rows[i].getAttribute("data-id") === String(HB.selectedId);
      rows[i].classList.toggle("sel", on);
      if (on && scroll && rows[i].scrollIntoView) { rows[i].scrollIntoView({ block: "nearest" }); }
    }
  }

  // Colonne Note modifiable : liste déroulante des valeurs du choix unique
  function noteEditor(td, r, m) {
    m = m || { type: "Any", choices: [], colors: {} };
    function save(value, ctrl, previous) {
      var fields = {};
      fields[m.colId || "Note"] = value;
      ctrl.disabled = true;
      grist.docApi.applyUserActions([["UpdateRecord", HABITS_TABLE, r.id, fields]])
        .then(function () { ctrl.disabled = false; scheduleHabits(); })
        .catch(function (err) {
          ctrl.disabled = false;
          if ("value" in ctrl) { ctrl.value = previous; }
          alert("Modification impossible : " + (err && err.message ? err.message : err));
        });
    }
    var raw = r.note;
    if (m.type === "Choice") {
      var sel = document.createElement("select");
      sel.className = "hb-note";
      var cur = (raw === null || raw === undefined) ? "" : String(raw);
      var list = [""].concat(m.choices);
      if (cur !== "" && list.indexOf(cur) === -1) { list.push(cur); }
      list.forEach(function (c) {
        var o = document.createElement("option");
        o.value = c; o.textContent = c;
        sel.appendChild(o);
      });
      sel.value = cur;
      var paint = function () {
        var co = m.colors[sel.value];
        sel.style.background = co && co.fillColor ? co.fillColor : "";
        sel.style.color = co && co.textColor ? co.textColor : "";
      };
      paint();
      var prev = cur;
      sel.addEventListener("change", function () {
        paint();
        var old = prev; prev = sel.value;
        save(sel.value === "" ? null : sel.value, sel, old);
      });
      td.appendChild(sel);
    } else if (m.type === "Int" || m.type === "Numeric" || m.type === "Text" || m.type === "Any") {
      var inp = document.createElement("input");
      var numeric = (m.type === "Int" || m.type === "Numeric");
      inp.type = numeric ? "number" : "text";
      inp.className = "hb-note";
      inp.value = (raw === null || raw === undefined) ? "" : String(raw);
      var before = inp.value;
      inp.addEventListener("change", function () {
        var old = before; before = inp.value;
        var v = inp.value.trim() === "" ? null : (numeric ? Number(inp.value) : inp.value);
        save(v, inp, old);
      });
      td.appendChild(inp);
    } else {
      td.textContent = r.cells[HABIT_COLS.indexOf("Note")] || "";
    }
  }

  // Fenêtre de confirmation Oui / Non
  function askWorn(msg) {
    return new Promise(function (resolve) {
      var ov = document.getElementById("wornOverlay");
      document.getElementById("wornMsg").textContent = msg;
      function done(r) {
        ov.classList.remove("on");
        document.removeEventListener("keydown", onKey, true);
        resolve(r);
      }
      function onKey(ev) { if (ev.key === "Escape") { ev.stopImmediatePropagation(); done(false); } }
      document.addEventListener("keydown", onKey, true);
      document.getElementById("wornYes").onclick = function () { done(true); };
      document.getElementById("wornNo").onclick = function () { done(false); };
      ov.classList.add("on");
      document.getElementById("wornYes").focus();
    });
  }

  // Bouton « + » de la colonne nb : après confirmation, ajoute 1 au nombre
  async function wearOnce(r, numEl) {
    var msg = ("Confirmer que cet habit " + r.type + " a été porté ?").replace(/\s+/g, " ");
    var ok = await askWorn(msg);
    if (!ok) { return; }
    var cur = Number(HB.nbById[r.id]);
    if (!isFinite(cur)) { cur = 0; }
    var fields = {};
    fields[(HB.meta && HB.meta.nb && HB.meta.nb.colId) || "nb"] = cur + 1;
    try {
      await grist.docApi.applyUserActions([["UpdateRecord", HABITS_TABLE, r.id, fields]]);
      HB.nbById[r.id] = cur + 1;
      numEl.textContent = String(cur + 1);
      scheduleHabits();
    } catch (err) {
      alert("Modification impossible : " + (err && err.message ? err.message : err));
    }
  }

  /* Cadre « Types » à gauche du tableau : valeurs de Type.Vetement (ordre alphabétique)
     avec le nombre de lignes de chaque type. Un clic filtre le tableau. */
  async function loadTypes() {
    try {
      var t = await grist.docApi.fetchTable("Type");
      if (!t.Vetement) { return null; }
      var list = [];
      t.id.forEach(function (id, i) {
        var n = (t.Vetement[i] === null || t.Vetement[i] === undefined) ? "" : String(t.Vetement[i]).trim();
        if (n !== "") { list.push({ id: id, name: n }); }
      });
      list.sort(function (a, b) { return a.name.localeCompare(b.name, "fr", { sensitivity: "base" }); });
      return list;
    } catch (e) { return null; }
  }

  function renderTypes(types, counts, total) {
    var box = document.getElementById("hbTypes");
    var sig = JSON.stringify([types, counts, total, HB.typeSel]);
    if (sig === HB.typeSig) { return; }
    HB.typeSig = sig;
    var top = box.scrollTop;
    box.innerHTML = "";
    if (!types) {
      var h = document.createElement("div");
      h.className = "hint"; h.textContent = "Table « Type » (colonne Vetement) introuvable.";
      box.appendChild(h);
      return;
    }
    function item(id, label, n) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "tp" + (id === HB.typeSel ? " on" : "") + (n === 0 ? " zero" : "");
      var l = document.createElement("span"); l.className = "tp-l"; l.textContent = label;
      var c = document.createElement("span"); c.className = "tp-n"; c.textContent = String(n);
      b.appendChild(l); b.appendChild(c);
      b.addEventListener("click", function () {
        HB.typeSel = id;
        HB.sig = null;
        refreshHabits();
      });
      box.appendChild(b);
    }
    item("", "Toutes", total);
    types.forEach(function (t) { item(String(t.id), t.name, counts[String(t.id)] || 0); });
    box.scrollTop = top;
  }

  // Colonne de Mes_habits liée à la table Type (Ref:Type), à défaut « Vetement » ou « Type »
  function typeLinkCol(meta) {
    for (var k in meta) { if (/^Ref(List)?:Type$/.test(meta[k].type)) { return k; } }
    return meta.Vetement ? "Vetement" : (meta.Type ? "Type" : null);
  }

  // Retire la ligne de la sélection : vide la valeur de la colonne à choix (Select)
  async function removeFromSelection(id) {
    try {
      await grist.selectedTable.update({ id: id, fields: fieldsWith(choiceColumn, null) });
    } catch (e) {
      alert("Impossible de retirer de la sélection : " + (e && e.message ? e.message : e));
      throw e;
    }
    HB.valById[id] = null;
    syncSelection();
    scheduleGallery();
    scheduleHabits();
  }

  function scheduleHabits() {
    clearTimeout(HB.timer);
    HB.timer = setTimeout(refreshHabits, 200);
  }

  try { HB.only = localStorage.getItem("selectionPhoto.only") === "1"; } catch (e) { /* valeur par défaut */ }
  document.getElementById("hbSel").checked = HB.only;
  document.getElementById("hbSel").addEventListener("change", function (ev) {
    HB.only = ev.target.checked;
    if (HB.only) { HB.typeSel = ""; }   // « Sélectionnés » : retour automatique à « Toutes »
    try { localStorage.setItem("selectionPhoto.only", HB.only ? "1" : "0"); } catch (e) { /* non mémorisé */ }
    HB.sig = null;
    refreshHabits();
  });

  /* -----------------------------------------------------------
     Ce widget doit être lié (« Select by » dans le panneau de
     droite) à la vue principale de Mes_habits, pour connaître la
     ligne actuellement sélectionnée.
     ----------------------------------------------------------- */
  grist.ready({
    columns: [
      { name: "Choix", title: "Colonne à choix unique", type: "Choice", optional: false },
      { name: "Photo", title: "Colonne photo (aperçu de l'historique)", type: "Attachments", optional: true }
    ],
    requiredAccess: "full"
  });

  grist.onRecord(async function (record, mappings) {
    choiceColumn = mappings && mappings.Choix;
    photoColumn = (mappings && mappings.Photo) || null;
    // Le curseur Grist ne change la sélection que lorsqu'il se déplace réellement
    if (record && record.id !== HB.cursorId) {
      HB.cursorId = record.id;
      HB.selectedId = record.id;
      markSelected(true);
    }
    if (record && choiceColumn && record.id === HB.selectedId) { HB.valById[record.id] = record[choiceColumn]; }
    syncSelection();

    await loadChoices();
    render();
    scheduleGallery();
    scheduleHabits();
  });

  // Se met à jour à chaque modification de la table (le contenu est relu via l'API)
  grist.onRecords(function () { scheduleGallery(); scheduleHabits(); });


  grist.onNewRecord(function () {
    HB.cursorId = null;
    HB.selectedId = null;
    markSelected(false);
    syncSelection();
    render();
  });
})();
</script>
</body>
</html>
