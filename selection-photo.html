  /* -----------------------------------------------------------
     Bouton « Ajouter » : formulaire reprenant les colonnes de Mes_habits
     (sauf Cat_taille, Supprime et Select). Type est obligatoire.
     Les photos choisies sont téléversées au moment de l'ajout.
     ----------------------------------------------------------- */
  var ADD = { ctrls: [], files: [], cur: 0, busy: false, photoCol: null, typeCol: null, onKey: null, mode: "add", rowId: null };
  var ADD_SKIP = { cat_taille: 1, supprime: 1, select: 1, id: 1, manualsort: 1 };

  function addEl(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) { e.className = cls; }
    if (text !== undefined) { e.textContent = text; }
    return e;
  }

  // Options d'une colonne Ref : { opts: [{id, name, idx}], t: données de la table liée }
  async function refOptions(m) {
    var out = { opts: [], t: null };
    try {
      var t = await fetchRef(m.type.split(":")[1], false);
      out.t = t;
      t.id.forEach(function (id, n) {
        var v = m.visible && t[m.visible] ? t[m.visible][n] : id;
        var name = (v === null || v === undefined) ? "" : String(v);
        if (name !== "") { out.opts.push({ id: id, name: name, idx: n }); }
      });
      out.opts.sort(function (a, b) { return a.name.localeCompare(b.name, "fr", { sensitivity: "base" }); });
    } catch (e) { /* liste vide */ }
    return out;
  }

  function findKey(t, name) {
    var keys = Object.keys(t);
    for (var i = 0; i < keys.length; i++) { if (norm(keys[i]) === norm(name)) { return keys[i]; } }
    return null;
  }

  // « choice.Cat == $Cat_taille »  ->  { attr: "Cat", recCol: "Cat_taille" }
  function parseCond(text) {
    if (!text) { return null; }
    var a = /^\s*choice\.(\w+)\s*==\s*(?:\$|rec\.)(\w+)\s*$/.exec(text);
    if (a) { return { attr: a[1], recCol: a[2] }; }
    var b = /^\s*(?:\$|rec\.)(\w+)\s*==\s*choice\.(\w+)\s*$/.exec(text);
    if (b) { return { attr: b[2], recCol: b[1] }; }
    return null;
  }

  // Téléverse les photos dans Grist. Plusieurs méthodes sont tentées ; l'erreur détaille chaque essai.
  async function uploadPhotos(files) {
    var tok = await grist.docApi.getAccessToken({ readOnly: false });
    var bases = [tok.baseUrl];
    if (/^http:/.test(tok.baseUrl) && location.protocol === "https:") { bases.push(tok.baseUrl.replace(/^http:/, "https:")); }
    var tries = [];
    for (var b = 0; b < bases.length; b++) {
      var modes = ["query", "bearer"];
      for (var k = 0; k < modes.length; k++) {
        var fd = new FormData();
        files.forEach(function (f) { fd.append("upload", f.file, f.file.name); });
        try {
          var resp = await fetch(
            modes[k] === "query" ? bases[b] + "/attachments?auth=" + encodeURIComponent(tok.token) : bases[b] + "/attachments",
            // X-Requested-With est exigé par Grist pour les envois (POST) depuis un widget
            { method: "POST", body: fd, headers: modes[k] === "bearer"
                ? { "X-Requested-With": "XMLHttpRequest", Authorization: "Bearer " + tok.token }
                : { "X-Requested-With": "XMLHttpRequest" } }
          );
          if (!resp.ok) {
            var txt = "";
            try { txt = (await resp.text()).slice(0, 100); } catch (e) { /* sans détail */ }
            throw new Error("code " + resp.status + (txt ? " " + txt : ""));
          }
          return await resp.json();
        } catch (e) {
          tries.push((modes[k] === "query" ? "auth" : "Bearer") + " : " + (e && e.message ? e.message : e));
        }
      }
    }
    throw new Error(tries.join(" | "));
  }

  // Fenêtre « Nouvelle marque » : renvoie le texte saisi ou null
  function askBrand() {
    return new Promise(function (resolve) {
      var ov = document.getElementById("brandOverlay"), inp = document.getElementById("brandInput"), err = document.getElementById("brandErr");
      inp.value = ""; err.textContent = "";
      function done(v) {
        ov.classList.remove("on");
        document.removeEventListener("keydown", onKey, true);
        resolve(v);
      }
      function ok() {
        var v = inp.value.trim();
        if (!v) { err.textContent = "Saisissez un nom de marque."; inp.focus(); return; }
        done(v);
      }
      function onKey(ev) {
        if (ev.key === "Escape") { ev.stopImmediatePropagation(); done(null); }
        else if (ev.key === "Enter" && ev.target === inp) { ev.preventDefault(); ok(); }
      }
      document.addEventListener("keydown", onKey, true);
      document.getElementById("brandYes").onclick = ok;
      document.getElementById("brandNo").onclick = function () { done(null); };
      ov.classList.add("on");
      inp.focus();
    });
  }

  // Ajoute une marque non listée dans la table Marques (colonne Marque) puis la sélectionne
  async function addBrand(c, m) {
    var name = await askBrand();
    if (!name) { return; }
    if (c.ro) {
      var same = c.ro.opts.filter(function (o) { return norm(o.name) === norm(name); })[0];
      if (same) { c.render(String(same.id)); return; }

    } catch (e) {

      return;
    }
    var nid = res && res.retValues ? res.retValues[0] : null;
    delete REFC[tbl];
    if (c.addOption && typeof nid === "number") { c.addOption(nid, name); }

  function brandRow(c, m) {
    var row = addEl("div", "af-row");
    row.appendChild(c.el);
    var plus = addEl("button", "g-btn", "+");

    plus.addEventListener("click", function () { addBrand(c, m); });

  function chipGroup(options) {
    var box = addEl("div", "chips"), boxes = [];
    options.forEach(function (o) {
      var lab = addEl("label", "chip");
      var cb = document.createElement("input");
      cb.type = "checkbox"; cb.value = o.value;
      lab.appendChild(cb);
      lab.appendChild(document.createTextNode(o.label));
      box.appendChild(lab);
      boxes.push(cb);
    });
    return {
      el: box,
      vals: function () { return boxes.filter(function (b) { return b.checked; }).map(function (b) { return b.value; }); },
      setVals: function (arr) { boxes.forEach(function (b) { b.checked = arr.indexOf(b.value) !== -1; }); }
    };
  }

  function selectOf(options) {
    var sel = document.createElement("select");
    var none = document.createElement("option");
    none.value = ""; none.textContent = "";
    sel.appendChild(none);
    options.forEach(function (o) {
      var op = document.createElement("option");
      op.value = o.value; op.textContent = o.label;
      sel.appendChild(op);
    });
    return sel;
  }

  // Crée le champ de saisie d'une colonne : { el, get(), tall }  (get() renvoie undefined si vide)
  async function makeControl(m) {
    var t = m.type, inp;
    if (t === "Bool") {
      var lab = addEl("label", "sw sm"), cb = document.createElement("input");
      cb.type = "checkbox";
      lab.appendChild(cb); lab.appendChild(addEl("span", "track"));
      return { el: lab, get: function () { return cb.checked ? true : undefined; }, set: function (v) { cb.checked = !!v; } };
    }
    if (t === "Choice") {
      var sc = selectOf(m.choices.map(function (c) { return { value: c, label: c }; }));
      return {
        el: sc,
        get: function () { return sc.value !== "" ? sc.value : undefined; },
        setValue: function (v) {
          if (!Array.prototype.some.call(sc.options, function (o) { return o.value === v; })) {
            var op = document.createElement("option");
            op.value = v; op.textContent = v;
            sc.appendChild(op);
          }
          sc.value = v;
        },
        set: function (v) {
          var s2 = (v === null || v === undefined) ? "" : String(v);
          if (s2 !== "" && !Array.prototype.some.call(sc.options, function (o) { return o.value === s2; })) {
            var op = document.createElement("option");
            op.value = s2; op.textContent = s2;
            sc.appendChild(op);
          }
          sc.value = s2;
        }
      };
    }
    if (t === "ChoiceList") {
      var gc = chipGroup(m.choices.map(function (c) { return { value: c, label: c }; }));
      return {
        el: gc.el, tall: true,
        get: function () { var v = gc.vals(); return v.length ? ["L"].concat(v) : undefined; },
        set: function (v) { gc.setVals(Array.isArray(v) ? listItems(v).map(String) : []); }
      };
    }
    if (/^Ref:/.test(t)) {
      var ro1 = await refOptions(m);
      var sr = document.createElement("select");
      var ctl = { el: sr, ro: ro1, filter: null, blocked: false, blockedText: "" };
      // (re)construit la liste en appliquant la condition éventuelle ; keep = valeur à conserver
      ctl.render = function (keep) {
        var cur = keep !== undefined ? keep : sr.value;
        sr.innerHTML = "";
        var none = document.createElement("option");
        none.value = ""; none.textContent = ctl.blocked ? ctl.blockedText : "";
        sr.appendChild(none);
        var list = ro1.opts.filter(function (o) { return !ctl.filter || ctl.filter(o); });
        list.forEach(function (o) {
          var op = document.createElement("option");
          op.value = String(o.id); op.textContent = o.name;
          sr.appendChild(op);
        });
        sr.value = list.some(function (o) { return String(o.id) === String(cur); }) ? String(cur) : "";
        sr.disabled = ctl.blocked;
      };
      ctl.addOption = function (id, name) {
        ro1.opts.push({ id: id, name: name, idx: -1 });
        ro1.opts.sort(function (a, b) { return a.name.localeCompare(b.name, "fr", { sensitivity: "base" }); });
        ctl.render(String(id));
      };
      ctl.get = function () { return sr.value !== "" ? Number(sr.value) : undefined; };
      ctl.set = function (v) {
        if (v === null || v === undefined || v === 0 || v === "") { sr.value = ""; return; }
        var sid = String(v);
        if (!Array.prototype.some.call(sr.options, function (o) { return o.value === sid; })) {
          var found = ro1.opts.filter(function (o) { return String(o.id) === sid; })[0];
          if (found) {
            var op = document.createElement("option");
            op.value = sid; op.textContent = found.name;
            sr.appendChild(op);
          }
        }
        sr.value = sid;
      };
      ctl.render("");
      return ctl;
    }
    if (/^RefList:/.test(t)) {
      var ro = (await refOptions(m)).opts;
      var gr = chipGroup(ro.map(function (o) { return { value: String(o.id), label: o.name }; }));
      return {
        el: gr.el, tall: true,
        get: function () { var v = gr.vals(); return v.length ? ["L"].concat(v.map(Number)) : undefined; },
        set: function (v) { gr.setVals(Array.isArray(v) ? listItems(v).map(String) : []); }
      };
    }
    if (t === "Int" || t === "Numeric") {
      inp = document.createElement("input");
      inp.type = "number"; inp.step = t === "Int" ? "1" : "any";
      if (norm(m.colId) === "nb") { inp.value = "0"; }   // nb : 0 par défaut
      return {
        el: inp,
        get: function () { return inp.value !== "" && isFinite(Number(inp.value)) ? Number(inp.value) : undefined; },
        set: function (v) { inp.value = (v === null || v === undefined || v === "") ? "" : String(v); }
      };
    }
    if (/^Date:?/.test(t) && t !== "DateTime" && !/^DateTime/.test(t)) {
      inp = document.createElement("input");
      inp.type = "date";
      return { el: inp, get: function () {
        var p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(inp.value);
        return p ? Date.UTC(+p[1], +p[2] - 1, +p[3]) / 1000 : undefined;
      }, set: function (v) { inp.value = typeof v === "number" ? new Date(v * 1000).toISOString().slice(0, 10) : ""; } };
    }
    if (/^DateTime/.test(t)) {
      inp = document.createElement("input");
      inp.type = "datetime-local";
      return { el: inp, get: function () {
        var ms = inp.value ? new Date(inp.value).getTime() : NaN;
        return isFinite(ms) ? ms / 1000 : undefined;
      }, set: function (v) {
        if (typeof v !== "number") { inp.value = ""; return; }
        var d = new Date(v * 1000), z = function (n) { return (n < 10 ? "0" : "") + n; };
        inp.value = d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate()) + "T" + z(d.getHours()) + ":" + z(d.getMinutes());
      } };
    }
    if (norm(m.colId) === "description") {
      inp = document.createElement("textarea");
      inp.rows = 2;
      return {
        el: inp, tall: true,
        get: function () { return inp.value.trim() !== "" ? inp.value.trim() : undefined; },
        set: function (v) { inp.value = (v === null || v === undefined) ? "" : String(v); }
      };
    }
    inp = document.createElement("input");
    inp.type = "text";
    return {
      el: inp,
      get: function () { return inp.value.trim() !== "" ? inp.value.trim() : undefined; },
      setValue: function (v) { inp.value = v; },
      set: function (v) { inp.value = (v === null || v === undefined) ? "" : String(v); }
    };
  }

  async function buildAddForm(meta) {
    var seen = {}, list = [];
    for (var k in meta) {
      var m = meta[k];
      if (seen[m.colId]) { continue; }
      seen[m.colId] = 1;
      list.push(m);
    }
    list.sort(function (a, b) { return a.pos - b.pos; });
    var usable = list.filter(function (m) {
      return !m.isFormula && m.type !== "ManualSortPos" && !/^gristHelper_/.test(m.colId) && !ADD_SKIP[norm(m.colId)];
    });
    var photo = usable.filter(function (m) { return m.type === "Attachments" && norm(m.colId) === "photo"; })[0]
             || usable.filter(function (m) { return m.type === "Attachments"; })[0] || null;
    ADD.photoCol = photo ? photo.colId : null;
    var fields = usable.filter(function (m) { return m.type !== "Attachments"; });
    var typeM = fields.filter(function (m) { return norm(m.colId) === "type"; })[0];
    if (!typeM) {
      var lk = typeLinkCol(meta);
      typeM = lk ? meta[lk] : null;
      if (typeM && fields.indexOf(typeM) === -1) { typeM = null; }
    }
    ADD.typeCol = typeM ? typeM.colId : null;

    var grid = document.getElementById("addGrid");
    grid.innerHTML = "";
    ADD.ctrls = [];
    var made = await Promise.all(fields.map(function (fm) { return makeControl(fm); }));
    made.forEach(function (c, i) { ADD.ctrls.push({ m: fields[i], c: c }); });
    function labelFor(x) {
      var lab = addEl("label", "", x.m.label || x.m.colId);
      if (x.c.tall) { lab.className = "tall"; }
      if (x.m.colId === ADD.typeCol) { lab.className += " req"; }
      return lab;
    }
    var nbX = ADD.ctrls.filter(function (x) { return norm(x.m.colId) === "nb"; })[0];
    var noteX = ADD.ctrls.filter(function (x) { return norm(x.m.colId) === "note"; })[0];
    var pairDone = false;
    ADD.ctrls.forEach(function (x) {
      if (nbX && noteX && (x === nbX || x === noteX)) {
        // nb et Note : champs réduits, côte à côte sur une même ligne
        if (pairDone) { return; }
        pairDone = true;
        grid.appendChild(labelFor(nbX));
        var pair = addEl("div", "af-pair");
        pair.appendChild(nbX.c.el);
        pair.appendChild(addEl("span", "af-sub", noteX.m.label || noteX.m.colId));
        pair.appendChild(noteX.c.el);
        grid.appendChild(pair);
        return;
      }
      grid.appendChild(labelFor(x));
      grid.appendChild(norm(x.m.colId) === "marque" ? brandRow(x.c, x.m) : x.c.el);
    });

    // Condition de liste déroulante (ex. Taille : choice.Cat == $Cat_taille)
    function findCtrl(name) { return ADD.ctrls.filter(function (x) { return norm(x.m.colId) === norm(name); })[0]; }
    function findMeta(name) {
      for (var mk in meta) { if (norm(meta[mk].colId) === norm(name)) { return meta[mk]; } }
      return null;
    }
    // Valeur d'une colonne de Mes_habits pour la ligne en cours de saisie :
    // champ du formulaire, ou colonne formule du type $Type.xxx calculée depuis le type choisi.
    // Renvoie null si on ne sait pas l'évaluer, { ok:false } si le type n'est pas choisi.
    function evalCol(name, deps) {
      var c = findCtrl(name);
      if (c) { deps.push(c); var v = c.c.get(); return v === undefined ? { ok: false } : { ok: true, value: v }; }
      var cm = findMeta(name), mm = cm && cm.formula ? /^\s*(?:\$|rec\.)(\w+)\.(\w+)\s*$/.exec(cm.formula) : null;
      var base = mm ? findCtrl(mm[1]) : findCtrl(ADD.typeCol || "");
      var attr = mm ? mm[2] : name;
      if (!base || !base.c.ro || !base.c.ro.t) { return null; }
      var key = findKey(base.c.ro.t, attr) || (mm ? null : findKey(base.c.ro.t, "Cat"));
      if (!key) { return null; }
      deps.push(base);
      var id = base.c.get();
      if (id === undefined) { return { ok: false }; }
      var idx = base.c.ro.t.id.indexOf(id);
      return idx < 0 ? { ok: false } : { ok: true, value: base.c.ro.t[key][idx] };
    }
    ADD.ctrls.forEach(function (x) {
      var cond = parseCond(x.m.dropText || (norm(x.m.colId) === "taille" ? "choice.Cat == $Cat_taille" : ""));
      if (!cond || !x.c.render || !x.c.ro || !x.c.ro.t) { return; }
      var key = findKey(x.c.ro.t, cond.attr);
      if (!key) { return; }
      function apply() {
        var r = evalCol(cond.recCol, []);
        if (r === null) { x.c.filter = null; x.c.blocked = false; }
        else if (!r.ok) { x.c.filter = function () { return false; }; x.c.blocked = true; x.c.blockedText = "Choisir d'abord le type"; }
        else {
          x.c.blocked = false;
          x.c.filter = function (o) { return o.idx < 0 || String(x.c.ro.t[key][o.idx]) === String(r.value); };
        }
        x.c.render();
      }
      var deps = [];
      evalCol(cond.recCol, deps);
      deps.forEach(function (d) { d.c.el.addEventListener("change", apply); });
      x.cond = { apply: apply };
      apply();
    });
    ADD.files.forEach(function (f) { if (f.file) { URL.revokeObjectURL(f.url); } });
    ADD.files = []; ADD.cur = 0;
    document.getElementById("addViewer").style.display = ADD.photoCol ? "" : "none";
    document.getElementById("addErr").textContent = "";
    renderViewer();
  }

  function closeAdd() {
    document.getElementById("addOverlay").classList.remove("on");
    ADD.files.forEach(function (f) { if (f.file) { URL.revokeObjectURL(f.url); } });
    ADD.files = [];
    if (ADD.onKey) { document.removeEventListener("keydown", ADD.onKey); ADD.onKey = null; }
  }

  // Titre et boutons selon le mode : ajout ou modification d'une ligne existante
  function applyMode() {
    var edit = ADD.mode === "edit";
    document.getElementById("addTitle").textContent = edit ? "Modifier un habit" : "Ajouter un habit";
    document.getElementById("addSubmit").textContent = edit ? "Enregistrer" : "Ajouter au dressing";
    document.getElementById("addDel").hidden = !edit;
  }

  function showAdd() {
    document.getElementById("addOverlay").classList.add("on");
    ADD.onKey = function (ev) { if (ev.key === "Escape" && !ADD.busy) { closeAdd(); } };
    document.addEventListener("keydown", ADD.onKey);
    var first = document.querySelector("#addGrid input, #addGrid select, #addGrid textarea");
    if (first) { first.focus(); }
  }

  async function openAdd() {
    var btn = document.getElementById("addBtn");
    btn.disabled = true;
    try {
      var meta = await habitsMeta();
      if (!meta) { alert("Table « " + HABITS_TABLE + " » introuvable."); return; }
      ADD.mode = "add"; ADD.rowId = null;
      await buildAddForm(meta);
      applyMode();
      showAdd();
    } catch (e) {
      alert("Impossible d'ouvrir le formulaire : " + (e && e.message ? e.message : e));
    } finally {
      btn.disabled = false;
    }
  }

  // Remplit le formulaire avec les valeurs d'une ligne (les champs dépendants, ex. Taille, en dernier)
  function fillForm(data, idx) {
    function put(x) { if (x.c.set) { x.c.set(data[x.m.colId] ? data[x.m.colId][idx] : undefined); } }
    ADD.ctrls.filter(function (x) { return !x.cond; }).forEach(put);
    ADD.ctrls.forEach(function (x) { if (x.cond) { x.cond.apply(); } });
    ADD.ctrls.filter(function (x) { return x.cond; }).forEach(put);
  }

  // Double clic sur une ligne : formulaire de modification
  async function openEdit(id) {
    if (ADD.busy || document.getElementById("addOverlay").classList.contains("on")) { return; }
    try {
      var meta = await habitsMeta();
      if (!meta) { return; }
      var data = (HB.cache && HB.cache.data) || await grist.docApi.fetchTable(HABITS_TABLE);
      var idx = data.id.indexOf(id);
      if (idx < 0) { return; }
      ADD.mode = "edit"; ADD.rowId = id;
      await buildAddForm(meta);
      fillForm(data, idx);
      if (ADD.photoCol && data[ADD.photoCol]) {
        var tok = await galleryToken();
        ADD.files = listItems(data[ADD.photoCol][idx]).filter(function (n) { return typeof n === "number"; }).map(function (n) {
          return { att: n, url: tok.baseUrl + "/attachments/" + n + "/download?auth=" + tok.token };
        });
        ADD.cur = 0;
        renderViewer();
      }
      applyMode();
      showAdd();
    } catch (e) {
      alert("Impossible d'ouvrir le formulaire : " + (e && e.message ? e.message : e));
    }
  }

  // Valeur utilisée pour vider un champ lors d'une modification
  function clearValue(m) {
    if (m.type === "Bool") { return false; }
    if (/^Ref:/.test(m.type)) { return 0; }
    if (m.type === "Text" || m.type === "Choice") { return ""; }
    return null;
  }

  async function submitAdd() {
    if (ADD.busy) { return; }
    var edit = ADD.mode === "edit";
    var err = document.getElementById("addErr");
    err.textContent = "";
    var raws = ADD.ctrls.map(function (x) { x.c.el.classList.remove("af-bad"); return x.c.get(); });
    var missingType = false;
    ADD.ctrls.forEach(function (x, k) {
      if (x.m.colId === ADD.typeCol && raws[k] === undefined) {
        missingType = true;
        x.c.el.classList.add("af-bad");
        var f = x.c.el.matches("input,select,textarea") ? x.c.el : x.c.el.querySelector("input,select,textarea");
        if (f) { f.focus(); }
      }
    });
    if (missingType) { err.textContent = "Le champ Type est obligatoire."; return; }
    var fields = {};
    ADD.ctrls.forEach(function (x, k) {
      if (raws[k] !== undefined) { fields[x.m.colId] = raws[k]; }
      else if (edit) { fields[x.m.colId] = clearValue(x.m); }
    });
    var submit = document.getElementById("addSubmit"), del = document.getElementById("addDel");
    ADD.busy = true; submit.disabled = true; del.disabled = true;
    submit.textContent = edit ? "Enregistrement…" : "Ajout…";
    try {
      if (ADD.photoCol) {
        var keep = ADD.files.filter(function (f) { return f.att; }).map(function (f) { return f.att; });
        var fresh = ADD.files.filter(function (f) { return f.file; });
        var added = [];
        if (fresh.length) {
          try {
            added = await uploadPhotos(fresh);
          } catch (upErr) {
            var why = upErr && upErr.message ? upErr.message : String(upErr);
            var go = await askWorn("Les photos n'ont pas pu être téléversées (" + why + "). " + (edit ? "Enregistrer sans les nouvelles photos ?" : "Ajouter l'habit sans photo ?"));
            if (!go) { throw new Error("photos non téléversées (" + why + ")"); }
          }
        }
        var all = keep.concat(added);
        if (edit) { fields[ADD.photoCol] = all.length ? ["L"].concat(all) : null; }
        else if (all.length) { fields[ADD.photoCol] = ["L"].concat(all); }
      }
      if (edit) {
        await grist.docApi.applyUserActions([["UpdateRecord", HABITS_TABLE, ADD.rowId, fields]]);
      } else {
        var res = await grist.docApi.applyUserActions([["AddRecord", HABITS_TABLE, null, fields]]);
        var nid = res && res.retValues ? res.retValues[0] : null;
        if (typeof nid === "number") { HB.selectedId = nid; }
      }
      closeAdd();
      syncSelection();
      HB.sig = null;
      scheduleHabits();
      scheduleGallery();
    } catch (e) {
      err.textContent = (edit ? "Échec de l'enregistrement : " : "Échec de l'ajout : ") + (e && e.message ? e.message : e);
    }
    ADD.busy = false; submit.disabled = false; del.disabled = false;
    submit.textContent = edit ? "Enregistrer" : "Ajouter au dressing";
  }

  // Fenêtre à trois boutons : renvoie "retire", "delete" ou null (annuler)
  function askDelete() {
    return new Promise(function (resolve) {
      var ov = document.getElementById("delOverlay");
      function done(r) {
        ov.classList.remove("on");
        document.removeEventListener("keydown", onKey, true);
        resolve(r);
      }
      function onKey(ev) { if (ev.key === "Escape") { ev.stopImmediatePropagation(); done(null); } }
      document.addEventListener("keydown", onKey, true);
      document.getElementById("delCancel").onclick = function () { done(null); };
      document.getElementById("delRetire").onclick = function () { done("retire"); };
      document.getElementById("delRemove").onclick = function () { done("delete"); };
      ov.classList.add("on");
      document.getElementById("delCancel").focus();
    });
  }

  // « Supprimer » du formulaire de modification : Retirer (Supprime = vrai) ou supprimer définitivement
  async function deleteFromEdit() {
    if (ADD.mode !== "edit" || ADD.busy) { return; }
    var choice = await askDelete();
    if (!choice) { return; }
    var id = ADD.rowId, err = document.getElementById("addErr");
    err.textContent = "";
    try {
      if (choice === "retire") {
        var sc = null;
        for (var k in HB.meta) { if (norm(HB.meta[k].colId) === "supprime") { sc = HB.meta[k].colId; } }
        if (!sc) { throw new Error("colonne « Supprime » introuvable"); }
        var f = {};
        f[sc] = true;
        await grist.docApi.applyUserActions([["UpdateRecord", HABITS_TABLE, id, f]]);
      } else {
        var ok = await askWorn("Cet article sera définitivement supprimé. Confirmer ?");
        if (!ok) { return; }
        await grist.docApi.applyUserActions([["RemoveRecord", HABITS_TABLE, id]]);
      }
    } catch (e) {
      err.textContent = "Échec : " + (e && e.message ? e.message : e);
      return;
    }
    if (HB.selectedId === id) { HB.selectedId = null; }
    closeAdd();
    syncSelection();
    HB.sig = null;
    scheduleHabits();
    scheduleGallery();
  }

  document.getElementById("addBtn").addEventListener("click", openAdd);
  document.getElementById("addDel").addEventListener("click", deleteFromEdit);
  document.getElementById("addX").addEventListener("click", closeAdd);
  document.getElementById("addCancel").addEventListener("click", closeAdd);
  document.getElementById("addSubmit").addEventListener("click", submitAdd);
  document.getElementById("vwAdd").addEventListener("click", function () { document.getElementById("vwFile").click(); });
  document.getElementById("vwFile").addEventListener("change", function (ev) {
    Array.prototype.forEach.call(ev.target.files, function (file) {
      if (/^image\//.test(file.type)) { ADD.files.push({ file: file, url: URL.createObjectURL(file) }); }
    });
    if (ev.target.files.length) { ADD.cur = ADD.files.length - 1; }
    ev.target.value = "";
    renderViewer();
  });
  document.getElementById("vwDel").addEventListener("click", function () {
    if (!ADD.files.length) { return; }
    if (ADD.files[ADD.cur].file) { URL.revokeObjectURL(ADD.files[ADD.cur].url); }
    ADD.files.splice(ADD.cur, 1);
    renderViewer();
  });
  document.getElementById("vwPrev").addEventListener("click", function () {
    if (ADD.files.length) { ADD.cur = (ADD.cur - 1 + ADD.files.length) % ADD.files.length; renderViewer(); }
  });
  document.getElementById("vwNext").addEventListener("click", function () {
    if (ADD.files.length) { ADD.cur = (ADD.cur + 1) % ADD.files.length; renderViewer(); }
  });

  /* -----------------------------------------------------------
     Mosaïque de photos (ancien widget « grist-mosaique ») intégrée :
     - un clic sur une vignette sélectionne la ligne correspondante du tableau ;
     - un double clic ouvre l'aperçu (zoom, navigation, édition des champs).
     ----------------------------------------------------------- */
  var MOS = {
    on: false, records: [], index: [], filtered: [], shown: 0, tok: null, tokTimer: null, curRow: null, curImg: 0,
    hideCol: null, typeCol: null, typeSel: "", choiceOpts: {}, refOpts: {}, meta: null, photoCol: null, legCols: [],
    hiddenCols: new Set(), roCols: new Set(), colType: {}, loading: false, again: false, timer: null, rt: null,
    Z: { z: 1, x: 0, y: 0 }, drag: null
  };
  var MOS_PAGE = 120;
  var MOS_FORCE_RO = ["type", "marque"];                 // colonnes en lecture seule dans l'aperçu
  var MOS_VIEW_HIDDEN = ["cat_taille", "select", "supprime"];   // colonnes non affichées dans l'aperçu (restent cherchables)
  var $m = function (id) { return document.getElementById(id); };

  var mosAttIds = function (v) { return Array.isArray(v) ? v.filter(function (x) { return typeof x === "number"; }) : []; };
  var mosFmt = function (v) {
    return v instanceof Date ? v.toLocaleString("fr-FR")
      : Array.isArray(v) ? v.filter(function (x) { return x !== "L"; }).join(", ")
      : (v && typeof v === "object") ? JSON.stringify(v) : (v === null || v === undefined ? "" : v);
  };
  var mosUrl = function (id) { return MOS.tok ? MOS.tok.baseUrl + "/attachments/" + id + "/download?auth=" + MOS.tok.token : ""; };
  var mosHidden = function (k) { return k === "id" || k === "__raw" || k === MOS.photoCol || MOS.hiddenCols.has(k); };
  var mosVisible = function (r) { return mosAttIds(r[MOS.photoCol]).length > 0 && !(MOS.hideCol && r[MOS.hideCol] === true); };
  function mosLegend(r) {
    return MOS.legCols.map(function (c) { return r[c]; })
      .filter(function (v) { return v !== null && v !== undefined && v !== ""; }).map(mosFmt).join(" – ");
  }

  async function mosRefreshToken() {
    if (!MOS.on) { return; }
    try {
      MOS.tok = await grist.docApi.getAccessToken({ readOnly: true });
      document.querySelectorAll("#mos img[data-att], #mModal img[data-att]").forEach(function (i) { if (!i.complete) { i.src = mosUrl(i.dataset.att); } });
      clearTimeout(MOS.tokTimer);
      MOS.tokTimer = setTimeout(mosRefreshToken, Math.max(30000, (MOS.tok.ttlMsecs || 300000) - 60000));
    } catch (e) { MOS.tokTimer = setTimeout(mosRefreshToken, 10000); }
  }

  // ---- index de recherche, filtre, types ----
  function mosBuildIndex() {
    MOS.index = MOS.records.map(function (r) {
      var parts = [];
      Object.keys(r).forEach(function (k) {
        if (mosHidden(k)) { return; }
        try { parts.push(mosFmt(r[k])); } catch (e) { parts.push(String(r[k])); }
      });
      return norm(parts.join(" "));
    });
  }

  function mosApplyFilter(keep) {
    var main = $m("mMain"), grid = $m("mGrid");
    var st = keep ? main.scrollTop : 0;
    var terms = norm($m("mQ").value).split(/\s+/).filter(Boolean);
    MOS.filtered = [];
    MOS.records.forEach(function (r, i) {
      if (!mosVisible(r)) { return; }
      if (MOS.typeSel && String(MOS.typeCol ? (r[MOS.typeCol] === null || r[MOS.typeCol] === undefined ? "" : r[MOS.typeCol]) : "") !== MOS.typeSel) { return; }
      if (terms.every(function (t) { return MOS.index[i].indexOf(t) !== -1; })) { MOS.filtered.push(r); }
    });
    var total = MOS.records.filter(mosVisible).length;
    $m("mCount").textContent = MOS.filtered.length + " photo" + (MOS.filtered.length > 1 ? "s" : "") + " sur " + total;
    grid.innerHTML = ""; MOS.shown = 0;
    if (!MOS.filtered.length) { grid.innerHTML = '<div class="ms-empty">Aucune photo ne correspond.</div>'; }
    mosRenderMore();
    while (st && MOS.shown < MOS.filtered.length && grid.scrollHeight < st + main.clientHeight + 600) { mosRenderMore(); }
    main.scrollTop = st;
  }

  function mosBuildTypes() {
    var box = $m("mTypes");
    if (!MOS.typeCol) { box.innerHTML = ""; return; }
    var seen = {};
    MOS.records.filter(mosVisible).forEach(function (r) {
      var v = r[MOS.typeCol] === null || r[MOS.typeCol] === undefined ? "" : String(r[MOS.typeCol]);
      if (v) { seen[v] = 1; }
    });
    var vals = Object.keys(seen).sort(function (a, b) { return a.localeCompare(b, "fr", { numeric: true }); });
    if (!vals.length) { box.innerHTML = ""; return; }
    if (MOS.typeSel && vals.indexOf(MOS.typeSel) === -1) { MOS.typeSel = ""; }
    box.innerHTML = "";
    [""].concat(vals).forEach(function (v) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = v || "TOUS"; b.dataset.v = v;
      b.setAttribute("aria-pressed", String(v === MOS.typeSel));
      box.appendChild(b);
    });
  }

  // ---- rendu progressif des vignettes ----
  function mosRenderMore() {
    var frag = document.createDocumentFragment();
    MOS.filtered.slice(MOS.shown, MOS.shown + MOS_PAGE).forEach(function (r) {
      var id = mosAttIds(r[MOS.photoCol])[0];
      var b = document.createElement("button");
      b.className = "ms-tile" + (r.id === HB.selectedId ? " sel" : ""); b.type = "button"; b.dataset.id = r.id;
      var cap = mosLegend(r);
      b.innerHTML = '<div class="ph"><img loading="lazy" decoding="async" alt=""></div>' + (cap ? '<div class="cap"></div>' : "");
      var img = b.querySelector("img"); img.dataset.att = id; img.src = mosUrl(id);
      if (cap) { b.querySelector(".cap").textContent = cap; b.title = cap; }
      b.addEventListener("click", function () { mosSelect(r.id); });          // clic : sélectionne la ligne
      b.addEventListener("dblclick", function () { mosOpenRow(r.id); });      // double clic : aperçu
      frag.appendChild(b);
    });
    MOS.shown += MOS_PAGE;
    $m("mGrid").appendChild(frag);
  }

  // Sélectionne la ligne dans le tableau du widget principal
  function mosSelect(id) {
    HB.selectedId = id;
    markSelected(true);
    syncSelection();
  }
  function mosMarkSel() {
    var g = $m("mGrid");
    if (!g) { return; }
    var tiles = g.querySelectorAll(".ms-tile");
    for (var i = 0; i < tiles.length; i++) { tiles[i].classList.toggle("sel", tiles[i].dataset.id === String(HB.selectedId)); }
    var sb = $m("mShow");
    if (sb) { sb.disabled = HB.selectedId === null || HB.selectedId === undefined; }
  }

  // ---- aperçu + édition ----
  function mosOpenRow(id) {
    MOS.curRow = id; MOS.curImg = 0;
    var r = MOS.records.find(function (x) { return x.id === id; });
    if (!r) { mosCloseModal(); return; }
    var ids = mosAttIds(r[MOS.photoCol]);
    $m("mBig").src = mosUrl(ids[0]); mosResetZoom();
    var strip = $m("mStrip");
    strip.innerHTML = ids.length > 1 ? ids.map(function (a, i) {
      return '<img data-i="' + i + '" data-att="' + a + '" src="' + mosUrl(a) + '" class="' + (i === 0 ? "cur" : "") + '" alt="">';
    }).join("") : "";
    strip.querySelectorAll("img").forEach(function (im) {
      im.onclick = function () {
        MOS.curImg = +im.dataset.i; $m("mBig").src = mosUrl(im.dataset.att); mosResetZoom();
        strip.querySelectorAll("img").forEach(function (x) { x.classList.toggle("cur", x === im); });
      };
    });
    $m("mTitle").textContent = mosLegend(r) || ("Ligne " + id);
    $m("mPrev").style.display = $m("mNext").style.display = MOS.filtered.length > 1 ? "" : "none";
    mosBuildFields(r);
    $m("mModal").classList.add("on");
    mosSelect(id);
  }

  function mosBuildFields(r) {
    var box = $m("mFields");
    box.innerHTML = "";
    Object.keys(r).filter(function (k) { return !mosHidden(k) && MOS_VIEW_HIDDEN.indexOf(norm(k)) === -1; }).forEach(function (k) {
      var v = r[k], d = document.createElement("div"); d.className = "ms-f";
      var ty = MOS.colType[k] || "", t = typeof v;
      function labelOf(text) { var l = document.createElement("label"); l.textContent = text; d.appendChild(l); }
      function save(fields, ctrl) {
        grist.docApi.applyUserActions([["UpdateRecord", HABITS_TABLE, r.id, fields]]).then(function () {
          d.classList.add("saved"); setTimeout(function () { d.classList.remove("saved"); }, 900);
          scheduleHabits(); scheduleGallery();
        }).catch(function (e) { alert("Modification impossible : " + (e && e.message ? e.message : e)); });
      }
      if (ty.indexOf("Ref:") === 0 && !MOS.roCols.has(k) && MOS.refOpts[k]) {
        labelOf(k);
        var sel = document.createElement("select");
        var cur = r.__raw[k] || 0;
        sel.innerHTML = '<option value="0"></option>';
        MOS.refOpts[k].forEach(function (o) { var op = document.createElement("option"); op.value = o.id; op.textContent = o.text; sel.appendChild(op); });
        sel.value = String(cur);
        sel.addEventListener("change", function () { var f = {}; f[k] = Number(sel.value); save(f); });
        d.appendChild(sel);
      } else if (ty === "Choice" && !MOS.roCols.has(k) && MOS.choiceOpts[k]) {
        labelOf(k);
        var sc = document.createElement("select");
        var cv = v === null || v === undefined ? "" : String(v);
        var list = MOS.choiceOpts[k].slice();
        if (cv && list.indexOf(cv) === -1) { list.unshift(cv); }
        sc.innerHTML = '<option value=""></option>';
        list.forEach(function (c) { var op = document.createElement("option"); op.value = c; op.textContent = c; sc.appendChild(op); });
        sc.value = cv;
        sc.addEventListener("change", function () { var f = {}; f[k] = sc.value; save(f); });
        d.appendChild(sc);
      } else if (!MOS.roCols.has(k) && (t === "string" || t === "number" || t === "boolean" || v === null || v === undefined)) {
        var isNum = /^(Int|Numeric)/.test(ty), isBool = ty === "Bool";
        var long = t === "string" && (v.length > 50 || v.indexOf("\n") !== -1);
        labelOf(k);
        var inp;
        if (isBool) { inp = document.createElement("input"); inp.type = "checkbox"; inp.checked = !!v; }
        else if (long) { inp = document.createElement("textarea"); inp.value = v; inp.rows = 3; }
        else { inp = document.createElement("input"); inp.type = isNum ? "number" : "text"; inp.step = "any"; inp.value = (v === null || v === undefined) ? "" : v; }
        inp.addEventListener("change", function () {
          var nv = isBool ? inp.checked : isNum ? (inp.value === "" ? null : Number(inp.value)) : inp.value;
          var f = {}; f[k] = nv; save(f);
        });
        d.appendChild(inp);
      } else {
        labelOf(k + " (lecture seule)");
        var ro = document.createElement("div"); ro.className = "ro"; ro.textContent = mosFmt(v);
        d.appendChild(ro);
      }
      box.appendChild(d);
    });
  }

  function mosStep(dir) {
    var i = MOS.filtered.findIndex(function (x) { return x.id === MOS.curRow; });
    if (i < 0 || !MOS.filtered.length) { return; }
    mosOpenRow(MOS.filtered[(i + dir + MOS.filtered.length) % MOS.filtered.length].id);
  }
  function mosCloseModal() { $m("mModal").classList.remove("on"); MOS.curRow = null; }

  // ---- zoom de l'image ----
  function mosApplyZoom() {
    var Z = MOS.Z, stage = $m("mStage");
    if (Z.z <= 1) { MOS.Z = Z = { z: 1, x: 0, y: 0 }; }
    $m("mBig").style.transform = "translate(" + Z.x + "px," + Z.y + "px) scale(" + Z.z + ")";
    stage.style.cursor = Z.z > 1 ? (MOS.drag ? "grabbing" : "grab") : "zoom-in";
  }
  function mosZoomAt(nz, cx, cy) {
    nz = Math.min(8, Math.max(1, nz));
    var k = nz / MOS.Z.z;
    MOS.Z.x = cx - (cx - MOS.Z.x) * k; MOS.Z.y = cy - (cy - MOS.Z.y) * k; MOS.Z.z = nz;
    mosApplyZoom();
  }
  function mosResetZoom() { MOS.Z = { z: 1, x: 0, y: 0 }; mosApplyZoom(); }
  function mosStagePt(e) { var b = $m("mStage").getBoundingClientRect(); return [e.clientX - b.left - b.width / 2, e.clientY - b.top - b.height / 2]; }

  // ---- chargement des données de Mes_habits ----
  async function mosLoadMeta() {
    var res = await Promise.all([grist.docApi.fetchTable("_grist_Tables"), grist.docApi.fetchTable("_grist_Tables_column")]);
    var T = res[0], C = res[1];
    var tid = {};
    T.id.forEach(function (id, i) { tid[id] = T.tableId[i]; });
    var byId = {};
    C.id.forEach(function (id, i) {
      byId[id] = { colId: C.colId[i], type: C.type[i], parent: C.parentId[i], pos: C.parentPos[i],
        isFormula: C.isFormula[i], formula: C.formula[i], wo: C.widgetOptions[i], visibleCol: C.visibleCol[i] };
    });
    var meta = Object.keys(byId).map(function (k) { return byId[k]; })
      .filter(function (c) { return tid[c.parent] === HABITS_TABLE && !/^gristHelper_/.test(c.colId) && c.colId !== "manualSort"; })
      .sort(function (a, b) { return a.pos - b.pos; });
    MOS.hiddenCols = new Set(); MOS.roCols = new Set(); MOS.colType = {}; MOS.choiceOpts = {};
    meta.forEach(function (c) {
      MOS.colType[c.colId] = c.type;
      if (c.type === "Choice") { try { var ch = JSON.parse(c.wo || "{}").choices; if (Array.isArray(ch)) { MOS.choiceOpts[c.colId] = ch; } } catch (e) { /* sans liste */ } }
      if (/^Ref(List)?:/.test(c.type)) { c.target = c.type.split(":")[1]; c.show = c.visibleCol && byId[c.visibleCol] ? byId[c.visibleCol].colId : null; }
      if (c.type === "Attachments") { MOS.hiddenCols.add(c.colId); }
      if (c.type.indexOf("RefList:") === 0 || /^Date/.test(c.type) || c.type === "Attachments" || (c.isFormula && c.formula)) { MOS.roCols.add(c.colId); }
    });
    MOS.meta = meta;
    var att = meta.filter(function (c) { return c.type === "Attachments"; });
    var ph = att.filter(function (c) { return norm(c.colId) === "photo"; })[0] || att[0];
    MOS.photoCol = ph ? ph.colId : "Photo";
    function colOf(n) { var c = meta.filter(function (x) { return norm(x.colId) === n; })[0]; return c ? c.colId : null; }
    MOS.hideCol = colOf("supprime");
    MOS.typeCol = colOf("type");
    MOS.legCols = ["marque", "description"].map(colOf).filter(Boolean);
    meta.forEach(function (c) { if (MOS_FORCE_RO.indexOf(norm(c.colId)) !== -1) { MOS.roCols.add(c.colId); } });
  }

  async function mosLoad() {
    if (!MOS.meta) { await mosLoadMeta(); }
    var meta = MOS.meta;
    var raw = await grist.docApi.fetchTable(HABITS_TABLE);
    var refs = {};
    for (var a = 0; a < meta.length; a++) {
      var c0 = meta[a];
      if (c0.target && !refs[c0.target]) {
        var t0 = await grist.docApi.fetchTable(c0.target);
        refs[c0.target] = { t: t0, idx: new Map(t0.id.map(function (id, i) { return [id, i]; })) };
      }
    }
    MOS.refOpts = {};
    meta.forEach(function (c) {
      if (c.target && c.type.indexOf("RefList:") !== 0) {
        var t = refs[c.target].t;
        MOS.refOpts[c.colId] = t.id.map(function (id, i) { return { id: id, text: c.show && t[c.show] ? String(t[c.show][i] === null || t[c.show][i] === undefined ? "" : t[c.show][i]) : String(id) }; })
          .filter(function (o) { return o.text !== ""; }).sort(function (x, y) { return x.text.localeCompare(y.text, "fr", { numeric: true }); });
      }
    });
    function one(c, v) {
      var R = refs[c.target], i = R.idx.get(v);
      if (i === undefined) { return ""; }
      return c.show && R.t[c.show] ? String(R.t[c.show][i] === null || R.t[c.show][i] === undefined ? "" : R.t[c.show][i]) : String(v);
    }
    MOS.records = raw.id.map(function (id, i) {
      var r = { id: id, __raw: {} };
      meta.forEach(function (c) {
        var v = raw[c.colId] ? raw[c.colId][i] : null;
        if (c.target) { r.__raw[c.colId] = v; }
        if (c.type.indexOf("RefList:") === 0) { v = Array.isArray(v) ? v.filter(function (x) { return x !== "L"; }).map(function (x) { return one(c, x); }).join(", ") : ""; }
        else if (c.target) { v = v ? one(c, v) : ""; }
        else if (c.type === "Date" && typeof v === "number") { v = new Date(v * 1000).toLocaleDateString("fr-FR", { timeZone: "UTC" }); }
        else if (/^DateTime/.test(c.type) && typeof v === "number") { v = new Date(v * 1000).toLocaleString("fr-FR"); }
        r[c.colId] = v;
      });
      return r;
    });
  }

  async function mosRefresh() {
    if (!MOS.on) { return; }
    if (MOS.loading) { MOS.again = true; return; }
    MOS.loading = true;
    try {
      if (!MOS.tok) { MOS.tok = await grist.docApi.getAccessToken({ readOnly: true }); }
      await mosLoad();
      mosBuildIndex();
      mosBuildTypes();
      mosApplyFilter(true);
      if (MOS.curRow !== null) {
        var cur = MOS.records.find(function (r) { return r.id === MOS.curRow; });
        if (!cur) { mosCloseModal(); }
        else if (!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { mosBuildFields(cur); }
      }
    } catch (e) { $m("mCount").textContent = "Erreur : " + (e && e.message ? e.message : e); }
    MOS.loading = false;
    if (MOS.again) { MOS.again = false; mosRefresh(); }
  }
  function mosScheduleRefresh() {
    if (!MOS.on) { return; }
    clearTimeout(MOS.rt);
    MOS.rt = setTimeout(mosRefresh, 300);
  }

  function mosToggle(on) {
    MOS.on = on;
    var panel = $m("habits"), btn = $m("hbMos");
    panel.classList.toggle("mosaic-on", on);
    btn.setAttribute("aria-pressed", String(on));
    btn.title = on ? "Revenir au tableau" : "Afficher la mosaïque de photos";
    if (on) { mosRefreshToken(); mosRefresh(); mosMarkSel(); }
    else { mosCloseModal(); clearTimeout(MOS.tokTimer); }
  }

  // « Afficher dans le tableau » : ferme la mosaïque et sélectionne la ligne de la vignette sélectionnée
  async function showInTable() {
    var id = HB.selectedId;
    mosToggle(false);
    if (id === null || id === undefined) { return; }
    if (!document.querySelector('#hbBody tbody tr[data-id="' + id + '"]')) {
      // la ligne est masquée par un filtre du tableau : on les retire pour la rendre visible
      HB.typeSel = ""; HB.empSel = ""; HB.search = ""; HB.only = false; HB.rangerOnly = false;
      $m("hbSearch").value = ""; $m("hbSel").checked = false; $m("hbRanger").checked = false;
      try { localStorage.setItem("selectionPhoto.only", "0"); localStorage.setItem("selectionPhoto.ranger", "0"); } catch (e) { /* non mémorisé */ }
      renderHabits();
    }
    markSelected(true);
  }

  (function mosInit() {
    $m("mShow").addEventListener("click", showInTable);
    $m("hbMos").addEventListener("click", function () {
      if ($m("habits").classList.contains("collapsed")) { LAYOUT = null; applyLayout(); }
      mosToggle(!MOS.on);
    });
    $m("mTypes").addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) { return; }
      MOS.typeSel = b.dataset.v;
      $m("mTypes").querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      mosApplyFilter();
    });
    ["input", "search"].forEach(function (ev) {
      $m("mQ").addEventListener(ev, function () { clearTimeout(MOS.timer); MOS.timer = setTimeout(function () { mosApplyFilter(); }, 120); });
    });
    try {
      var sv = parseInt(localStorage.getItem("selectionPhoto.msSize"), 10);
      if (sv >= 80 && sv <= 400) { $m("mSize").value = String(sv); }
    } catch (e) { /* valeur par défaut */ }
    $m("mos").style.setProperty("--ms-size", $m("mSize").value + "px");
    $m("mSize").addEventListener("input", function (e) {
      $m("mos").style.setProperty("--ms-size", e.target.value + "px");
      try { localStorage.setItem("selectionPhoto.msSize", e.target.value); } catch (er) { /* non mémorisé */ }
    });
    new IntersectionObserver(function (es) { if (es[0].isIntersecting && MOS.shown < MOS.filtered.length) { mosRenderMore(); } },
      { root: $m("mMain"), rootMargin: "600px" }).observe($m("mMore"));

    $m("mClose").addEventListener("click", mosCloseModal);
    $m("mClose2").addEventListener("click", mosCloseModal);
    $m("mPrev").addEventListener("click", function () { mosStep(-1); });
    $m("mNext").addEventListener("click", function () { mosStep(1); });
    $m("mModal").addEventListener("click", function (e) { if (e.target === $m("mModal")) { mosCloseModal(); } });
    document.addEventListener("keydown", function (e) {
      if (MOS.curRow === null) { return; }
      if (e.key === "Escape") { mosCloseModal(); return; }
      var typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
      if (!typing && e.key === "ArrowLeft") { mosStep(-1); }
      if (!typing && e.key === "ArrowRight") { mosStep(1); }
    });

    var stage = $m("mStage");
    stage.addEventListener("wheel", function (e) { e.preventDefault(); var p = mosStagePt(e); mosZoomAt(MOS.Z.z * (e.deltaY < 0 ? 1.2 : 1 / 1.2), p[0], p[1]); }, { passive: false });
    stage.addEventListener("dblclick", function (e) { var p = mosStagePt(e); if (MOS.Z.z > 1) { mosResetZoom(); } else { mosZoomAt(2.5, p[0], p[1]); } });
    stage.addEventListener("pointerdown", function (e) { if (MOS.Z.z > 1) { MOS.drag = { x: e.clientX - MOS.Z.x, y: e.clientY - MOS.Z.y }; stage.setPointerCapture(e.pointerId); mosApplyZoom(); } });
    stage.addEventListener("pointermove", function (e) { if (MOS.drag) { MOS.Z.x = e.clientX - MOS.drag.x; MOS.Z.y = e.clientY - MOS.drag.y; mosApplyZoom(); } });
    stage.addEventListener("pointerup", function () { MOS.drag = null; mosApplyZoom(); });
    $m("mZin").addEventListener("click", function () { mosZoomAt(MOS.Z.z * 1.4, 0, 0); });
    $m("mZout").addEventListener("click", function () { mosZoomAt(MOS.Z.z / 1.4, 0, 0); });
    $m("mZfit").addEventListener("click", mosResetZoom);
  })();

  function applyTableThumb(v) { document.getElementById("hbBody").style.setProperty("--hbh", v + "px"); }
  try {
    var savedH = parseInt(localStorage.getItem("selectionPhoto.hbh"), 10);
    if (savedH >= 30 && savedH <= 200) { document.getElementById("hbSize").value = String(savedH); }
  } catch (e) { /* valeur par défaut */ }
  applyTableThumb(document.getElementById("hbSize").value);
  document.getElementById("hbSize").addEventListener("input", function (ev) {
    applyTableThumb(ev.target.value);
    try { localStorage.setItem("selectionPhoto.hbh", ev.target.value); } catch (e) { /* non mémorisé */ }
  });

  /* Agrandir un cadre : l'autre est réduit à sa barre de titre ; un clic sur cette barre
     (ou le même bouton) ramène la configuration d'origine. */
  var LAYOUT = null;
  function applyLayout() {
    document.getElementById("gallery").classList.toggle("collapsed", LAYOUT === "habits");
    document.getElementById("habits").classList.toggle("collapsed", LAYOUT === "gallery");
    document.getElementById("gMax").textContent = LAYOUT === "gallery" ? "Réduire" : "Agrandir";
    document.getElementById("hbMax").textContent = LAYOUT === "habits" ? "Réduire" : "Agrandir";
  }
  [["gallery", "gMax"], ["habits", "hbMax"]].forEach(function (pair) {
    var panel = document.getElementById(pair[0]);
    document.getElementById(pair[1]).addEventListener("click", function (ev) {
      ev.stopPropagation();
      LAYOUT = (LAYOUT === pair[0]) ? null : pair[0];
      applyLayout();
    });
    panel.querySelector(".g-head").addEventListener("click", function (ev) {
      if (panel.classList.contains("collapsed") && !ev.target.closest("input, label, button, select")) {
        LAYOUT = null;
        applyLayout();
      }
    });
  });

  try { HB.only = localStorage.getItem("selectionPhoto.only") === "1"; } catch (e) { /* valeur par défaut */ }
  document.getElementById("hbSel").checked = HB.only;
  document.getElementById("hbSel").addEventListener("change", function (ev) {
    HB.only = ev.target.checked;
    if (HB.only) { HB.typeSel = ""; HB.empSel = ""; }   // « Sélectionnés » : retour automatique à « TOUS » (types et emplacements)
    try { localStorage.setItem("selectionPhoto.only", HB.only ? "1" : "0"); } catch (e) { /* non mémorisé */ }
    renderHabits();
  });

  (function () {
    var box = document.getElementById("hbSearch"), tm = null;
    box.addEventListener("input", function () {
      clearTimeout(tm);
      tm = setTimeout(function () { HB.search = box.value; renderHabits(); }, 120);
    });
    box.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape" && box.value) { ev.stopPropagation(); box.value = ""; HB.search = ""; renderHabits(); }
    });
  })();
  try { HB.rangerOnly = localStorage.getItem("selectionPhoto.ranger") === "1"; } catch (e) { /* valeur par défaut */ }
  document.getElementById("hbRanger").checked = HB.rangerOnly;
  document.getElementById("hbRanger").addEventListener("change", function (ev) {
    HB.rangerOnly = ev.target.checked;
    try { localStorage.setItem("selectionPhoto.ranger", HB.rangerOnly ? "1" : "0"); } catch (e) { /* non mémorisé */ }
    renderHabits();
  });

  /* -----------------------------------------------------------
     Ce widget doit être lié (« Select by » dans le panneau de
     droite) à la vue principale de Mes_habits, pour connaître la
     ligne actuellement sélectionnée.
     ----------------------------------------------------------- */
  grist.ready({
    columns: [
      { name: "Choix", title: "Colonne à choix unique", type: "Choice", optional: false },
      { name: "Photo", title: "Colonne photo (aperçu de l'historique)", type: "Attachments", optional: true }
    ],
    requiredAccess: "full"
  });

  grist.onRecord(async function (record, mappings) {
    choiceColumn = mappings && mappings.Choix;
    photoColumn = (mappings && mappings.Photo) || null;
    // Le curseur Grist ne change la sélection que lorsqu'il se déplace réellement
    if (record && record.id !== HB.cursorId) {
      HB.cursorId = record.id;
      HB.selectedId = record.id;
      markSelected(true);
    }
    if (record && choiceColumn && record.id === HB.selectedId) { HB.valById[record.id] = record[choiceColumn]; }
    syncSelection();

    await loadChoices();
    render();
    scheduleGallery();
    scheduleHabits();
  });

  // Se met à jour à chaque modification de la table (le contenu est relu via l'API)
  grist.onRecords(function () { scheduleGallery(); scheduleHabits(); mosScheduleRefresh(); });


  grist.onNewRecord(function () {
    HB.cursorId = null;
    HB.selectedId = null;
    markSelected(false);
    syncSelection();
    render();
  });
})();
</script>
</body>
</html>
