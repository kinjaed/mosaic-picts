<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosaïque de photos</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{--bg:#f6f7f5;--fg:#1d2321;--mut:#6b7570;--card:#fff;--line:#d9dedb;--acc:#1f6f5c;--size:180px;--search:#e3f4e7;--pillbg:#eceef2;--sel:#5b46e5}
@media(prefers-color-scheme:dark){:root{--bg:#171b1a;--fg:#e8ecea;--mut:#98a39e;--card:#222827;--line:#343c3a;--acc:#5fc4a9;--search:#243a2d;--pillbg:#2a3130;--sel:#a99bff}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{padding:10px 12px;border-bottom:1px solid var(--line)}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.types{display:flex;flex-wrap:wrap;gap:2px;background:var(--pillbg);border-radius:18px;padding:4px;margin-bottom:10px;max-height:120px;overflow-y:auto}
.types:empty{display:none}
.types button{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.types button:hover{color:var(--fg)}
.types button[aria-pressed=true]{background:var(--card);color:var(--sel);box-shadow:0 1px 3px rgba(0,0,0,.18)}
#q{flex:1 1 220px;min-width:160px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--search);color:var(--fg);font:inherit}
#q:focus,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#count{color:var(--mut);white-space:nowrap}
label.sz{display:flex;gap:6px;align-items:center;color:var(--mut)}
main{flex:1;overflow:auto;padding:12px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--size),1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;padding:0;text-align:left;color:inherit;font:inherit;display:flex;flex-direction:column}
.tile:hover{border-color:var(--acc)}
.tile .ph{aspect-ratio:1/1;background:var(--line);width:100%;overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .cap{padding:6px 8px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--mut);padding:40px;text-align:center}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;z-index:10}
#modal.on{display:flex}
.box{margin:auto;width:min(1100px,96vw);height:min(760px,94vh);background:var(--card);border-radius:10px;display:flex;overflow:hidden}
.view{flex:1 1 60%;background:#0c0f0e;display:flex;flex-direction:column;min-width:0;position:relative}
.view .main{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px}
.view .main{overflow:hidden;touch-action:none;cursor:zoom-in}
.view .main img{width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;will-change:transform}
.zoom{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:2}
.zoom button{background:rgba(0,0,0,.55);color:#fff;border:0;min-width:34px;height:34px;border-radius:6px;font-size:16px;cursor:pointer;padding:0 8px}
.zoom button:hover{background:rgba(0,0,0,.8)}
.nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);color:#fff;border:0;width:36px;height:56px;font-size:22px;cursor:pointer;border-radius:6px}
#prev{left:8px}#next{right:8px}
.strip{display:flex;gap:6px;padding:6px;overflow-x:auto}
.strip img{height:48px;border-radius:4px;cursor:pointer;opacity:.6}
.strip img.cur{opacity:1;outline:2px solid var(--acc)}
.side{flex:0 0 320px;max-width:42%;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.side h2{margin:0;padding:12px 14px;font-size:15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
#fields{flex:1;overflow:auto;padding:10px 14px}
.f{margin-bottom:10px}
.f label{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
.f input[type=text],.f input[type=number],.f textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
.f select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
.f.saved select{border-color:var(--acc)}
.f textarea{resize:vertical;min-height:36px}
.f .ro{padding:6px 8px;color:var(--mut);background:var(--bg);border-radius:6px;word-break:break-word}
.f.saved input,.f.saved textarea{border-color:var(--acc)}
.x{background:none;border:0;color:var(--fg);font-size:20px;cursor:pointer}
@media(max-width:700px){.box{flex-direction:column}.side{flex:0 0 45%;max-width:none;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <div id="types" class="types" role="group" aria-label="Sélection rapide par type"></div>
  <div class="bar">
  <input id="q" type="search" placeholder="Rechercher dans toutes les colonnes…" autocomplete="off">
  <span id="count"></span>
  <label class="sz">Taille <input id="size" type="range" min="100" max="400" value="180"></label>
  </div>
</header>
<main id="main"><div id="grid"></div><div id="more"></div></main>

<div id="modal" role="dialog" aria-modal="true">
  <div class="box">
    <div class="view">
      <div class="main"><img id="big" alt=""></div>
      <div class="zoom"><button id="zout" aria-label="Réduire" title="Réduire">−</button><button id="zfit" title="Adapter à l’espace">Adapter</button><button id="zin" aria-label="Agrandir" title="Agrandir">+</button></div>
      <button class="nav" id="prev" aria-label="Précédent">‹</button>
      <button class="nav" id="next" aria-label="Suivant">›</button>
      <div class="strip" id="strip"></div>
    </div>
    <div class="side">
      <h2><span id="mtitle"></span><button class="x" id="close" aria-label="Fermer">×</button></h2>
      <div id="fields"></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const PAGE = 120;
const TYPE_COL = 'Type';                 // colonne utilisée pour la sélection rapide
const FORCE_READONLY = ['Type', 'Marque']; // colonnes en lecture seule dans la visionneuse
const VIEWER_HIDDEN = ['Cat_taille', 'Select']; // colonnes non affichées dans la visionneuse (restent cherchables)
let records = [], index = [], filtered = [], shown = 0;
let tok = null, curRow = null, curImg = 0;
let typeSel = '', choiceOpts = {}, refOpts = {}, tableId = null, meta = null, photoCol = 'Photo', legCol = null, hiddenCols = new Set(), roCols = new Set(), colType = {}, loading = false, again = false;

// ---------- Utilitaires ----------
const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const attIds = v => Array.isArray(v) ? v.filter(x => typeof x === 'number') : [];
window.onerror = (m) => { $('count').textContent = 'Erreur : ' + m; $('count').style.color = '#c0392b'; };
const url = id => tok ? `${tok.baseUrl}/attachments/${id}/download?auth=${tok.token}` : '';
const fmt = v => v instanceof Date ? v.toLocaleString('fr-FR')
  : Array.isArray(v) ? v.filter(x => x !== 'L').join(', ')
  : (v && typeof v === 'object') ? JSON.stringify(v) : (v ?? '');
const hidden = k => k === 'id' || k === '__raw' || k === photoCol || hiddenCols.has(k);

async function refreshToken() {
  try {
    tok = await grist.docApi.getAccessToken({readOnly: true});
    document.querySelectorAll('img[data-att]').forEach(i => { if (!i.complete) i.src = url(i.dataset.att); });
    setTimeout(refreshToken, Math.max(30000, (tok.ttlMsecs || 300000) - 60000));
  } catch (e) { setTimeout(refreshToken, 10000); }
}

// ---------- Index de recherche ----------
function buildIndex() {
  index = records.map(r => {
    let parts = [];
    for (const k of Object.keys(r)) {
      if (hidden(k)) continue;
      try { parts.push(fmt(r[k])); } catch (e) { parts.push(String(r[k])); }
    }
    return norm(parts.join(' '));
  });
}
function applyFilter(keep) {
  const st = keep ? $('main').scrollTop : 0;
  const terms = norm($('q').value).split(/\s+/).filter(Boolean);
  filtered = [];
  records.forEach((r, i) => {
    if (!attIds(r[photoCol]).length) return;
    if (typeSel && String(r[TYPE_COL] ?? '') !== typeSel) return;
    if (terms.every(t => index[i].includes(t))) filtered.push(r);
  });
  $('count').textContent = `${filtered.length} photo${filtered.length > 1 ? 's' : ''} sur ${records.filter(r => attIds(r[photoCol]).length).length}`;
  $('grid').innerHTML = ''; shown = 0;
  if (!filtered.length) $('grid').innerHTML = `<div class="empty">Aucune photo ne correspond. (${records.length} lignes reçues, colonnes : ${records[0] ? Object.keys(records[0]).filter(k => !k.startsWith('gristHelper_')).join(', ') : 'aucune'})</div>`;
  renderMore();
  while (st && shown < filtered.length && $('grid').scrollHeight < st + $('main').clientHeight + 600) renderMore();
  $('main').scrollTop = st;
}

// ---------- Sélection rapide par type ----------
function buildTypes() {
  const box = $('types');
  const vals = [...new Set(records.filter(r => attIds(r[photoCol]).length).map(r => String(r[TYPE_COL] ?? '')).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, 'fr', {numeric: true}));
  if (!vals.length) { box.innerHTML = ''; return; }
  if (typeSel && !vals.includes(typeSel)) typeSel = '';
  box.innerHTML = '';
  ['', ...vals].forEach(v => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = v || 'Tous'; b.dataset.v = v;
    b.setAttribute('aria-pressed', String(v === typeSel));
    box.appendChild(b);
  });
}
$('types').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  typeSel = b.dataset.v;
  $('types').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  applyFilter();
});

// ---------- Rendu progressif ----------
function renderMore() {
  const frag = document.createDocumentFragment();
  filtered.slice(shown, shown + PAGE).forEach(r => {
    const id = attIds(r[photoCol])[0];
    const b = document.createElement('button');
    b.className = 'tile'; b.type = 'button';
    const cap = r[legCol] != null && r[legCol] !== '' ? fmt(r[legCol]) : '';
    b.innerHTML = `<div class="ph"><img loading="lazy" decoding="async" alt=""></div>${cap ? '<div class="cap"></div>' : ''}`;
    const img = b.querySelector('img'); img.dataset.att = id; img.src = url(id);
    if (cap) { b.querySelector('.cap').textContent = cap; b.title = cap; }
    b.onclick = () => openRow(r.id);
    frag.appendChild(b);
  });
  shown += PAGE;
  $('grid').appendChild(frag);
}
new IntersectionObserver(es => { if (es[0].isIntersecting && shown < filtered.length) renderMore(); },
  {root: $('main'), rootMargin: '600px'}).observe($('more'));

// ---------- Visionneuse + édition ----------
function openRow(id) {
  curRow = id; curImg = 0;
  const r = records.find(x => x.id === id); if (!r) return closeModal();
  const ids = attIds(r[photoCol]);
  $('big').src = url(ids[curImg]); resetZoom();
  $('strip').innerHTML = ids.length > 1 ? ids.map((a, i) =>
    `<img data-i="${i}" data-att="${a}" src="${url(a)}" class="${i === curImg ? 'cur' : ''}" alt="">`).join('') : '';
  $('strip').querySelectorAll('img').forEach(im => im.onclick = () => {
    curImg = +im.dataset.i; $('big').src = url(im.dataset.att); resetZoom();
    $('strip').querySelectorAll('img').forEach(x => x.classList.toggle('cur', x === im));
  });
  const pos = filtered.findIndex(x => x.id === id);
  $('mtitle').textContent = r[legCol] ? fmt(r[legCol]) : `Ligne ${id}`;
  $('prev').style.display = $('next').style.display = filtered.length > 1 ? '' : 'none';
  buildFields(r);
  $('modal').classList.add('on');
  if (pos >= 0) try { grist.setCursorPos({rowId: id}); } catch (e) {}
}
function buildFields(r) {
  const box = $('fields'); box.innerHTML = '';
  Object.keys(r).filter(k => !hidden(k) && !VIEWER_HIDDEN.includes(k)).forEach(k => {
    const v = r[k], d = document.createElement('div'); d.className = 'f';
    const ty = colType[k] || '', t = typeof v;
    if (ty.startsWith('Ref:') && !roCols.has(k) && refOpts[k]) {
      d.innerHTML = `<label></label>`;
      d.firstChild.textContent = k;
      const sel = document.createElement('select');
      const cur = r.__raw[k] || 0;
      sel.innerHTML = '<option value="0"></option>';
      refOpts[k].forEach(o => { const op = document.createElement('option'); op.value = o.id; op.textContent = o.text; sel.appendChild(op); });
      sel.value = String(cur);
      sel.addEventListener('change', async () => {
        try {
          await grist.docApi.applyUserActions([['UpdateRecord', tableId, r.id, {[k]: Number(sel.value)}]]);
          d.classList.add('saved'); setTimeout(() => d.classList.remove('saved'), 900);
        } catch (e) { alert('Modification impossible : ' + e.message); }
      });
      d.appendChild(sel);
    } else if (ty === 'Choice' && !roCols.has(k) && choiceOpts[k]) {
      d.innerHTML = `<label></label>`;
      d.firstChild.textContent = k;
      const sel = document.createElement('select');
      const cur = v == null ? '' : String(v);
      const list = choiceOpts[k].slice();
      if (cur && !list.includes(cur)) list.unshift(cur);
      sel.innerHTML = '<option value=""></option>';
      list.forEach(c => { const op = document.createElement('option'); op.value = c; op.textContent = c; sel.appendChild(op); });
      sel.value = cur;
      sel.addEventListener('change', async () => {
        try {
          await grist.docApi.applyUserActions([['UpdateRecord', tableId, r.id, {[k]: sel.value}]]);
          d.classList.add('saved'); setTimeout(() => d.classList.remove('saved'), 900);
        } catch (e) { alert('Modification impossible : ' + e.message); }
      });
      d.appendChild(sel);
    } else if (!roCols.has(k) && (t === 'string' || t === 'number' || t === 'boolean' || v == null)) {
      const isNum = /^(Int|Numeric)/.test(ty), isBool = ty === 'Bool';
      const long = t === 'string' && (v.length > 50 || v.includes('\n'));
      d.innerHTML = `<label></label>`;
      d.firstChild.textContent = k;
      let inp;
      if (isBool) { inp = document.createElement('input'); inp.type = 'checkbox'; inp.checked = !!v; }
      else if (long) { inp = document.createElement('textarea'); inp.value = v; inp.rows = 3; }
      else { inp = document.createElement('input'); inp.type = isNum ? 'number' : 'text'; inp.step = 'any'; inp.value = v ?? ''; }
      inp.addEventListener('change', async () => {
        const nv = isBool ? inp.checked : isNum ? (inp.value === '' ? null : Number(inp.value)) : inp.value;
        try {
          await grist.docApi.applyUserActions([['UpdateRecord', tableId, r.id, {[k]: nv}]]);
          d.classList.add('saved'); setTimeout(() => d.classList.remove('saved'), 900);
        } catch (e) { alert('Modification impossible : ' + e.message); }
      });
      d.appendChild(inp);
    } else {
      d.innerHTML = `<label></label><div class="ro"></div>`;
      d.firstChild.textContent = k + ' (lecture seule)';
      d.lastChild.textContent = fmt(v);
    }
    box.appendChild(d);
  });
}
function step(d) {
  const i = filtered.findIndex(x => x.id === curRow);
  if (i < 0 || !filtered.length) return;
  openRow(filtered[(i + d + filtered.length) % filtered.length].id);
}
function closeModal() { $('modal').classList.remove('on'); curRow = null; }
$('close').onclick = closeModal;
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
document.addEventListener('keydown', e => {
  if (!curRow) return;
  if (e.key === 'Escape') closeModal();
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (!typing && e.key === 'ArrowLeft') step(-1);
  if (!typing && e.key === 'ArrowRight') step(1);
});

// ---------- Zoom de l'image ----------
let Z = {z: 1, x: 0, y: 0}, drag = null;
const bigEl = $('big'), stage = document.querySelector('.view .main');
function applyZoom() {
  if (Z.z <= 1) Z = {z: 1, x: 0, y: 0};
  bigEl.style.transform = `translate(${Z.x}px,${Z.y}px) scale(${Z.z})`;
  stage.style.cursor = Z.z > 1 ? (drag ? 'grabbing' : 'grab') : 'zoom-in';
}
function zoomAt(nz, cx, cy) {
  nz = Math.min(8, Math.max(1, nz));
  const k = nz / Z.z; Z.x = cx - (cx - Z.x) * k; Z.y = cy - (cy - Z.y) * k; Z.z = nz; applyZoom();
}
function resetZoom() { Z = {z: 1, x: 0, y: 0}; applyZoom(); }
function stagePt(e) { const b = stage.getBoundingClientRect(); return [e.clientX - b.left - b.width / 2, e.clientY - b.top - b.height / 2]; }
stage.addEventListener('wheel', e => { e.preventDefault(); const [cx, cy] = stagePt(e); zoomAt(Z.z * (e.deltaY < 0 ? 1.2 : 1 / 1.2), cx, cy); }, {passive: false});
stage.addEventListener('dblclick', e => { const [cx, cy] = stagePt(e); Z.z > 1 ? resetZoom() : zoomAt(2.5, cx, cy); });
stage.addEventListener('pointerdown', e => { if (Z.z > 1) { drag = {x: e.clientX - Z.x, y: e.clientY - Z.y}; stage.setPointerCapture(e.pointerId); applyZoom(); } });
stage.addEventListener('pointermove', e => { if (drag) { Z.x = e.clientX - drag.x; Z.y = e.clientY - drag.y; applyZoom(); } });
stage.addEventListener('pointerup', () => { drag = null; applyZoom(); });
$('zin').onclick = () => zoomAt(Z.z * 1.4, 0, 0);
$('zout').onclick = () => zoomAt(Z.z / 1.4, 0, 0);
$('zfit').onclick = resetZoom;

// ---------- Contrôles ----------
let timer;
['input', 'keyup', 'search', 'change'].forEach(ev =>
  $('q').addEventListener(ev, () => { clearTimeout(timer); timer = setTimeout(applyFilter, 100); }));
$('size').addEventListener('input', e => document.documentElement.style.setProperty('--size', e.target.value + 'px'));

// ---------- Grist ----------
async function loadMeta() {
  tableId = await grist.selectedTable.getTableId();
  const [T, C] = await Promise.all([grist.docApi.fetchTable('_grist_Tables'), grist.docApi.fetchTable('_grist_Tables_column')]);
  const tid = {}; T.id.forEach((id, i) => tid[id] = T.tableId[i]);
  const byId = {};
  C.id.forEach((id, i) => byId[id] = {colId: C.colId[i], type: C.type[i], parent: C.parentId[i], pos: C.parentPos[i],
    isFormula: C.isFormula[i], formula: C.formula[i], wo: C.widgetOptions[i], visibleCol: C.visibleCol[i]});
  meta = Object.values(byId).filter(c => tid[c.parent] === tableId && !c.colId.startsWith('gristHelper_') && c.colId !== 'manualSort')
    .sort((a, b) => a.pos - b.pos);
  hiddenCols = new Set(); roCols = new Set(); colType = {}; choiceOpts = {};
  meta.forEach(c => {
    colType[c.colId] = c.type;
    if (c.type === 'Choice') { try { const ch = JSON.parse(c.wo || '{}').choices; if (Array.isArray(ch)) choiceOpts[c.colId] = ch; } catch (e) {} }
    if (/^Ref(List)?:/.test(c.type)) { c.target = c.type.split(':')[1]; c.show = c.visibleCol && byId[c.visibleCol] ? byId[c.visibleCol].colId : null; }
    if (c.type === 'Attachments') hiddenCols.add(c.colId);
    if (c.type.startsWith('RefList:') || /^Date/.test(c.type) || c.type === 'Attachments' || (c.isFormula && c.formula)) roCols.add(c.colId);
  });
  FORCE_READONLY.forEach(k => { if (colType[k]) roCols.add(k); });
}
async function load() {
  if (!meta) await loadMeta();
  const raw = await grist.docApi.fetchTable(tableId);
  const refs = {};
  for (const c of meta) if (c.target && !refs[c.target]) {
    const t = await grist.docApi.fetchTable(c.target);
    refs[c.target] = {t, idx: new Map(t.id.map((id, i) => [id, i]))};
  }
  refOpts = {};
  for (const c of meta) if (c.target && !c.type.startsWith('RefList:')) {
    const t = refs[c.target].t;
    refOpts[c.colId] = t.id.map((id, i) => ({id, text: c.show && t[c.show] ? String(t[c.show][i] ?? '') : String(id)}))
      .filter(o => o.text !== '').sort((a, b) => a.text.localeCompare(b.text, 'fr', {numeric: true}));
  }
  const one = (c, v) => {
    const R = refs[c.target], i = R.idx.get(v);
    if (i === undefined) return '';
    return c.show && R.t[c.show] ? String(R.t[c.show][i] ?? '') : String(v);
  };
  records = raw.id.map((id, i) => {
    const r = {id, __raw: {}};
    for (const c of meta) {
      let v = raw[c.colId] ? raw[c.colId][i] : null;
      if (c.target) r.__raw[c.colId] = v;
      if (c.type.startsWith('RefList:')) v = Array.isArray(v) ? v.filter(x => x !== 'L').map(x => one(c, x)).join(', ') : '';
      else if (c.target) v = v ? one(c, v) : '';
      else if (c.type === 'Date' && typeof v === 'number') v = new Date(v * 1000).toLocaleDateString('fr-FR', {timeZone: 'UTC'});
      else if (/^DateTime/.test(c.type) && typeof v === 'number') v = new Date(v * 1000).toLocaleString('fr-FR');
      r[c.colId] = v;
    }
    return r;
  });
}
async function refresh() {
  if (loading) { again = true; return; }
  loading = true;
  try {
    await load();
    buildIndex();
    buildTypes();
    applyFilter(true);
    if (curRow) {
      if (!records.some(r => r.id === curRow)) closeModal();
      else if (!/INPUT|TEXTAREA/.test(document.activeElement.tagName)) buildFields(records.find(r => r.id === curRow));
    }
  } catch (e) { $('count').textContent = 'Erreur : ' + (e.message || e); $('count').style.color = '#c0392b'; }
  loading = false;
  if (again) { again = false; refresh(); }
}
grist.ready({
  requiredAccess: 'full',
  allowSelectBy: true,
  columns: [
